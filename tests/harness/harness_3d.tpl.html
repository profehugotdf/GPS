}async function fetchDemList(list,z,prog){

async function showMultiPick(id){

/* une los tracks en uno solo, con las etapas marcadas (y pulso, potencia y cadencia si los hay) */
function multiTrack(trs){
  trs=trs.slice().sort((a,b)=>trBeg(a)-trBeg(b));
  const pts=[],hr=[],pw=[],cad=[],legs=[];let seg=0;
  for(const t of trs){
    const i0=pts.length;let mx=0;
    t.pts.forEach((p,i)=>{pts.push([p[0],p[1],p[2],p[3],p[4],seg+(p[5]||0)]);mx=Math.max(mx,p[5]||0);hr.push(t.hr?t.hr[i]:null);pw.push(t.pw?t.pw[i]:null);cad.push(t.cad?t.cad[i]:null);});
    seg+=mx+1;
    const st=t.stats||calcStats(t.pts);
    legs.push({i0,i1:pts.length-1,act:t.act||guessAct(t)||'walk',name:t.name,dur:trEnd(t)-trBeg(t),dist:st.dist||0});
  }
  /* transiciones: etapas cortas entre otras dos */
  let tn=0;legs.forEach((l,k)=>{if(k>0&&k<legs.length-1&&l.dur<20*60000&&l.dist<2500){l.tr=true;l.lab='T'+(++tn);}});

  return o;
}
