<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0E2A36">
<title>Rumbo</title>
<link rel="stylesheet" href="lib/leaflet.css">
<style>
:root{
  --ink:#0E2A36; --paper:#F3F6F2; --foam:#fff; --buoy:#F04A1C; --kelp:#2E7D5B;
  --violet:#6B3FA0; --sand:#D8CBA6; --line:#C6D1CA; --mut:#566B74;
  --num:"Roboto Condensed","sans-serif-condensed","Arial Narrow",system-ui,sans-serif;
  --top:max(env(safe-area-inset-top),0px); --bot:max(env(safe-area-inset-bottom),0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--ink);color:var(--ink);
  font:16px/1.35 system-ui,Roboto,sans-serif;touch-action:manipulation;-webkit-user-select:none;user-select:none}
input,select{-webkit-user-select:text;user-select:text}
#map{position:fixed;inset:0;background:#cfd8d3}
.leaflet-control-attribution{font-size:10px!important;margin-bottom:0!important}
[hidden]{display:none!important}
.leaflet-bottom.leaflet-right{bottom:calc(var(--bot) + 74px)}
.leaflet-bottom.leaflet-left{bottom:calc(var(--bot) + 74px)}

/* HUD */
#hud{position:fixed;left:0;right:0;top:0;z-index:1000;background:var(--paper);
  padding:calc(var(--top) + 6px) 10px 8px;border-bottom:4px solid var(--buoy);display:none}
#hud.on{display:block}
.hud-row{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:8px}
.hc b{display:block;font:700 38px/1 var(--num);font-variant-numeric:tabular-nums;letter-spacing:.5px}
.hc small{color:var(--mut);font-size:12px}
#hSpWrap{text-align:right}
.hcirc{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:6px;padding-top:6px;border-top:1px solid var(--line)}
.hcirc b{font:700 26px/1 var(--num);font-variant-numeric:tabular-nums}
.hcirc span{font-size:13px;color:var(--mut)}
.hcirc .d{font:700 20px/1 var(--num);color:var(--buoy)}
.hcirc .d.good{color:var(--kelp)}
.hud-foot{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:12px;color:var(--mut)}
#pill{position:fixed;left:10px;top:calc(var(--top) + 10px);z-index:900;background:var(--paper);border-radius:20px;
  padding:6px 12px;font-size:13px;font-weight:600;display:flex;gap:8px;align-items:center;box-shadow:0 1px 6px rgba(0,0,0,.25)}
#pill i{width:10px;height:10px;border-radius:50%;background:#999;display:block}
#pill.ok i{background:var(--kelp)} #pill.mid i{background:#E0A100} #pill.bad i{background:var(--buoy)}
#hud.on ~ #pill{display:none}
#banner{position:fixed;left:10px;right:10px;top:calc(var(--top) + 10px);z-index:1200;background:var(--ink);color:#fff;
  border-radius:14px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:600}
#banner[hidden]{display:none}

/* Botones flotantes */
#fabs{position:fixed;right:10px;bottom:calc(var(--bot) + 104px);z-index:900;display:flex;flex-direction:column;gap:7px}
#fabs button{width:48px;height:48px;border-radius:14px;border:0;background:var(--paper);color:var(--ink);font-size:24px;
  box-shadow:0 1px 6px rgba(0,0,0,.3)}
#fabs button.on{background:var(--ink);color:#fff}

/* Dock */
#dock{position:fixed;left:0;right:0;bottom:0;z-index:1000;display:grid;grid-template-columns:1fr 1fr 100px 1fr 1fr;
  align-items:end;background:var(--paper);padding:6px 4px calc(var(--bot) + 6px);border-top:1px solid var(--line)}
#dock button{background:none;border:0;padding:4px 0;font:600 12px system-ui;color:var(--ink);
  display:flex;flex-direction:column;align-items:center;gap:2px;min-height:54px;justify-content:flex-end}
#dock .ico{font-size:24px;line-height:1.1}
#recbtn{width:82px;height:82px;border-radius:50%!important;background:var(--buoy)!important;color:#fff!important;
  margin:-34px auto 0;border:5px solid var(--paper)!important;box-shadow:0 0 0 3px var(--buoy),0 4px 10px rgba(0,0,0,.3);
  font:800 17px system-ui!important;justify-content:center!important;min-height:0!important;padding:0!important}
#recbtn.live{background:var(--ink)!important;box-shadow:0 0 0 3px var(--ink),0 4px 10px rgba(0,0,0,.3)}
#recbtn .ico{font-size:30px}

/* Hoja inferior */
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:1100;background:var(--paper);border-radius:18px 18px 0 0;
  max-height:84vh;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .22s ease;
  box-shadow:0 -6px 24px rgba(0,0,0,.3)}
#sheet.open{transform:none}
#sHead{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line)}
#sHead h2{margin:0;font-size:19px}
#sX{width:44px;height:44px;border:0;background:none;font-size:26px;color:var(--ink)}
#sBody{overflow:auto;padding:12px 16px calc(18px + var(--bot));-webkit-overflow-scrolling:touch}
h3{margin:18px 0 6px;font-size:15px}
p{margin:6px 0}
.mut{color:var(--mut)} small.mut{font-size:13px}
.btn{min-height:48px;padding:10px 16px;border-radius:12px;border:2px solid var(--ink);background:var(--foam);
  font:700 15px system-ui;color:var(--ink);margin:4px 4px 4px 0}
.btn.primary{background:var(--ink);color:#fff}
.btn.rec{background:var(--buoy);border-color:var(--buoy);color:#fff}
.btn.danger{border-color:var(--buoy);color:var(--buoy)}
.btn.sm{min-height:40px;padding:6px 12px;font-size:14px}
.btn.big{min-height:76px;font-size:15px;line-height:1.3}
.btn[disabled]{opacity:.4}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid3 .btn{margin:0}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.item>div:first-child{min-width:0}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1 1 44%;min-height:46px;border-radius:12px;border:2px solid var(--line);background:var(--foam);
  font:600 14px system-ui;color:var(--ink)}
.seg button.on{border-color:var(--ink);background:var(--ink);color:#fff}
.in{width:100%;min-height:48px;border:2px solid var(--line);border-radius:12px;padding:8px 12px;font:16px system-ui;
  background:var(--foam);color:var(--ink)}
label{display:block;font-size:14px;font-weight:600;margin:12px 0 4px}
label.chk{display:flex;gap:10px;align-items:center;font-weight:500;min-height:44px}
label.chk input{width:24px;height:24px}
input[type=range]{width:100%;height:36px}
.bar{height:12px;border-radius:6px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--kelp)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.stats div{background:var(--foam);border-radius:12px;padding:8px 10px}
.stats b{display:block;font:700 24px/1.1 var(--num);font-variant-numeric:tabular-nums}
.stats small{color:var(--mut);font-size:12px}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
.tbl th,.tbl td{padding:7px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl th{font-size:12px;color:var(--mut);font-weight:600}
.tbl .bl{color:var(--kelp);font-weight:800} .tbl .bs{color:var(--violet);font-weight:800}
.tblw{overflow-x:auto}
.gl{background:var(--ink);color:#fff;border-radius:50%;width:24px;height:24px;display:flex;align-items:center;
  justify-content:center;font:700 13px system-ui;border:2px solid #fff}
.gl.s{background:var(--buoy);width:30px;height:30px;font-size:16px}
.wp{font-size:26px;text-shadow:0 0 3px #fff,0 0 3px #fff;line-height:1}
#toast{position:fixed;left:50%;bottom:calc(var(--bot) + 120px);transform:translateX(-50%);z-index:1300;background:var(--ink);
  color:#fff;padding:10px 16px;border-radius:12px;font-weight:600;max-width:88vw;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{min-height:46px;padding:6px 12px;border-radius:23px;border:2px solid var(--line);background:var(--foam);font:600 14px system-ui;color:var(--ink)}
.chips button.on{border-color:var(--ink);background:var(--ink);color:#fff}
.card{background:var(--foam);border-radius:14px;padding:10px 12px;margin:8px 0;border:2px solid transparent}
.card.on{border-color:var(--ink)}
.card .big{font:700 28px/1.1 var(--num)}
.badges{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.badge{background:var(--foam);border-radius:14px;padding:10px;opacity:.5}
.badge.have{opacity:1;border:2px solid var(--kelp)}
.badge .ic{font-size:28px}
.arrow{font-size:30px;color:#F04A1C;text-shadow:0 0 3px #fff,0 0 3px #fff;line-height:1;width:30px;text-align:center}
.ghost{font-size:26px;line-height:1;filter:drop-shadow(0 0 3px #fff)}
#banner .row{flex-wrap:nowrap}
#banner .btn{margin:0}
#fabs button{font-size:22px}

#nav{position:fixed;left:8px;right:66px;bottom:calc(var(--bot) + 104px);z-index:950;background:var(--ink);color:#fff;border-radius:16px;padding:10px 12px;box-shadow:0 2px 10px rgba(0,0,0,.4)}
#nav[hidden]{display:none}
.nvm{display:flex;gap:10px;align-items:center}
#nvIco{font-size:40px;line-height:1}
.nvt b{display:block;font-size:17px;line-height:1.2}
.nvt span{font:700 22px var(--num)}
.nvr{display:flex;justify-content:space-between;font-size:13px;opacity:.85;margin:6px 0}
.nvb{display:flex;gap:6px}
.nvb button{flex:1;min-height:44px;border-radius:12px;border:0;font:600 13px system-ui;background:#264b5c;color:#fff}
.nvb #nvEnd{background:var(--buoy)}

#pin{position:fixed;left:8px;right:66px;bottom:calc(var(--bot) + 104px);z-index:950;background:var(--paper);color:var(--ink);border-radius:16px;padding:10px 12px;box-shadow:0 2px 10px rgba(0,0,0,.4)}
#pin[hidden]{display:none}
#pin b{display:block;font-size:17px}
#pin small{color:#566B74}
#pin .nvb{margin-top:8px}
#pin .nvb button{background:var(--foam);color:var(--ink)}
#pin .nvb #pinGo{background:var(--ink);color:#fff;flex:2}
.tag{display:inline-block;background:var(--kelp);color:#fff;border-radius:8px;padding:0 6px;font-size:12px;font-weight:700}

body.night{color-scheme:dark;--ink:#E4EDEF;--paper:#0F1E27;--foam:#182C38;--line:#2B4552;--mut:#93A9B2;background:#0b151b}
body.night .btn.primary,body.night .seg button.on,body.night .chips button.on,body.night #fabs button.on,body.night #pin .nvb #pinGo{background:#E4EDEF;color:#0E2A36}
body.night #banner,body.night #nav,body.night #toast,body.night .gl{background:#21485B;color:#fff}
body.night .gl.s{background:var(--buoy)}
body.night #recbtn.live{background:#E4EDEF!important;color:#0E2A36!important;box-shadow:0 0 0 3px #E4EDEF,0 4px 10px rgba(0,0,0,.5)}
body.night .btn{border-color:#6B8794}
body.night .btn.primary{border-color:#E4EDEF}
body.night .btn.danger{border-color:var(--buoy);color:#FF8A63}
body.night .card.on{border-color:#E4EDEF}
body.night #pin small{color:var(--mut)}
body.night .tbl .bl{color:#5CD69B}
body.night .tbl .bs{color:#B99CE8}
body.night svg rect[fill="#0E2A36"]{fill:#7FA2B3}
body.night svg text{fill:#93A9B2}
body.night #map{background:#0b151b}
body.night .leaflet-tile-pane{filter:brightness(.6) contrast(1.05) saturate(.85)}
body.night.inv .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.85) contrast(.9)}
body.night .leaflet-ovl-pane img{filter:brightness(.7)}
body.night .leaflet-control-attribution{background:rgba(15,30,39,.75)!important;color:#93A9B2}
body.night .leaflet-control-attribution a{color:#9fc4d6}

#cap{position:fixed;left:8px;right:8px;bottom:calc(var(--bot) + 84px);z-index:960;background:var(--paper);color:var(--ink);border-radius:16px;padding:10px 12px;box-shadow:0 2px 12px rgba(0,0,0,.45)}
#cap[hidden]{display:none}
.caph{display:flex;justify-content:space-between;align-items:center}
.caph b{font-size:16px}
#capX{width:40px;height:40px;border:0;background:none;font-size:22px;color:var(--ink)}
#cap .chips button{min-height:38px;padding:4px 12px;font-size:14px}
.caprow{display:flex;align-items:center;gap:8px;margin-top:6px}
.caprow label{margin:0;flex:1;font-size:13px}
.caprow button{min-width:46px;min-height:40px;border-radius:10px;border:2px solid var(--line);background:var(--foam);color:var(--ink);font:700 14px system-ui}
#cap input[type=range]{height:28px;flex:1}
#capInfo,#capmsg{display:block;color:var(--mut);font-size:12px;margin-top:4px}
#cap .nvb button{background:var(--ink);color:#fff}
#cap .nvb button[disabled]{opacity:.4}
body.night #cap .nvb button{background:#E4EDEF;color:#0E2A36}

.gicon{position:relative;width:60px;height:60px}
.gicon .gl{position:absolute;left:15px;top:15px}
.gicon .gar{position:absolute;inset:0;pointer-events:none}
.gicon .gar i{position:absolute;left:23px;top:-2px;font-style:normal;font-size:15px;line-height:1;color:#F04A1C;text-shadow:0 0 3px #fff,0 0 3px #fff}
.gicon .gar i.b{top:auto;bottom:-2px;transform:rotate(180deg)}
#gate{position:fixed;left:8px;right:8px;bottom:calc(var(--bot) + 84px);z-index:965;background:var(--paper);color:var(--ink);border-radius:16px;padding:8px 12px;box-shadow:0 2px 12px rgba(0,0,0,.45);max-height:62vh;overflow:auto}
#gate[hidden]{display:none}
#gate .chips{margin-top:6px}
#gate .chips button{min-height:36px;padding:3px 10px;font-size:13px}
.gnum{width:64px;min-height:40px;border-radius:10px;border:2px solid var(--line);background:var(--foam);color:var(--ink);font:700 15px system-ui;text-align:center}
.gdialrow{display:flex;gap:10px;align-items:center;margin-top:8px}
#gDial{touch-action:none;flex:none;cursor:pointer}
.gdialctl{flex:1}
#gBv{font:700 20px var(--num);margin-bottom:4px}
.gdialctl .rowb{display:flex;gap:5px;margin-top:5px;align-items:center}
.gdialctl button{flex:1;min-height:38px;border-radius:10px;border:2px solid var(--line);background:var(--foam);color:var(--ink);font:700 13px system-ui;padding:0 4px}
#gDirNote{display:block;color:var(--mut);font-size:12px;margin-top:4px}
#gate .nvb{margin-top:8px}
#gate .nvb button{background:var(--ink);color:#fff}
#gate .nvb #gDel,#gate .nvb #gCancel{background:var(--foam);color:var(--ink);border:2px solid var(--line)}
body.night #gate .nvb #gOk{background:#E4EDEF;color:#0E2A36}

.posm{position:relative;width:34px;height:34px}
.posd{position:absolute;left:8px;top:8px;width:18px;height:18px;border-radius:50%;background:#1E6BFF;border:3px solid #fff;box-shadow:0 0 6px rgba(0,0,0,.55)}
.posa{position:absolute;left:0;top:0;width:34px;height:34px;transition:transform .25s}
.posa::before{content:"";position:absolute;left:9px;top:-9px;border-left:8px solid transparent;border-right:8px solid transparent;border-bottom:15px solid #1E6BFF;filter:drop-shadow(0 0 2px #fff) drop-shadow(0 0 2px #fff)}
.posa.off{display:none}
#nav{top:var(--navtop,calc(var(--top) + 52px));bottom:auto;left:8px;right:8px;background:rgba(14,42,54,var(--navA,.42));-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);text-shadow:0 1px 3px rgba(0,0,0,.85);box-shadow:none;border:1px solid rgba(255,255,255,.25)}
body.night #nav{background:rgba(9,20,27,var(--navA,.42))}
#nav .nvb button{background:rgba(38,75,92,.6);color:#fff;text-shadow:none}
#nav .nvb #nvEnd{background:rgba(240,74,28,.85)}
#fNorth{position:fixed;right:10px;bottom:calc(var(--bot) + 380px);z-index:900;width:48px;height:48px;border-radius:14px;border:0;background:var(--paper);color:var(--ink);font:800 18px system-ui;box-shadow:0 1px 6px rgba(0,0,0,.3)}
#fNorth[hidden]{display:none}

body.night.vec .leaflet-tile-pane{filter:none}

#trace{position:fixed;left:8px;right:8px;bottom:calc(var(--bot) + 84px);z-index:962;background:var(--paper);color:var(--ink);border-radius:16px;padding:8px 12px;box-shadow:0 2px 12px rgba(0,0,0,.45)}
#trace[hidden]{display:none}
#trace .chips{margin-top:6px}
#trace .chips button{min-height:36px;padding:3px 10px;font-size:13px}
#trace #trName{margin-top:6px;min-height:40px}
#trInfo{display:block;color:var(--mut);font-size:12px;margin-top:6px}
#trace .nvb button{background:var(--ink);color:#fff}
#trace .nvb button[disabled]{opacity:.4}
body.night #trace .nvb button{background:#E4EDEF;color:#0E2A36}

.nodem{font-size:22px;text-shadow:0 0 3px #fff,0 0 3px #fff;line-height:1}
#nodep{position:fixed;left:8px;right:8px;bottom:calc(var(--bot) + 84px);z-index:963;background:var(--paper);color:var(--ink);border-radius:16px;padding:8px 12px;box-shadow:0 2px 12px rgba(0,0,0,.45);max-height:62vh;overflow:auto}
#nodep[hidden]{display:none}
#nodep .chips{margin-top:6px}
#nodep .chips button{min-height:36px;padding:3px 10px;font-size:13px;text-align:left}
#nodep .chips button[disabled]{opacity:.4}
#nodep .caprow{align-items:flex-start;flex-direction:column;gap:2px}
#npInfo,#npHint{display:block;color:var(--mut);font-size:13px;margin-top:6px}
#nodep .nvb button{background:var(--ink);color:#fff}
#nodep .nvb button[disabled]{opacity:.4}
body.night #nodep .nvb button{background:#E4EDEF;color:#0E2A36}
#capCtr{align-items:center}

.sw{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:2px}

#pin .nvb{flex-wrap:wrap}
#pin .nvb button{flex:1 1 28%}
#pin .nvb #pinGo{flex:2 1 52%}
</style>
</head>
<body>
<div id="map"></div>

<header id="hud">
  <div class="hud-row">
    <div class="hc"><b id="hT">0:00</b><small>tiempo</small></div>
    <div class="hc"><b id="hD">0 m</b><small>distancia</small></div>
    <div class="hc" id="hSpWrap"><b id="hS">0.0</b><small id="hSU">km/h</small></div>
  </div>
  <div id="hCirc" class="hcirc" hidden></div>
  <div class="hud-foot"><span id="hGps">Buscando GPS…</span><button class="btn sm" id="hStop">Terminar</button></div>
</header>
<div id="pill"><i></i><span>Buscando GPS…</span></div>
<div id="nav" hidden>
  <div class="nvm"><span id="nvIco">⬆️</span><div class="nvt"><b id="nvTxt"></b><span id="nvDist"></span></div></div>
  <div class="nvr"><span id="nvEta"></span><span id="nvRem"></span></div>
  <div class="nvb"><button id="nvMute">🔊</button><button id="nvPozo">🕳️ Pozo</button><button id="nvLomo">🚧 Lomo</button><button id="nvEnd">Terminar</button></div>
</div>
<div id="nodep" hidden>
  <div class="caph"><b id="npTtl">🚫 Giros prohibidos y barreras</b><button id="npX" aria-label="Cerrar">✕</button></div>
  <small id="npHint">Tocá una esquina (para un giro) o un punto de la calle (para una barrera).</small>
  <div id="npBody" hidden>
    <div class="chips" id="npType"><button data-t="turn">🚫 Giro</button><button data-t="barrier">⛔ Barrera</button></div>
    <div id="npTurn">
      <div class="caprow"><label>Venís por</label><div class="chips" id="npFrom"></div></div>
      <div class="caprow"><label>Hacia</label><div class="chips" id="npTo"></div></div>
      <div class="chips" id="npKind"><button data-k="no">🚫 Prohibido girar</button><button data-k="only">⬆ Solo hacia ahí</button></div>
      <div class="chips-chk"><label class="chk"><input type="checkbox" id="npCar" checked> 🚗 Autos</label><label class="chk"><input type="checkbox" id="npBike" checked> 🚴 Bicis</label></div>
    </div>
    <div id="npBar" hidden><label>Corta el paso de</label><div class="chips-chk"><label class="chk"><input type="checkbox" id="nbF"> 🚶 Peatones</label><label class="chk"><input type="checkbox" id="nbB" checked> 🚴 Bicis</label><label class="chk"><input type="checkbox" id="nbC" checked> 🚗 Autos</label></div></div>
    <input class="in" id="npName" placeholder="Nombre o nota (opcional)">
    <small id="npInfo"></small>
    <div class="nvb"><button id="npOk">✓ Guardar</button><button id="npCancel">Otro punto</button></div>
  </div>

<script>if(!window.L){document.write('<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"><\/script>')}</script>
<script src="lib/leaflet-rotate.js"></script>
<script>
'use strict';
/* =====================================================================
   RUMBO — mapa, tracks, puntos y puertas (sectores/vueltas)
   ===================================================================== */

/*<pure>*/
const rad=Math.PI/180, R_EARTH=6371008.8;
const pad2=n=>String(n).padStart(2,'0');

/* Distancia entre [lat,lon] y [lat,lon] en metros */
function hav(a,b){
  const dLat=(b[0]-a[0])*rad, dLon=(b[1]-a[1])*rad;
  const x=Math.sin(dLat/2)**2+Math.cos(a[0]*rad)*Math.cos(b[0]*rad)*Math.sin(dLon/2)**2;
  return 2*R_EARTH*Math.asin(Math.sqrt(x));
}
/* Rumbo en grados (0=norte) de a hacia b */
function bearingTo(a,b){
  const y=Math.sin((b[1]-a[1])*rad)*Math.cos(b[0]*rad);
  const x=Math.cos(a[0]*rad)*Math.sin(b[0]*rad)-Math.sin(a[0]*rad)*Math.cos(b[0]*rad)*Math.cos((b[1]-a[1])*rad);
  return (Math.atan2(y,x)/rad+360)%360;
}
/* ¿El tramo p→q cruza la puerta g? Devuelve la fracción u (0..1) sobre p→q, o null */
function crossFrac(p,q,g){
  const lat0=g.a[0], k=Math.cos(lat0*rad);
  const X=pt=>[(pt[1]-g.a[1])*111320*k,(pt[0]-lat0)*110540];
  const P=X(p),Q=X(q),B=X(g.b);
  const rx=Q[0]-P[0], ry=Q[1]-P[1], sx=B[0], sy=B[1];
  const den=rx*sy-ry*sx;
  if(Math.abs(den)<1e-9) return null;
  const u=((0-P[0])*sy-(0-P[1])*sx)/den;
  const v=((0-P[0])*ry-(0-P[1])*rx)/den;
  return (u>=0&&u<=1&&v>=0&&v<=1)?u:null;
}
/* Extremos de una puerta centrada en c, perpendicular al rumbo brg, de ancho w (m) */
function gateAt(c,brg,w){
  const h=w/2, de=Math.cos(brg*rad), dn=-Math.sin(brg*rad);
  const off=s=>[c[0]+dn*h*s/110540, c[1]+de*h*s/(111320*Math.cos(c[0]*rad))];
  return {a:off(-1),b:off(1)};
}

/* ====================== PUERTAS: roles, sentido de paso y giro ====================== */
const ROLE_NAME={start:'Largada',split:'Parcial',finish:'Llegada',startfinish:'Largada/Llegada'};
const ROLE_ICON={start:'🏁',split:'⏱️',finish:'🏆',startfinish:'🔁'};
const WIND=['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSO','SO','OSO','O','ONO','NO','NNO'];
const compassWord=b=>WIND[Math.round((((b%360)+360)%360)/22.5)%16];
const norm360=b=>((b%360)+360)%360;
/* ¿el desplazamiento p→q va en el sentido brg (grados desde el norte)? */
function dirOK(p,q,brg){
  const k=Math.cos(p[0]*rad),dx=(q[1]-p[1])*k,dy=q[0]-p[0];
  return dx*Math.sin(brg*rad)+dy*Math.cos(brg*rad)>0;
}
/* Puerta completa a partir de centro, ancho, sentido de paso y rol. Los extremos a/b quedan siempre coherentes. */
function makeGate(o){
  const brg=norm360(o.brg||0),g=gateAt(o.c,brg,o.w);
  return {c:[o.c[0],o.c[1]],w:o.w,brg,dirOnly:!!o.dirOnly,role:o.role||'split',a:g.a,b:g.b};
}
/* Puertas viejas (solo a y b): se les deduce centro, ancho y sentido; aceptan los dos sentidos como antes */
function upgradeGate(g,role){
  if(g.c&&g.w!=null&&g.brg!=null)return Object.assign({},g,{role:g.role||role});
  const c=[(g.a[0]+g.b[0])/2,(g.a[1]+g.b[1])/2],w=hav(g.a,g.b);
  return {c,w,brg:norm360(bearingTo(g.a,g.b)-90),dirOnly:false,role:g.role||role,a:g.a,b:g.b};
}
/* Rol de cada puerta. Reglas: la primera es largada o largada/llegada; solo la última puede ser llegada; en un punto a punto la última hace de llegada. */
function gateRoles(c){
  const n=c.gates.length;if(!n)return [];
  const legacy=c.type==='p2p'&&n>=2?c.gates.map((_,i)=>i===0?'start':i===n-1?'finish':'split'):c.gates.map((_,i)=>i===0?'startfinish':'split');
  const r=c.gates.map((g,i)=>g.role||legacy[i]);
  if(r[0]!=='start'&&r[0]!=='startfinish')r[0]='start';
  for(let i=1;i<n;i++){
    if(r[i]==='start'||r[i]==='startfinish')r[i]='split';
    if(r[i]==='finish'&&i<n-1)r[i]='split';
  }
  if(r[0]==='start'&&n>=2)r[n-1]='finish';
  return r;
}
const circType=c=>gateRoles(c)[0]==='startfinish'?'closed':'p2p';
/* Avisos para mostrar al armar el circuito */
function gateCheck(c){
  const w=[],n=c.gates.length;
  if(!n){w.push('Todavía no hay puertas.');return w;}
  const raw=c.gates.map(g=>g.role),r=gateRoles(c);
  if(raw[0]&&raw[0]!=='start'&&raw[0]!=='startfinish')w.push('La primera puerta tiene que ser largada o largada/llegada: se toma como largada.');
  if(r[0]==='start'&&n<2)w.push('Con una sola puerta de largada no hay dónde terminar: agregá una llegada.');
  if(r[0]==='start'&&n>=2&&raw[n-1]&&raw[n-1]!=='finish')w.push('En un punto a punto la última puerta funciona como llegada.');
  if(r[0]==='startfinish'&&raw.some((x,i)=>i>0&&(x==='finish'||x==='start')))w.push('En un circuito cerrado no hace falta puerta de llegada aparte: la largada/llegada cierra cada vuelta.');
  return w;
}

/* Cronómetro de puertas. Los puntos son [lat,lon,tMs,...]. */
class GateTimer{
  constructor(c,cb){this.c=c;this.cb=cb||{};this.roles=gateRoles(c);this.reset();}
  reset(){this.exp=0;this.cur=null;this.laps=[];this.lastT=null;}
  best(){let b=null;for(const l of this.laps)if(!b||l.time<b.time)b=l;return b;}
  feed(p,q){
    const G=this.c.gates,n=G.length;
    if(!n||!(q[2]>p[2]))return;
    const gi=this.exp,g=G[gi],u=crossFrac(p,q,g);
    if(u==null)return;
    if(g.dirOnly&&g.brg!=null&&!dirOK(p,q,g.brg))return;      /* cruzó al revés: no cuenta */
    const t=p[2]+u*(q[2]-p[2]);
    if(this.lastT!=null&&t-this.lastT<4000)return;
    this.lastT=t; this._cross(gi,t,n);
  }
  _cross(gi,t,n){
    const cb=this.cb,role=this.roles[gi];
    if(role==='start'||role==='startfinish'){
      if(role==='startfinish'&&this.cur){
        const cur=this.cur;cur.marks.push(t);this.cur={start:t,marks:[]};this.exp=n>1?1:0;this._end(cur);
      }else{this.cur={start:t,marks:[]};this.exp=n>1?1:0;cb.onStart&&cb.onStart(t);}
    }else if(role==='finish'){
      this.cur.marks.push(t);const cur=this.cur;this.cur=null;this.exp=0;this._end(cur);
    }else{
      this.cur.marks.push(t);this.exp=gi+1>=n?0:gi+1;
      cb.onGate&&cb.onGate(gi,t-this.cur.start,this.cur.marks.length);
    }
  }
  _end(cur){
    const end=cur.marks[cur.marks.length-1];
    const lap={n:this.laps.length+1,start:cur.start,time:end-cur.start,splits:cur.marks.map(m=>m-cur.start)};
    this.laps.push(lap);this.cb.onLap&&this.cb.onLap(lap);
  }
}
/* Recalcula vueltas de un track ya grabado */
function analyze(pts,circ){
  const gt=new GateTimer(circ);
  for(let i=1;i<pts.length;i++){ if(pts[i][5]!==pts[i-1][5])continue; gt.feed(pts[i-1],pts[i]); }
  return gt.laps;
}
function bestOf(laps){let b=null;for(const l of laps)if(!b||l.time<b.time)b=l;return b;}
function lapSectors(l){return l.splits.map((s,i)=>s-(i?l.splits[i-1]:0));}

/* Estadísticas de un track. pts: [lat,lon,t,acc,alt,seg] */
function calcStats(pts){
  let dist=0,mov=0,max=0,gain=0,loss=0,ref=null;
  for(let i=0;i<pts.length;i++){
    const p=pts[i];
    if(p[4]!=null){
      if(ref==null)ref=p[4];
      else if(Math.abs(p[4]-ref)>=3){const d=p[4]-ref;if(d>0)gain+=d;else loss-=d;ref=p[4];}
    }
    if(i&&pts[i-1][5]===p[5]){
      const d=hav(pts[i-1],p), dt=(p[2]-pts[i-1][2])/1000;
      dist+=d;
      if(dt>0){const v=d/dt;if(v>0.5&&v<45){mov+=dt;if(v>max)max=v;}}
    }
  }
  const time=pts.length>1?pts[pts.length-1][2]-pts[0][2]:0;
  return {dist,time,mov:mov*1000,avg:mov>0?dist/mov:0,max,gain:Math.round(gain),loss:Math.round(loss)};
}

/* Formatos */
function fmtT(ms,dec){
  if(ms==null||!isFinite(ms))return '–';
  const neg=ms<0; ms=Math.abs(ms);
  const t=Math.floor(ms/1000), tenth=Math.floor((ms%1000)/100);
  const h=Math.floor(t/3600), m=Math.floor(t%3600/60), s=t%60;
  let o=h?`${h}:${pad2(m)}:${pad2(s)}`:`${m}:${pad2(s)}`;
  if(dec)o+='.'+tenth;
  return (neg?'−':'')+o;
}
const fmtD=m=>m<1000?Math.round(m)+' m':(m/1000).toFixed(2)+' km';
function fmtSp(mps,mode){
  if(mode==='kmh')return (mps>0?mps*3.6:0).toFixed(1);
  if(!(mps>0.3))return '–';
  const T=Math.min(5999,Math.round((mode==='minkm'?1000:500)/mps));
  return Math.floor(T/60)+':'+pad2(T%60);
}
const SP_UNIT={kmh:'km/h',minkm:'min/km',min500:'min/500 m'};

/* Teselas */
const lon2x=(lon,z)=>Math.floor((lon+180)/360*2**z);
const lat2y=(lat,z)=>{const r=lat*rad;return Math.floor((1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*2**z);};
function tileRanges(b,z0,z1){
  const out=[];
  for(let z=z0;z<=z1;z++){
    const n=2**z-1;
    out.push({z,x0:Math.max(0,lon2x(b.w,z)),x1:Math.min(n,lon2x(b.e,z)),y0:Math.max(0,lat2y(b.n,z)),y1:Math.min(n,lat2y(b.s,z))});
  }
  return out;
}
const tileCount=r=>r.reduce((a,t)=>a+Math.max(0,t.x1-t.x0+1)*Math.max(0,t.y1-t.y0+1),0);

/* GPX */
function toGPX(tracks,wpts,esc){
  const iso=t=>new Date(t).toISOString();
  let x='<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="Rumbo" xmlns="http://www.topografix.com/GPX/1/1">\n';
  for(const w of wpts)x+=`<wpt lat="${w.lat}" lon="${w.lon}"><time>${iso(w.t)}</time><name>${esc(w.name)}</name>${wptDesc(w)?`<desc>${esc(wptDesc(w))}</desc>`:''}<type>${esc(w.type)}</type></wpt>\n`;
  for(const tr of tracks){
    x+=`<trk><name>${esc(tr.name)}</name>${tr.desc?`<desc>${esc(tr.desc)}</desc>`:''}`;
    let seg=null;
    for(const p of tr.pts){
      if(p[5]!==seg){if(seg!==null)x+='</trkseg>';x+='<trkseg>';seg=p[5];}
      x+=`<trkpt lat="${p[0].toFixed(7)}" lon="${p[1].toFixed(7)}">${p[4]!=null?`<ele>${p[4]}</ele>`:''}${p[2]?`<time>${iso(p[2])}</time>`:''}</trkpt>`;
    }
    if(seg!==null)x+='</trkseg>';
    x+='</trk>\n';
  }
  return x+'</gpx>';
}

/* ====================== RED DE CALLES Y RUTAS ====================== */
const MODES=['foot','bike','car'];
const KIND_TAGS={sendero:{highway:'path'},escalera:{highway:'steps'},peatonal:{highway:'footway'},ciclovia:{highway:'cycleway'},calle:{highway:'residential'},
  camino:{highway:'track'},servicio:{highway:'service'},principal:{highway:'secondary'},ruta:{highway:'primary'},ferry:{route:'ferry'},nivel:{contour:'elevation'}};
/* "clave=valor" por línea -> pares válidos */
function parseTagLines(s){
  const out=[];
  for(const ln of String(s||'').split(/\r?\n/)){
    const m=ln.trim().match(/^([a-z0-9_:]{1,40})\s*=\s*(.{1,200})$/i);
    if(m)out.push([m[1].toLowerCase(),m[2].trim()]);
  }
  return out;
}
/* Etiquetas (estilo OpenStreetMap) de un trazo propio, a partir de su tipo y de las propiedades que le puso el usuario */
function userTags(p){
  const t=Object.assign({},KIND_TAGS[p.kind]||KIND_TAGS.sendero),q=p.props||{},ac=q.access||{};
  if(p.oneway)t.oneway=p.oneway>0?'yes':'-1';
  if(p.name)t.name=p.name;
  if(q.ref)t.ref=q.ref;
  if(q.ele>0)t.ele=String(Math.round(q.ele));
  if(q.maxspeed>0)t.maxspeed=String(Math.round(q.maxspeed));
  if(ac.foot===false)t.foot='no';
  if(ac.bike===false)t.bicycle='no';
  if(ac.car===false)t.motor_vehicle='no';
  if(p.kind==='ferry'){            /* en un ferry lo que se tilda queda confirmado */
    if(ac.car===true)t.motor_vehicle='yes';
    const m=Math.round(q.duration||0);
    if(m>0)t.duration=String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
  }
  if(q.status==='closed')t.access='no';
  if(q.bikeBoth)t['oneway:bicycle']='no';
  if(q.surface)t.surface=q.surface;
  if(q.bridge)t.bridge='yes';
  if(q.tunnel)t.tunnel='yes';
  if(q.toll)t.toll='yes';
  for(const [k,v] of parseTagLines(q.tags))t[k]=v;
  return t;
}
/* Descripción de un punto a partir de sus propiedades */
function wptDesc(w){
  const q=w.props||{};
  return [q.note,q.phone&&'Tel: '+q.phone,q.addr&&'Dirección: '+q.addr,q.hours&&'Horario: '+q.hours].filter(Boolean).join('\n');
}
const NOACC=new Set(['no','private']);
const YESACC=new Set(['yes','designated','permissive']);

/* Cuánto cambia la velocidad según la pendiente g (subida positiva) */
function slopeFactor(mode,g){
  if(mode==='bike')return g>=0?1/(1+14*g):Math.min(1.8,1+8*(-g));
  if(mode==='foot')return Math.exp(-3.5*(Math.abs(g+0.05)-0.05));
  return 1;
}
/* Altura del terreno: teselas Terrarium (R*256+G+B/256-32768) */
function tileXY(lat,lon,z){
  const n=Math.pow(2,z),r=lat*rad;
  return {x:(lon+180)/360*n,y:(1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*n};

function demTiles(bb,z){

/* Perfil de cada tramo: por modo, si se puede pasar, sentido único (0 doble, 1 a favor, −1 en contra) y velocidad (m/s) */
function wayProfile(t,c){
  if(t.route==='ferry'&&!t.highway){
    const no=v=>NOACC.has(v),base=!no(t.access);
    return {foot:{ok:base&&!no(t.foot),ow:0,v:1},bike:{ok:base&&!no(t.bicycle),ow:0,v:1},
            car:{ok:base&&!no(t.motor_vehicle)&&!no(t.vehicle)&&!no(t.motorcar),ow:0,v:1}};
  }
  const hw=t.highway||'',b=hw.replace('_link','');
  const out={foot:{ok:false,ow:0,v:1},bike:{ok:false,ow:0,v:1},car:{ok:false,ow:0,v:1}};
  let ow=0;
  if(t.oneway==='yes'||t.oneway==='true'||t.oneway==='1'||t.junction==='roundabout'||t.junction==='circular')ow=1;
  else if(t.oneway==='-1'||t.oneway==='reverse')ow=-1;
  if(b==='motorway'&&t.oneway!=='no')ow=ow||1;
  const acc=t.access;
  /* a pie */
  const vf=c.vFoot/3.6;
  const FOOT=['footway','path','pedestrian','steps','track','living_street','residential','service','unclassified','tertiary','secondary','primary','cycleway','corridor','bridleway','road','pier'];
  /* A pie se puede ir por todo lo que va un auto, salvo autopistas y vías exclusivas para vehículos (las rutas nacionales con banquina sí) */
  const noFoot=NOACC.has(t.foot)||(NOACC.has(acc)&&!YESACC.has(t.foot))||(t.motorroad==='yes'&&!YESACC.has(t.foot));
  if(!noFoot){
    if(FOOT.includes(b))out.foot={ok:true,ow:0,v:(b==='steps'?vf*.55:(b==='path'||b==='track')?vf*.9:vf)*(/^(sand|mud)$/.test(t.surface||'')?.7:1)};
    else if(b==='trunk')out.foot={ok:true,ow:0,v:vf*.85};
    else if(b==='motorway'&&YESACC.has(t.foot))out.foot={ok:true,ow:0,v:vf*.7};
  }
  /* bici */
  const vb=c.vBike/3.6;
  let bok=false,bv=vb;
  if(!NOACC.has(t.bicycle)&&!(NOACC.has(acc)&&!YESACC.has(t.bicycle))){
    if(b==='cycleway'){bok=true;bv=vb*1.1;}
    else if(['residential','living_street','unclassified','tertiary','secondary','primary','road','service'].includes(b)){bok=true;bv=b==='primary'?vb*.95:vb;}
    else if(b==='path'){bok=true;bv=vb*.7;}
    else if(b==='track'){bok=true;bv=vb*.75;}
    else if(b==='steps'){bok=true;bv=2/3.6;}
    else if((b==='footway'||b==='pedestrian'||b==='bridleway')&&YESACC.has(t.bicycle)){bok=true;bv=vb*.55;}
    else if(b==='trunk'&&(t.motorroad!=='yes'||YESACC.has(t.bicycle))){bok=true;bv=vb*.9;}
    else if(b==='motorway'&&YESACC.has(t.bicycle)){bok=true;bv=vb*.8;}
  }
  if(bok){
    if(/^(sand|mud)$/.test(t.surface||''))bv*=.6;else if(/^(unpaved|gravel|dirt|ground|earth|compacted|fine_gravel|grass)$/.test(t.surface||''))bv*=.85;
    let bow=ow;
    if(t['oneway:bicycle']==='no'||/opposite/.test((t.cycleway||'')+(t['cycleway:left']||'')+(t['cycleway:right']||'')))bow=0;
    if(['cycleway','path','footway','pedestrian','steps','track','bridleway'].includes(b))bow=t.oneway?bow:0;
    out.bike={ok:true,ow:bow,v:bv};
  }
  /* auto */
  const CAR={motorway:100,trunk:80,primary:60,secondary:50,tertiary:45,unclassified:40,residential:30,living_street:15,service:15,track:20,road:30};
  if(CAR[b]&&!NOACC.has(t.motor_vehicle)&&!NOACC.has(t.vehicle)&&!NOACC.has(t.motorcar)&&!(NOACC.has(acc)&&!YESACC.has(t.motor_vehicle))
     &&!(b==='service'&&(t.service==='driveway'||t.service==='parking_aisle'))){
    let kmh=CAR[b];const ms=parseFloat(t.maxspeed);
    if(/^(sand|mud)$/.test(t.surface||''))kmh=Math.min(kmh*.5,25);
    else if(/^(unpaved|gravel|dirt|ground|earth|compacted|fine_gravel|grass)$/.test(t.surface||''))kmh=Math.min(kmh*.85,55);
    if(ms>0&&ms<=130&&!/mph/.test(t.maxspeed||''))kmh=ms;
    if(hw.endsWith('_link'))kmh=Math.min(kmh,40);
    out.car={ok:true,ow,v:Math.max(5,kmh*c.carF)/3.6};
  }
  return out;
}

  const E=G.E,n=E.length,g=new Float64Array(2*n).fill(Infinity),pr=new Int32Array(2*n).fill(-1),done=new Uint8Array(2*n);
  const c=G.cfg,vmax=pref==='short'?1:Math.max(G.vFerry||0,mode==='foot'?c.vFoot/3.6*1.2:mode==='bike'?c.vBike/3.6*1.1*1.8:130*c.carF/3.6);
  const tl=G.lat[dst],tn=G.lon[dst],k=Math.cos(tl*rad);
  const h=i=>Math.hypot((G.lat[i]-tl)*110540,(G.lon[i]-tn)*111320*k)/vmax;
  const node=s=>{const e=E[s>>1];return (s&1)?e.b:e.a;};
  const H=new Heap();
  for(const ei of G.adj[src]){
    const e=E[ei];if(!e.alive)continue;
    const d=e.a===src?1:-1,v=G.pass(e,mode,d);if(!v)continue;
    const s=ei*2+(d>0?1:0),cost=G.cost(e,d,mode,pref,v);
    if(cost<g[s]){g[s]=cost;H.push(cost+h(node(s)),s);}
  }
  let goal=-1;
  while(H.size){
    const [,s]=H.pop();
    if(done[s])continue;done[s]=1;
    const u=node(s);
    if(u===dst){goal=s;break;}
    const bb=G.barr&&G.barr.get(u);if(bb&&bb[mode])continue;
    const e1=E[s>>1];
    for(const ei2 of G.adj[u]){
      if(ei2===(s>>1))continue;
      const e2=E[ei2];if(!e2.alive)continue;
      const d2=e2.a===u?1:-1,v=G.pass(e2,mode,d2);if(!v)continue;
      if(turnBlocked(G,u,e1,e2,mode))continue;
      const s2=ei2*2+(d2>0?1:0),ng=g[s]+G.cost(e2,d2,mode,pref,v);
      if(ng<g[s2]){g[s2]=ng;pr[s2]=s;H.push(ng+h(node(s2)),s2);}
    }
  }
  if(goal<0)return null;
  const edges=[];
  for(let s=goal;s!==-1;s=pr[s])edges.push({ei:s>>1,d:(s&1)?1:-1});
  edges.reverse();
  return {edges,cost:g[goal]};
}
function astar(G,mode,src,dst,pref){
  if(src===dst)return {edges:[],cost:0};
  if(G.hasTurn&&G.hasTurn[mode])return astarTurn(G,mode,src,dst,pref);
  const n=G.lat.length,g=new Float64Array(n).fill(Infinity),pe=new Int32Array(n).fill(-1),done=new Uint8Array(n);
  const c=G.cfg,vmax=pref==='short'?1:Math.max(G.vFerry||0,mode==='foot'?c.vFoot/3.6*1.2:mode==='bike'?c.vBike/3.6*1.1*1.8:130*c.carF/3.6);
  const k=Math.cos(G.lat[dst]*rad),tl=G.lat[dst],tn=G.lon[dst];
  const h=i=>Math.hypot((G.lat[i]-tl)*110540,(G.lon[i]-tn)*111320*k)/vmax;
  const H=new Heap();g[src]=0;H.push(h(src),src);
  while(H.size){
    const [,u]=H.pop();
    if(done[u])continue;done[u]=1;
    if(u===dst)break;
    {const bb=G.barr&&G.barr.get(u);if(bb&&bb[mode]&&u!==src)continue;}
    for(const ei of G.adj[u]){
      const e=G.E[ei];if(!e.alive)continue;
      const d=e.a===u?1:-1,v=G.pass(e,mode,d);if(!v)continue;
      const w=e.a===u?e.b:e.a,ng=g[u]+G.cost(e,d,mode,pref,v);
      if(ng<g[w]){g[w]=ng;pe[w]=ei;H.push(ng+h(w),w);}
    }
  }
  if(g[dst]===Infinity)return null;
  const edges=[];let cur=dst;
  while(cur!==src){const ei=pe[cur],e=G.E[ei],d=e.b===cur?1:-1;edges.push({ei,d});cur=d>0?e.a:e.b;}
  edges.reverse();
  return {edges,cost:g[dst]};
}

const HWN={path:'el sendero',footway:'el camino peatonal',steps:'la escalera',cycleway:'la ciclovía',track:'el camino',service:'la calle de servicio',pedestrian:'la peatonal',connector:'el sendero',residential:'la calle'};
function bearEnd(pts){const L=pts.length-1;let a=0;for(let j=L-1;j>=0;j--){a+=hav(pts[j],pts[j+1]);if(a>=10||j===0)return bearingTo(pts[j],pts[L]);}return 0;}
function bearStart(pts){let a=0;for(let j=1;j<pts.length;j++){a+=hav(pts[j-1],pts[j]);if(a>=10||j===pts.length-1)return bearingTo(pts[0],pts[j]);}return 0;}
const ORD=['primera','segunda','tercera','cuarta','quinta','sexta','séptima','octava'];
const isRbWay=w=>!!(w.tags&&(w.tags.junction==='roundabout'||w.tags.junction==='circular'));
function makeSteps(G,edges,mode){
  const segs=[];let cur=null;
  for(let k=0;k<edges.length;k++){
    const {ei,d}=edges[k],e=G.E[ei],w=G.W[e.w],f=d>0?e.a:e.b,t=d>0?e.b:e.a;
    const rb=isRbWay(w),fe=!!w.ferry,hw=w.hw==='connector'?'path':w.hw,key=fe?'#ferry:'+w.id:rb?'#rb':(w.name?w.name:'#'+hw);
    if(!cur||cur.key!==key){cur={key,name:rb?'':w.name,hw,rb,ferry:fe,ferryDur:w.ferryDur,unver:fe&&w.tags.motor_vehicle==null,dist:0,pts:[[G.lat[f],G.lon[f]]],nodes:[f],stairs:hw==='steps',k0:k};segs.push(cur);}
    cur.dist+=e.len;cur.pts.push([G.lat[t],G.lon[t]]);cur.nodes.push(t);
  }
  const m=[];
  for(const s of segs){
    const p=m[m.length-1];
    if(p&&s.dist<12&&!s.stairs&&!s.rb&&!p.rb&&!s.ferry&&!p.ferry){p.dist+=s.dist;p.pts.push(...s.pts.slice(1));p.nodes.push(...s.nodes.slice(1));}
    else m.push(s);
  }
  const out=[];
  m.forEach((s,i)=>{
    const via=s.name||HWN[s.hw]||'la calle',prev=m[i-1];
    let text,ico;
    if(s.ferry){
      text=`Tomá el ferry${s.name?' '+s.name:''} (cruce de ${fmtDur(s.ferryDur||0)}, más la espera)`;ico='⛴️';
    }else if(s.rb){
      let n=0;
      for(let q=1;q<s.nodes.length;q++){
        const nd=s.nodes[q];
        if(q===s.nodes.length-1||G.adj[nd].some(ei=>{const e2=G.E[ei];if(!e2.alive||isRbWay(G.W[e2.w]))return false;return G.pass(e2,mode,e2.a===nd?1:-1)>0;}))n++;
      }
      text=`En la rotonda, tomá la ${ORD[n-1]||n+'.ª'} salida`;ico='🔄';
    }else if(i===0){text=s.stairs?'Tomá la escalera':`Salí por ${via}`;ico=s.stairs?'🪜':'⬆️';}
    else if(s.stairs){text='Tomá la escalera';ico='🪜';}
    else if(prev.ferry){text=`Bajá del ferry y seguí por ${via}`;ico='⬆️';}
    else if(prev.rb){text=`Seguí por ${via}`;ico='⬆️';}
    else{
      const dl=((bearStart(s.pts)-bearEnd(prev.pts)+540)%360)-180,ad=Math.abs(dl),side=dl>0?'derecha':'izquierda';
      if(ad<25){text=`Seguí por ${via}`;ico='⬆️';}
      else if(ad<60){text=`Girá levemente a la ${side} por ${via}`;ico=dl>0?'↗️':'↖️';}
      else if(ad<120){text=`Girá a la ${side} por ${via}`;ico=dl>0?'➡️':'⬅️';}
      else{text=`Giro cerrado a la ${side} por ${via}`;ico=dl>0?'↪️':'↩️';}
    }
    out.push({text,dist:s.dist,k0:s.k0,ico,kind:s.rb?'rb':s.ferry?'ferry':'turn'});
  });
  out.push({text:'Llegaste a tu destino',dist:0,k0:edges.length,ico:'🏁',kind:'end'});
  return out;
}
function findRoute(G,mode,from,to,pref){
  pref=pref||'fast';
  const okE=e=>G.pass(e,mode,1)>0||G.pass(e,mode,-1)>0;
  const snap=p=>{
    const h=G.nearestEdge(p.lat,p.lon,500,okE);if(!h)return null;
    const e=G.E[h.ei];let nd;
    if(h.t<=0.02)nd=e.a;else if(h.t>=0.98)nd=e.b;else nd=G.split(h.ei,h.t,h.lat,h.lon);
    return {nd,off:h.d};
  };
  const A=snap(from);if(!A)return {err:'origen'};
  const B=snap(to);if(!B)return {err:'destino'};
  const r=astar(G,mode,A.nd,B.nd,pref);if(!r)return {err:'camino'};
  const vleg=mode==='car'?3:G.cfg.vFoot/3.6;
  let dist=A.off+B.off,time=(A.off+B.off)/vleg,stairs=0,up=0,down=0,fDist=0,fTime=0,fNames=[],fUnver=false;
  const coords=[[from.lat,from.lon],[G.lat[A.nd],G.lon[A.nd]]];
  for(const {ei,d} of r.edges){
    const e=G.E[ei],v=G.pass(e,mode,d),g=G.slope(e,d);
    const dt=e.len/(v*slopeFactor(mode,g));
    dist+=e.len;time+=dt;if(G.W[e.w].hw==='steps')stairs+=e.len;
    if(G.W[e.w].ferry){fDist+=e.len;fTime+=dt;const fw=G.W[e.w];if(fw.name&&!fNames.includes(fw.name))fNames.push(fw.name);if(fw.tags.motor_vehicle==null)fUnver=true;}
    if(g>0)up+=g*e.len;else down-=g*e.len;
    const nn=d>0?e.b:e.a;coords.push([G.lat[nn],G.lon[nn]]);
  }
  coords.push([to.lat,to.lon]);
  const cd=[0];for(let i=1;i<coords.length;i++)cd.push(cd[i-1]+hav(coords[i-1],coords[i]));
  const steps=makeSteps(G,r.edges,mode);
  steps.forEach(s=>{
    const ci=s.kind==='end'?coords.length-1:Math.min(1+s.k0,coords.length-1);
    s.at=cd[ci];s.lat=coords[ci][0];s.lon=coords[ci][1];
  });
  steps[0].at=0;
  /* Tiempo por velocidad promedio propia: la distancia por tierra a tu ritmo + paradas; el ferry se suma aparte */
  let avgKmh=null;
  if(G.cfg.avg&&G.cfg.avg[mode]>0){
    avgKmh=G.cfg.avg[mode]*3.6;
    time=(dist-fDist)/G.cfg.avg[mode]*(1+(G.cfg.avgStops||0)/100)+fTime;
  }
  return {mode,pref,dist,time,avgKmh,avgStops:G.cfg.avgStops||0,coords,eids:r.edges.map(x=>x.ei),elen:r.edges.map(x=>G.E[x.ei].len),stairs,steps,up,down,hasZ:G.hasZ,ferry:fDist>0?{dist:fDist,time:fTime,names:fNames,unver:fUnver}:null};
}

/* ====================== GUÍA PASO A PASO ====================== */
const NAVP={
  foot:{off:30,farMin:40,farMax:90,near:12,hz:{lomo:0,pozo:20,peligro:25}},
  bike:{off:35,farMin:70,farMax:220,near:20,hz:{lomo:50,pozo:50,peligro:60}},
  car:{off:45,farMin:130,farMax:500,near:30,hz:{lomo:70,pozo:60,peligro:80}}
};
const HZN={lomo:'Lomo de burro',pozo:'Pozo',peligro:'Precaución, peligro'};
function speakDist(m){
  if(m<95)return Math.max(10,Math.round(m/10)*10)+' metros';
  if(m<950)return Math.round(m/50)*50+' metros';
  return (m/1000).toFixed(1).replace('.',',')+' kilómetros';
}
const lowerFirst=t=>t.charAt(0).toLowerCase()+t.slice(1);
function projectRoute(c,cd,lat,lon,s0,s1){
  const k=Math.cos(lat*rad),px=lon*111320*k,py=lat*110540;let best=null;
  for(let i=s0;i<Math.min(s1,c.length-1);i++){
    const ax=c[i][1]*111320*k,ay=c[i][0]*110540,dx=c[i+1][1]*111320*k-ax,dy=c[i+1][0]*110540-ay,L2=dx*dx+dy*dy;
    let t=L2?((px-ax)*dx+(py-ay)*dy)/L2:0;t=Math.max(0,Math.min(1,t));
    const d=Math.hypot(px-(ax+t*dx),py-(ay+t*dy));
    if(!best||d<best.d)best={i,t,d,s:cd[i]+t*(cd[i+1]-cd[i])};
  }
  return best;
}
function hazardsOnRoute(c,cd,hz,mode,maxD){
  maxD=maxD||25;
  let la0=1e9,la1=-1e9,lo0=1e9,lo1=-1e9;
  for(const p of c){la0=Math.min(la0,p[0]);la1=Math.max(la1,p[0]);lo0=Math.min(lo0,p[1]);lo1=Math.max(lo1,p[1]);}
  const mg=0.0005,out=[];
  for(const h of hz){
    if(mode==='foot'&&h.k==='lomo')continue;
    if(h.lat<la0-mg||h.lat>la1+mg||h.lon<lo0-mg||h.lon>lo1+mg)continue;
    const p=projectRoute(c,cd,h.lat,h.lon,0,c.length-1);
    if(p&&p.d<=maxD)out.push({s:p.s,d:p.d,k:h.k,lat:h.lat,lon:h.lon});
  }
  out.sort((a,b)=>a.s-b.s);
  return out.filter((h,i)=>!out.slice(0,i).some(o=>o.k===h.k&&Math.abs(o.s-h.s)<12));
}
function navInit(route,mode,hz){
  const cd=[0];for(let i=1;i<route.coords.length;i++)cd.push(cd[i-1]+hav(route.coords[i-1],route.coords[i]));
  return {route,mode,cd,total:cd[cd.length-1],hzs:hazardsOnRoute(route.coords,cd,hz,mode),seg:0,s:0,off:0,said:new Set(),arrived:false};
}
function navTick(N,f){
  const P=NAVP[N.mode],c=N.route.coords,st=N.route.steps,spd=Math.max(0,f.speed||0),say=[];
  let p=projectRoute(c,N.cd,f.lat,f.lon,Math.max(0,N.seg-3),Math.min(c.length-1,N.seg+150));
  if(!p||p.d>P.off){const pa=projectRoute(c,N.cd,f.lat,f.lon,0,c.length-1);if(pa&&(!p||pa.d<p.d))p=pa;}
  if(!p||p.d>P.off)N.off++;
  else{N.off=0;N.seg=p.i;if(p.s>N.s)N.s=p.s;}
  let j=1;while(j<st.length-1&&st[j].at<=N.s+2)j++;
  const rem=Math.max(0,N.total-N.s),next={j,step:st[j],dist:Math.max(0,st[j].at-N.s)};
  if(N.off>=3)return {off:true,say,s:N.s,rem,next,arrived:false};
  if(N.off===0){
    const step=st[j],dist=step.at-N.s,nearD=Math.max(P.near,spd*4),farD=Math.min(P.farMax,Math.max(P.farMin,spd*20));
    if(step.kind==='end'){
      if(rem<=Math.max(20,spd*3)&&!N.said.has('end')){N.said.add('end');N.arrived=true;say.push('Llegaste a tu destino');}
      else if(dist<=farD&&dist>nearD+10&&!N.said.has('f'+j)){N.said.add('f'+j);say.push('Tu destino está en '+speakDist(dist));}
    }else if(/^Seguí/.test(step.text)){/* seguir derecho no se avisa */}
    else if(dist<=nearD&&!N.said.has('n'+j)){N.said.add('n'+j);N.said.add('f'+j);say.push(step.text);}
    else if(dist<=farD&&dist>nearD+10&&!N.said.has('f'+j)){N.said.add('f'+j);say.push(`En ${speakDist(dist)}, ${lowerFirst(step.text)}`);}
    N.hzs.forEach((h,i)=>{
      const ahead=h.s-N.s,lead=Math.min(250,Math.max(P.hz[h.k]||0,(P.hz[h.k]?spd*7:0)));
      if(lead&&ahead>3&&ahead<=lead&&!N.said.has('h'+i)){N.said.add('h'+i);say.push(`${HZN[h.k]||'Precaución'} en ${speakDist(ahead)}`);}
    });
  }
  return {off:false,say,s:N.s,rem,next,arrived:N.arrived};
}

/* Búsqueda de calles y esquinas (sin conexión) */
function norm(s){
  return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/\b(calle|avenida|av|pasaje|pje|ruta|boulevard|bv|camino|sendero)\b\.?/g,' ').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
}
function buildNames(G){
  if(G.names)return G.names;
  const m=new Map();
  G.W.forEach((w,wi)=>{ if(!w.name||w.hw==='connector')return; const k=norm(w.name); if(!k)return; let e=m.get(k); if(!e){e={name:w.name,k,ws:[]};m.set(k,e);} e.ws.push(wi); });
  return G.names=m;
}
function matchNames(G,q){
  const ex=[],pa=[];
  for(const e of buildNames(G).values()){ if(e.k===q)ex.push(e); else if(e.k.includes(q))pa.push(e); }
  return ex.concat(pa).slice(0,10);
}
function searchPlaces(G,q,center){
  const dc=(lat,lon)=>hav([lat,lon],center);
  const uniq=res=>{
    res.sort((x,y)=>x.d-y.d);
    const out=[],seen=new Set();
    for(const r of res){const k=r.label+Math.round(r.lat*2000)+Math.round(r.lon*2000);if(seen.has(k))continue;seen.add(k);out.push(r);if(out.length>=6)break;}
    return out;
  };
  /* esquinas: probamos cada "y", "e", "&", "esquina"... como separador hasta encontrar cruces */
  for(const m of q.matchAll(/\s+(?:y|e|&|esq\.?|esquina|con)(?=\s)/gi)){
    const pa=norm(q.slice(0,m.index)),pb=norm(q.slice(m.index+m[0].length));
    if(!pa||!pb)continue;
    const A=matchNames(G,pa),B=matchNames(G,pb),res=[];
    for(const a of A)for(const b of B){
      if(a===b)continue;
      const sa=new Set();for(const wi of a.ws)for(const n of G.W[wi].nodes)sa.add(n);
      const seen=new Set();
      for(const wi of b.ws)for(const n of G.W[wi].nodes)if(sa.has(n)&&!seen.has(n)){seen.add(n);res.push({label:`${a.name} y ${b.name}`,lat:G.lat[n],lon:G.lon[n],d:dc(G.lat[n],G.lon[n])});}
    }
    if(res.length)return uniq(res);
  }
  const pn=norm(q);
  if(!pn)return [];
  const res=[];
  for(const e of matchNames(G,pn)){
    let best=null;
    for(const wi of e.ws)for(const n of G.W[wi].nodes){const d=dc(G.lat[n],G.lon[n]);if(!best||d<best.d)best={label:e.name,lat:G.lat[n],lon:G.lon[n],d};}
    if(best)res.push(best);
  }
  return uniq(res);
}

/* Duración de OpenStreetMap ("hh:mm", "hh:mm:ss", "mm" o ISO "PT1H30M") en segundos */
function parseDur(s){
  if(!s)return null;s=String(s).trim();
  let m=s.match(/^PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?$/i);
  if(m&&(m[1]||m[2]||m[3]))return (+m[1]||0)*3600+(+m[2]||0)*60+(+m[3]||0);
  m=s.match(/^(\d{1,3}):(\d{2})(?::(\d{2}))?$/);
  if(m)return (+m[1])*3600+(+m[2])*60+(+m[3]||0);
  m=s.match(/^(\d+(?:\.\d+)?)$/);
  if(m)return +m[1]*60;
  return null;
}
/* Simplificación Douglas-Peucker: pts [[lat,lon,...]], tol en metros */
function dpKeep(pts,tol){
  const keep=new Uint8Array(pts.length);
  if(!pts.length)return keep;
  keep[0]=keep[pts.length-1]=1;
  if(pts.length<3)return keep;
  const k=Math.cos(pts[0][0]*rad),xy=pts.map(p=>[p[1]*111320*k,p[0]*110540]);
  const st=[[0,pts.length-1]];
  while(st.length){
    const [s,e]=st.pop();let md=0,mi=-1;
    const ax=xy[s][0],ay=xy[s][1],dx=xy[e][0]-ax,dy=xy[e][1]-ay,L2=dx*dx+dy*dy;
    for(let i=s+1;i<e;i++){
      let t=L2?((xy[i][0]-ax)*dx+(xy[i][1]-ay)*dy)/L2:0;t=Math.max(0,Math.min(1,t));
      const d=Math.hypot(xy[i][0]-(ax+t*dx),xy[i][1]-(ay+t*dy));
      if(d>md){md=d;mi=i;}
    }
    if(md>tol&&mi>0){keep[mi]=1;st.push([s,mi],[mi,e]);}
  }
  return keep;
}
/* Achica las rutas de una región grande: deja las esquinas donde se cruzan rutas y los puntos que hacen falta para no desviarse más de tol metros */
function compactWays(ways,tol){
  const cnt=new Map();
  for(const w of ways)for(const n of w.n)cnt.set(n,(cnt.get(n)||0)+1);
  return ways.map(w=>{
    const N=w.n.length,pts=[];for(let i=0;i<N;i++)pts.push([w.p[2*i],w.p[2*i+1]]);
    const keep=new Uint8Array(N);
    let s=0;
    for(let i=0;i<N;i++){
      if(i===0||i===N-1||cnt.get(w.n[i])>1){
        keep[i]=1;
        if(i>s){const k=dpKeep(pts.slice(s,i+1),tol);for(let j=0;j<k.length;j++)if(k[j])keep[s+j]=1;}
        s=i;
      }
    }
    const n=[],p=[];
    for(let i=0;i<N;i++)if(keep[i]){n.push(w.n[i]);p.push(w.p[2*i],w.p[2*i+1]);}
    return Object.assign({},w,{n,p});
  });
}
function simplifyDP(pts,tol){
  if(pts.length<3)return pts.map(p=>[p[0],p[1]]);
  const keep=dpKeep(pts,tol);
  return pts.filter((_,i)=>keep[i]).map(p=>[p[0],p[1]]);
}
function simplifyDP_OLD(pts,tol){

/* Posición interpolada en el tiempo t de una traza [[lat,lon,t],...] */
function posAt(pts,t){
  if(!pts||pts.length<2)return null;
  if(t<=pts[0][2])return [pts[0][0],pts[0][1]];
  const L=pts.length-1;
  if(t>=pts[L][2])return [pts[L][0],pts[L][1]];
  let lo=0,hi=L;
  while(hi-lo>1){const m=(lo+hi)>>1;if(pts[m][2]<=t)lo=m;else hi=m;}
  const a=pts[lo],b=pts[hi],f=(t-a[2])/((b[2]-a[2])||1);
  return [a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f];

const dayKey=t=>{const d=new Date(t);return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();};
function streaks(times){

  const toN=k=>Math.round(Date.UTC(Math.floor(k/10000),Math.floor(k/100)%100-1,k%100)/86400000);
  let best=0,run=0,prev=null;
  for(const k of days){const n=toN(k);run=(prev!=null&&n-prev===1)?run+1:1;best=Math.max(best,run);prev=n;}
  let cur=0;

    if(today-n<=1){cur=1;for(let i=days.length-2;i>=0;i--){const m=toN(days[i]);if(n-m===1){cur++;n=m;}else break;}}
  }
  return {best,cur};
}

function parseJpegMeta(buf){
  const v=new DataView(buf);
  if(v.byteLength<4||v.getUint16(0)!==0xFFD8)return null;
  const out={};let off=2;
  while(off+4<v.byteLength){
    if(v.getUint8(off)!==0xFF)break;
    const mk=v.getUint8(off+1);
    if(mk===0xDA||mk===0xD9)break;
    const len=v.getUint16(off+2);
    if(mk===0xE1){
      const n=Math.min(29,len-2);let head='';
      for(let i=0;i<n;i++)head+=String.fromCharCode(v.getUint8(off+4+i));
      if(head.startsWith('Exif\0\0')){try{parseExif(v,off+10,out);}catch(e){}}
      else if(head.startsWith('http://ns.adobe.com/xap/1.0/')){
        parseXmp(new TextDecoder().decode(new Uint8Array(buf,off+4+29,Math.max(0,len-2-29))),out);

function parseExif(v,t,out){
  const le=v.getUint16(t)===0x4949,u16=p=>v.getUint16(p,le),u32=p=>v.getUint32(p,le);

  const g=ifd(t+u32(t+4))[0x8825];

  const gi=ifd(t+u32(g.val)),ch=e=>String.fromCharCode(v.getUint8(e.val));
  const dms=e=>{const p=t+u32(e.val);return rat(p)+rat(p+8)/60+rat(p+16)/3600;};
  if(gi[2]&&gi[4]){
    let la=dms(gi[2]),lo=dms(gi[4]);
    if(gi[1]&&ch(gi[1])==='S')la=-la;
    if(gi[3]&&ch(gi[3])==='W')lo=-lo;
    if(la||lo){out.lat=la;out.lon=lo;}
  }
  if(gi[6]){let a=rat(t+u32(gi[6].val));if(gi[5]&&v.getUint8(gi[5].val)===1)a=-a;out.gpsAlt=a;}

function parseXmp(x,out){
  const num=k=>{const m=x.match(new RegExp('drone-dji:'+k+'(?:="|>)\\s*([-+]?[0-9.]+)'));return m?parseFloat(m[1]):null;};

  const fy=num('FlightYawDegree');if(fy!=null)out.fyaw=fy;

}

/* Salida y puesta del sol (ecuación del amanecer). lon: este positivo. alt: altura del sol en grados que define "oscuro". */
function sunTimes(lat,lon,ms,alt){
  const a=(alt==null?-0.833:alt)*rad,jd=ms/86400000+2440587.5;
  const n=Math.ceil(jd-2451545+0.0008),Js=n-lon/360;
  const M=((357.5291+0.98560028*Js)%360+360)%360*rad;
  const C=1.9148*Math.sin(M)+0.02*Math.sin(2*M)+0.0003*Math.sin(3*M);
  const lam=(((M/rad+C+180+102.9372)%360)+360)%360*rad;
  const Jt=2451545+Js+0.0053*Math.sin(M)-0.0069*Math.sin(2*lam);
  const sd=Math.sin(lam)*Math.sin(23.4397*rad),cd=Math.cos(Math.asin(sd));
  const cw=(Math.sin(a)-Math.sin(lat*rad)*sd)/(Math.cos(lat*rad)*cd);
  const toMs=j=>(j-2440587.5)*86400000;
  if(cw>1)return {polar:'noche'};
  if(cw<-1)return {polar:'dia'};
  const w=Math.acos(cw)/rad/360;
  return {rise:toMs(Jt-w),set:toMs(Jt+w)};
}
function isNight(ms,lat,lon,alt){
  for(const k of [-1,0,1]){
    const t=sunTimes(lat,lon,ms+k*86400000,alt);
    if(t.polar==='dia')return false;
    if(t.polar==='noche')return true;
    if(ms>=t.rise&&ms<=t.set)return false;
  }
  return true;
}
function destPoint(lat,lon,brg,m){
  const b=brg*rad;
  return [lat+m*Math.cos(b)/110540,lon+m*Math.sin(b)/(111320*Math.cos(lat*rad))];
}
/* Hacia dónde mira el teléfono (grados desde el norte) a partir del sensor. Acostado: el borde superior; parado: la cámara trasera. */
function headingFromOrientation(alpha,beta,gamma){
  if(Math.abs(beta)<35)return (360-alpha+360)%360;
  const x=beta*rad,y=gamma*rad,z=alpha*rad;
  const cY=Math.cos(y),cZ=Math.cos(z),sX=Math.sin(x),sY=Math.sin(y),sZ=Math.sin(z);
  const Vx=-cZ*sY-sZ*sX*cY,Vy=-sZ*sY+cZ*sX*cY;
  let h=Math.atan(Vx/Vy);
  if(Vy<0)h+=Math.PI;else if(Vx<0)h+=2*Math.PI;

}
function smoothAngle(cur,target,k){
  if(cur==null)return target;

  return (cur+d*k+360)%360;
}

/* A partir de los tracks grabados: velocidad promedio en movimiento por modo y porcentaje típico de paradas */
function avgSpeeds(tracks){
  const M={walk:'foot',bike:'bike',car:'car'},acc={foot:null,bike:null,car:null};
  for(const tr of tracks){
    const m=M[tr.act],st=tr.stats;
    if(!m||!st||st.dist<500||st.mov<120000)continue;
    const a=acc[m]||(acc[m]={d:0,t:0,n:0,stops:[]});
    a.d+=st.dist;a.t+=st.mov/1000;a.n++;
    a.stops.push(Math.min(50,100*Math.max(0,st.time-st.mov)/st.mov));
  }
  const out={};let all=[];
  for(const m of MODES){
    const a=acc[m];if(!a)continue;
    out[m]={kmh:a.d/a.t*3.6,n:a.n,km:a.d/1000};
    all=all.concat(a.stops);

  out.stops=all.length?Math.round(all[Math.floor(all.length/2)]):null;
  return out;
}


/* ====================== CURVAS DE NIVEL ====================== */
/* Marching squares sobre una grilla de alturas (w×h, NaN = sin dato). Devuelve [{e, pts:[[x,y],...]}] en coordenadas de grilla. */
function contourGrid(el,w,h,interval){
  const segs=new Map();
  const add=(L,a,b)=>{let q=segs.get(L);if(!q){q=[];segs.set(L,q);}q.push(a[0],a[1],b[0],b[1]);};
  for(let y=0;y<h-1;y++)for(let x=0;x<w-1;x++){
    const a0=el[y*w+x],b0=el[y*w+x+1],c0=el[(y+1)*w+x+1],d0=el[(y+1)*w+x];
    if(a0!==a0||b0!==b0||c0!==c0||d0!==d0)continue;
    const mn=Math.min(a0,b0,c0,d0),mx=Math.max(a0,b0,c0,d0);
    if(mn===mx)continue;
    for(let L=Math.max(interval,Math.ceil(mn/interval)*interval);L<=mx;L+=interval){
      /* un valor justo en el nivel se trata como un pelo más alto, así las líneas no se cortan en los vértices */
      const a=a0===L?a0+1e-4:a0,b=b0===L?b0+1e-4:b0,c=c0===L?c0+1e-4:c0,d=d0===L?d0+1e-4:d0;
      const m=(a>L?1:0)|(b>L?2:0)|(c>L?4:0)|(d>L?8:0);
      if(m===0||m===15)continue;
      const T=[x+(L-a)/(b-a),y],R=[x+1,y+(L-b)/(c-b)],B=[x+(L-d)/(c-d),y+1],Lf=[x,y+(L-a)/(d-a)];
      switch(m){
        case 1:case 14:add(L,Lf,T);break;
        case 2:case 13:add(L,T,R);break;
        case 3:case 12:add(L,Lf,R);break;
        case 4:case 11:add(L,R,B);break;
        case 6:case 9:add(L,T,B);break;
        case 7:case 8:add(L,Lf,B);break;
        case 5:if((a+b+c+d)/4>L){add(L,Lf,B);add(L,T,R);}else{add(L,Lf,T);add(L,R,B);}break;
        case 10:if((a+b+c+d)/4>L){add(L,Lf,T);add(L,R,B);}else{add(L,T,R);add(L,Lf,B);}break;
      }
    }
  }
  const out=[],key=(x,y)=>x.toFixed(3)+','+y.toFixed(3);
  for(const [L,q] of segs){
    const n=q.length/4,at=new Map(),used=new Uint8Array(n);
    for(let i=0;i<n;i++)for(const o of [0,2]){const k=key(q[4*i+o],q[4*i+o+1]);let l=at.get(k);if(!l){l=[];at.set(k,l);}l.push(i);}
    for(let i=0;i<n;i++){
      if(used[i])continue;used[i]=1;
      const pts=[[q[4*i],q[4*i+1]],[q[4*i+2],q[4*i+3]]];
      for(const fwd of [true,false]){
        for(;;){
          const p=fwd?pts[pts.length-1]:pts[0],kp=key(p[0],p[1]),l=at.get(kp)||[];
          let nx=-1;for(const j of l)if(!used[j]){nx=j;break;}
          if(nx<0)break;used[nx]=1;
          const A=[q[4*nx],q[4*nx+1]],Bp=[q[4*nx+2],q[4*nx+3]],o=key(A[0],A[1])===kp?Bp:A;
          if(fwd)pts.push(o);else pts.unshift(o);
        }
      }
      out.push({e:L,pts});
    }
  }
  return out;
}
/* Curvas de nivel de un mosaico de teselas de relieve (Map 'x/y' -> Float32Array 256×256), en latitud/longitud */
function demContours(tiles,z,x0,y0,nx,ny,interval,f){
  f=f||2;
  const cw=256/f,W=cw*nx,H=cw*ny,el=new Float32Array(W*H).fill(NaN);
  for(let ty=0;ty<ny;ty++)for(let tx=0;tx<nx;tx++){
    const t=tiles.get((x0+tx)+'/'+(y0+ty));if(!t)continue;
    for(let j=0;j<cw;j++)for(let i=0;i<cw;i++){
      let sum=0;for(let b=0;b<f;b++)for(let a=0;a<f;a++)sum+=t[(j*f+b)*256+(i*f+a)];
      el[(ty*cw+j)*W+(tx*cw+i)]=sum/(f*f);
    }
  }
  const n=Math.pow(2,z),res=[];
  for(const l of contourGrid(el,W,H,interval)){
    if(l.pts.length<4)continue;
    const ll=l.pts.map(([gx,gy])=>{
      const X=x0+((gx+.5)*f)/256,Y=y0+((gy+.5)*f)/256;
      return [180/Math.PI*Math.atan(Math.sinh(Math.PI*(1-2*Y/n))),X/n*360-180];
    });
    const sp=simplifyDP(ll,5);
    if(sp.length<3)continue;
    let len=0;for(let i=1;i<sp.length;i++)len+=hav(sp[i-1],sp[i]);
    if(len<80)continue;
    res.push({e:l.e,p:sp.flatMap(q=>[+q[0].toFixed(5),+q[1].toFixed(5)])});
  }
  return res;
}


/* ====================== MEMORIA: qué redes cargar ====================== */
const netPoints=n=>{let s=0;for(const w of n.ways)s+=w.p.length/2;return s;};
/* Si las redes bajadas son demasiadas para el teléfono, se usan las más cercanas a `center` ([lat,lon]) hasta llenar el presupuesto de puntos.
   Las regionales (rutas principales) entran siempre, y las detalladas van primero para que ganen en caso de repetirse. */
function pickNets(nets,center,budget){
  const reg=nets.filter(n=>n.regional),det=nets.filter(n=>!n.regional);
  let used=reg.reduce((a,n)=>a+netPoints(n),0);
  const dist=n=>{const b=n.bb,la=Math.max(b.s,Math.min(b.n,center[0])),lo=Math.max(b.w,Math.min(b.e,center[1]));return hav([la,lo],center);};
  const sorted=det.map(n=>({n,d:dist(n),p:netPoints(n)})).sort((a,b)=>a.d-b.d);
  const keep=[];let dropped=0;
  for(const x of sorted){
    if(!keep.length||used+x.p<=budget){keep.push(x.n);used+=x.p;}else dropped++;
  }
  return {nets:keep.concat(reg),dropped,points:used,limited:dropped>0};
}


/* ====================== COMPARAR CAMINOS DISTINTOS ====================== */
/* fracción del camino más corto que comparten dos rutas */
function routeShare(a,b){
  const sa=new Map();a.eids.forEach((ei,i)=>sa.set(ei,a.elen[i]));
  let sh=0;b.eids.forEach((ei,i)=>{if(sa.has(ei))sh+=b.elen[i];});
  const la=a.elen.reduce((x,y)=>x+y,0),lb=b.elen.reduce((x,y)=>x+y,0);
  return sh/Math.max(1,Math.min(la,lb));
}
/* La mejor ruta y hasta k alternativas que no se parezcan (se encarece lo ya usado y se vuelve a buscar) */
function findAlternatives(G,mode,from,to,pref,k){
  k=k||2;
  const base=findRoute(G,mode,from,to,pref);
  if(base.err)return {base,alts:[]};
  const alts=[],pen=new Map();
  const bump=r=>r.eids.forEach(ei=>pen.set(ei,(pen.get(ei)||1)*1.9));
  bump(base);
  for(let tries=0;tries<7&&alts.length<k;tries++){
    G.pen=pen;
    const r=findRoute(G,mode,from,to,pref);
    G.pen=null;
    if(r.err)break;
    if([base].concat(alts).some(x=>routeShare(x,r)>0.8)){bump(r);continue;}
    if(r.time>base.time*2.5)break;                         /* demasiado peor para ser una alternativa */
    alts.push(r);bump(r);
  }
  G.pen=null;
  return {base,alts};
}
/* Une dos tramos (origen→punto y punto→destino) en una sola ruta */
function joinRoutes(a,b,via){
  let off=0;for(let i=1;i<a.coords.length;i++)off+=hav(a.coords[i-1],a.coords[i]);
  const steps=a.steps.slice(0,-1).concat([{text:`Pasás por ${via.label||'el punto intermedio'}`,dist:0,at:off,ico:'📍',kind:'via',lat:via.lat,lon:via.lon,k0:0}]);

}
function findRouteVia(G,mode,from,to,pref,via){
  const a=findRoute(G,mode,from,via,pref);if(a.err)return a;

/* ---------- Base de datos (IndexedDB) ---------- */
const DB=(()=>{
  let db;
  const open=()=>new Promise((res,rej)=>{
    const r=indexedDB.open('rumbo',1);
    r.onupgradeneeded=()=>{r.result.createObjectStore('tiles');r.result.createObjectStore('kv');};
    r.onsuccess=()=>{db=r.result;res();};
    r.onerror=()=>rej(r.error);
  });
  const st=(n,m)=>db.transaction(n,m).objectStore(n);
  const w=rq=>new Promise((res,rej)=>{rq.onsuccess=()=>res(rq.result);rq.onerror=()=>rej(rq.error);});
  const cur=(n,prefix,fn)=>new Promise((res,rej)=>{
    const out=[];const range=prefix?IDBKeyRange.bound(prefix,prefix+'\uffff'):null;
    const rq=st(n,'readonly').openCursor(range);
    rq.onsuccess=()=>{const c=rq.result;if(c){out.push(fn(c));c.continue();}else res(out);};
    rq.onerror=()=>rej(rq.error);
  });
  return {
    open,
    get:(n,k)=>w(st(n,'readonly').get(k)),
    put:(n,k,v)=>w(st(n,'readwrite').put(v,k)),
    del:(n,k)=>w(st(n,'readwrite').delete(k)),
    has:(n,k)=>w(st(n,'readonly').count(k)).then(c=>c>0),
    count:n=>w(st(n,'readonly').count()),
    clear:n=>w(st(n,'readwrite').clear()),
    all:(n,prefix)=>cur(n,prefix,c=>c.value),
    entries:(n)=>cur(n,null,c=>({k:c.key,v:c.value})),
    countp:(n,prefix)=>w(st(n,'readonly').count(IDBKeyRange.bound(prefix,prefix+'\uffff'))),
    keys:(n,prefix)=>new Promise((res,rej)=>{
      const out=[],rq=st(n,'readonly').openKeyCursor(prefix?IDBKeyRange.bound(prefix,prefix+'\uffff'):null);
      rq.onsuccess=()=>{const c=rq.result;if(c){out.push(c.key);c.continue();}else res(out);};
      rq.onerror=()=>rej(rq.error);
    }),
    delMany:(n,keys)=>new Promise((res,rej)=>{
      if(!keys.length){res();return;}
      const t=db.transaction(n,'readwrite'),s=t.objectStore(n);
      keys.forEach(k=>s.delete(k));t.oncomplete=()=>res();t.onerror=()=>rej(t.error);
    })
  };
})();

const CachedTiles=L.TileLayer.extend({
  createTile(coords,done){
    if(this.options.fb&&coords.z>=15)return fbTile(this,coords,done);
    const img=document.createElement('img');img.alt='';img.setAttribute('role','presentation');
    const fin=()=>done(null,img);
    const url=this.getTileUrl(coords);
    const net=()=>{img.onload=fin;img.onerror=fin;img.src=url;};
    if(!this.options.offline){net();return img;}
    const key=this.options.lid+'/'+coords.z+'/'+coords.x+'/'+coords.y;
    DB.get('tiles',key).then(b=>{
      if(b){const u=URL.createObjectURL(b);const rel=()=>{URL.revokeObjectURL(u);fin();};img.onload=rel;img.onerror=rel;img.src=u;}
      else net();
    }).catch(net);
    return img;
  }
});

/* Descarga de zona */
let DL=null;
async function getTileBlob(url){
  try{const r=await fetch(url);if(!r.ok)throw new Error('http '+r.status);return await r.blob();}
  catch(e){
    if(!isNative())throw e;
    const r=await plugin('CapacitorHttp').get({url,responseType:'blob'});
    const bin=atob(r.data),u=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
    return new Blob([u],{type:'image/jpeg'});
  }
}
async function runDownload(k,ranges){
  const l=LAYERS[k];
  const tiles=[];
  for(const t of ranges)for(let x=t.x0;x<=t.x1;x++)for(let y=t.y0;y<=t.y1;y++)tiles.push([t.z,x,y]);
  DL={cancel:false,done:0,fail:0,total:tiles.length};
  let i=0;
  const upd=()=>{
    const bar=$('#dlbar'),tx=$('#dlt');if(!bar)return;
    bar.style.width=(DL.done/DL.total*100)+'%';
    tx.textContent=`${DL.done} de ${DL.total} teselas`+(DL.fail?` · ${DL.fail} fallaron`:'');
  };
  const worker=async()=>{
    while(!DL.cancel){
      const j=i++;if(j>=tiles.length)break;
      const [z,x,y]=tiles[j],key=`${k}/${z}/${x}/${y}`;
      try{
        if(!(await DB.has('tiles',key))){
          const b=await getTileBlob(tileUrl(l,z,x,y));
          if(b.size<80)throw new Error('vacía');
          let vacia=false;
          if(z>=15&&b.size<26000){try{vacia=isPlaceholder(await createImageBitmap(b),b.size);}catch(er){}}
          if(!vacia)await DB.put('tiles',key,b);
        }
      }catch(e){DL.fail++;}
      DL.done++;if(DL.done%5===0||DL.done===DL.total)upd();
    }
  };
  await Promise.all(Array.from({length:6},worker));
  upd();
  const res=DL;DL=null;
  return res;
}
function dlPlan(){
  const l=LAYERS[S.layer];
  const bb=map.getBounds();
  const b={w:bb.getWest(),e:bb.getEast(),n:bb.getNorth(),s:bb.getSouth()};
  const zmax=Math.min(18,l.maxNative||18);
  const z0=Math.min(zmax,Math.max(8,Math.round(map.getZoom())));
  const z1=Math.min(zmax,z0+S.dlZoom);
  const ranges=tileRanges(b,z0,z1);
  const n=tileCount(ranges);
  return {l,b,ranges,z0,z1,n,mb:n*(l.kb||20)/1024};
}

  }else{
    h+=`<p class="mut">Este mapa no permite descarga masiva. Para salir sin señal usá Satélite o Topográfico Esri.</p>`;
  }
  h+=`<p class="mut">Guardadas en el teléfono: <b>${cnt}</b> teselas.</p>
  <button class="btn danger sm" data-act="dlclear">Borrar mapas descargados</button>`;
  openSheet('Mapas',h,async(a,d,el)=>{
    if(a==='layer'){setLayer(d.k);showMaps();}

      const r=await runDownload(S.layer,p.ranges);
      if(!r.cancel)await saveZone(S.layer,p,r);
      if(r.cancel)toast('Descarga cancelada');
      else if(r.fail>r.total*.5)toast('La mayoría falló. Revisá la conexión.',5000);
      else toast(r.fail?`Listo, con ${r.fail} teselas que fallaron`:'Zona descargada',4000);
      if(sheetTitle==='Mapas')showMaps();
    }
    else if(a==='dlcancel'){if(DL)DL.cancel=true;}
    else if(a==='dlclear'){if(armed(el)){await clearTiles();toast('Mapas borrados');showMaps();}}
  },(t)=>{
    if(t.dataset&&t.dataset.ov){toggleOverlay(t.dataset.ov,t.checked);return;}
    if(t.id==='cton'){S.contourOn=t.checked;saveS();applyContours();return;}
    if(t.id==='zr'){S.dlZoom=+t.value;saveS();$('#zv').textContent=S.dlZoom;updDlInfo();}
  });
  if(l.off)updDlInfo();
}

let lastFix=null,lastFixWall=0,posMk=null,accC=null,centered=false,follow=false,watch=null;
const fixHist=[];
function setFollow(v){follow=v;$('#fLoc').classList.toggle('on',v);}

function onFix(f){
  lastFix=f;lastFixWall=Date.now();
  fixHist.push(f);if(fixHist.length>6)fixHist.shift();
  const ll=[f.lat,f.lon];
  if(!posMk){
    accC=L.circle(ll,{radius:f.acc||0,stroke:false,fillColor:'#1E6BFF',fillOpacity:.12,interactive:false}).addTo(map);
    posMk=L.marker(ll,{interactive:false,keyboard:false,zIndexOffset:2000,icon:posIcon()}).addTo(map);
    if(!centered){map.setView(ll,16);centered=true;}
  }else{posMk.setLatLng(ll);accC.setLatLng(ll);accC.setRadius(f.acc||0);}
  if(follow)map.panTo(ll,{animate:true,duration:.4});
  oriFromFix(f);setPosHeading(f);
  const a=Math.round(f.acc||0),cls=a<=10?'ok':a<=25?'mid':'bad';
  const pill=$('#pill');pill.className=cls;pill.lastElementChild.textContent=`GPS ±${a} m`;
  $('#hGps').textContent=`GPS ±${a} m`;
  if(REC.state==='rec')ingest(f);
  if(NAV.on)navOnFix(f);
}
async function startWatch(bg,msg){
  stopWatch();
  const mk=(lat,lon,acc,alt,speed,brg,t)=>({lat,lon,acc,alt:alt==null||isNaN(alt)?null:alt,speed:speed==null||speed<0?null:speed,brg,t:t||Date.now()});
  if(bg&&isNative()){
    const BG=plugin('BackgroundGeolocation');
    const id=await BG.addWatcher({backgroundTitle:'Rumbo',backgroundMessage:msg||'Grabando el recorrido',requestPermissions:true,stale:false,distanceFilter:0},
      (loc,err)=>{
        if(err){
          if(err.code==='NOT_AUTHORIZED'){toast('Falta el permiso de ubicación. Abro los ajustes…',5000);setTimeout(()=>BG.openSettings(),1500);}
          return;
        }
        onFix(mk(loc.latitude,loc.longitude,loc.accuracy,loc.altitude,loc.speed,loc.bearing,loc.time));
      });
    watch={type:'bg',id,BG};
  }else if(navigator.geolocation){
    const id=navigator.geolocation.watchPosition(
      p=>onFix(mk(p.coords.latitude,p.coords.longitude,p.coords.accuracy,p.coords.altitude,p.coords.speed,p.coords.heading,p.timestamp)),
      e=>{$('#pill').lastElementChild.textContent='Sin GPS';toast('GPS: '+e.message);},
      {enableHighAccuracy:true,maximumAge:0,timeout:30000});
    watch={type:'web',id};
  }
}
function stopWatch(){
  if(!watch)return;
  try{if(watch.type==='bg')watch.BG.removeWatcher({id:watch.id});else navigator.geolocation.clearWatch(watch.id);}catch(e){}
  watch=null;
}

const ACT={walk:['🚶','Caminata'],run:['🏃','Correr'],bike:['🚴','Bici'],car:['🚗','Auto'],kayak:['🛶','Kayak']};
let RUNS=[];
const loadRuns=async()=>{RUNS=await DB.all('kv','run:');};
const resOf=tr=>tr.res||(tr.laps&&tr.laps.length&&tr.circuitId?[{cid:tr.circuitId,name:'',type:'closed',laps:tr.laps}]:[]);
async function removeRunsOfTrack(tid){
  const del=RUNS.filter(r=>r.tid===tid);RUNS=RUNS.filter(r=>r.tid!==tid);
  for(const r of del)await DB.del('kv','run:'+r.id);
}
/* Escribe las marcas de un track y marca cuáles son récord. Se puede llamar de nuevo si cambia la actividad. */
async function commitRuns(tr){
  await removeRunsOfTrack(tr.id);
  for(const r of resOf(tr)){
    for(const lap of r.laps){
      const ev=evalLap(RUNS,r.cid,tr.act,lap);
      lap.pb=ev.pb;lap.first=ev.first;lap.delta=ev.delta;lap.gold=ev.golds;
      const run={id:`${tr.id}#${r.cid}#${lap.n}`,cid:r.cid,act:tr.act,tid:tr.id,n:lap.n,t0:lap.start,time:lap.time,splits:lap.splits,rec:ev.pb};
      RUNS.push(run);await DB.put('kv','run:'+run.id,run);
    }
  }
}
/* Datos de la versión anterior: le da actividad a los tracks y crea las marcas */
async function migrate(){
  for(const tr of await DB.all('kv','track:')){
    let ch=false;
    if(!tr.act){tr.act='bike';ch=true;}
    if(!tr.res&&tr.laps&&tr.laps.length&&tr.circuitId){
      const c=await DB.get('kv','circuit:'+tr.circuitId);
      tr.res=[{cid:tr.circuitId,name:c?c.name:'',type:c?c.type:'closed',laps:tr.laps}];ch=true;
    }
    if(ch){await commitRuns(tr);await DB.put('kv','track:'+tr.id,tr);}
  }
}

/* Fantasma: tu mejor marca corriendo a la par */
let ghost=null;
const ghostCache={};
function clearGhost(){if(ghost){map.removeLayer(ghost.mk);ghost=null;}}
async function setGhost(ent){
  clearGhost();
  const r=ent.ref(false);if(!r||!r.t0)return;
  let all=r.tid===REC.id?REC.pts:ghostCache[r.tid];
  if(!all){const tr=await DB.get('kv','track:'+r.tid);all=tr?tr.pts:null;if(all)ghostCache[r.tid]=all;}
  if(!all||REC.state==='idle')return;
  const pts=all.filter(p=>p[2]>=r.t0-1000&&p[2]<=r.t0+r.time+1000).map(p=>[p[0],p[1],p[2]-r.t0]);
  if(pts.length<2)return;
  clearGhost();
  ghost={pts,time:r.time,ent,mk:L.marker([pts[0][0],pts[0][1]],{icon:L.divIcon({html:'<div class="ghost">👻</div>',className:'',iconSize:[30,30],iconAnchor:[15,15]}),interactive:false,zIndexOffset:500}).addTo(map)};
}

function makeTimer(circ){
  const ent={circ,gt:null};
  /* mejor marca de referencia: anteriores + esta salida, con el mismo formato */
  ent.ref=skipLast=>{
    let b=bestBy(RUNS,circ.id,REC.act,null);
    const ls=skipLast?ent.gt.laps.slice(0,-1):ent.gt.laps;
    for(const l of ls)if(!b||l.time<b.time)b={time:l.time,splits:l.splits,t0:l.start,tid:REC.id};
    return b;
  };
  ent.gt=new GateTimer(circ,{
    onStart:()=>{cue(circ.name+', largada',null,'gate');REC.last={txt:circ.name+' · largada',d:null};setGhost(ent);},
    onGate:(gi,rel,idx)=>{
      const r=ent.ref(false),d=r&&r.splits[idx-1]!=null?rel-r.splits[idx-1]:null;
      const marks=ent.gt.cur.marks,sec=rel-(idx>1?marks[idx-2]-ent.gt.cur.start:0);
      const sb=sectorBests(RUNS,circ.id,REC.act,null);
      for(const l of ent.gt.laps)lapSectors(l).forEach((s,i)=>{if(sb[i]==null||s<sb[i])sb[i]=s;});
      const gold=sb[idx-1]!=null&&sec<sb[idx-1];
      REC.last={txt:`Puerta ${gi} ${fmtT(rel,true)}${gold?' ⚡':''}`,d};
      cue(`Puerta ${gi}${gold?', sector récord':''}`,d,'gate');
    },
    onLap:lap=>{
      const r=ent.ref(true),d=r?lap.time-r.time:null,pb=!!r&&lap.time<r.time;
      lap.pb=pb;
      const nm=circ.type==='p2p'?'':`Vuelta ${lap.n}, `;
      REC.last={txt:`${circ.type==='p2p'?'Tramo':'Vuelta '+lap.n} ${fmtT(lap.time,true)}${pb?' 🏆':''}`,d};
      if(pb){toast(`🏆 ¡Nuevo récord en ${circ.name}!`,5000);cue(`¡Nuevo récord! ${nm}${spoken(lap.time)}`,d,'lap');}
      else cue(`${nm}${spoken(lap.time)}`,d,'lap');
      if(circ.type!=='p2p')setGhost(ent);else clearGhost();
    }
  });
  return ent;
}
const activeTimer=()=>{let b=null;for(const t of REC.timers)if(t.gt.cur&&(!b||t.gt.cur.start>b.gt.cur.start))b=t;return b;};

async function startRec(){
  unlockAudio();
  const circs=(await DB.all('kv','circuit:')).filter(c=>c.gates.length&&c.watch!==false);
  Object.assign(REC,{state:'rec',id:uid(),t0:Date.now(),pausedMs:0,pauseAt:0,seg:0,pts:[],dist:0,speed:0,last:null,lastSave:Date.now(),act:S.act});
  REC.timers=circs.map(makeTimer);
  REC.poly=L.polyline([],{color:'#F04A1C',weight:5,opacity:.95}).addTo(map);
  try{await startWatch(true);}
  catch(e){REC.state='idle';REC.timers=[];map.removeLayer(REC.poly);REC.poly=null;toast('No se pudo iniciar el GPS: '+(e.message||e),5000);return;}
  if(S.keepAwake)keepAwake(true);
  setFollow(true);
  if(lastFix)map.setView([lastFix.lat,lastFix.lon],Math.max(map.getZoom(),16));
  $('#hud').classList.add('on');
  refreshGates();updRecUi();tickHud();
  toast(`${ACT[REC.act][0]} Grabando`+(REC.timers.length?` · ${REC.timers.length} circuito${REC.timers.length>1?'s':''} vigilado${REC.timers.length>1?'s':''}`:''),3000);

function pauseRec(){
  if(REC.state==='rec'){REC.state='pause';REC.pauseAt=Date.now();toast('En pausa');}
  else if(REC.state==='pause'){REC.pausedMs+=Date.now()-REC.pauseAt;REC.state='rec';REC.seg++;toast('Grabando');}
  updRecUi();
}
function ingest(f){
  if(f.acc>S.maxAcc)return;
  const p=[f.lat,f.lon,f.t,Math.round(f.acc),f.alt==null?null:Math.round(f.alt),REC.seg];
  const last=REC.pts[REC.pts.length-1];
  if(last&&last[5]===REC.seg){
    const d=hav(last,p),dt=(p[2]-last[2])/1000;
    if(dt<=0)return;
    if(d/dt>45)return;
    if(d<S.minDist&&dt<10){REC.speed=f.speed!=null?f.speed:0;return;}
    REC.dist+=d;
    REC.speed=f.speed!=null?f.speed:d/dt;
    for(const t of REC.timers)t.gt.feed(last,p);
  }
  REC.pts.push(p);
  REC.poly.addLatLng([p[0],p[1]]);
}

}

async function shareFile(name,text,mime){
  try{
    if(isNative()){
      const r=await plugin('Filesystem').writeFile({path:name,data:text,directory:'CACHE',encoding:'utf8'});
      await plugin('Share').share({title:name,url:r.uri,dialogTitle:'Compartir '+name});
    }else{
      const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:mime}));a.download=name;
      document.body.appendChild(a);a.click();a.remove();
    }
  }catch(e){if(!/cancel/i.test(e.message||''))toast('No se pudo compartir: '+(e.message||e),5000);}
}
function pickFile(){
  return new Promise(res=>{
    const i=$('#file');i.accept='*/*';i.value='';
    i.onchange=async()=>{const f=i.files[0];res(f?{name:f.name,text:await f.text()}:null);};
    i.click();
  });
}
function parseGPX(txt){
  const d=new DOMParser().parseFromString(txt,'application/xml');
  if(d.querySelector('parsererror'))throw new Error('El archivo no es un GPX válido');
  const tx=(el,tag)=>{const n=el.getElementsByTagName(tag)[0];return n?n.textContent:null;};
  const wpts=[],tracks=[];
  for(const w of d.getElementsByTagName('wpt'))
    wpts.push({id:uid(),lat:+w.getAttribute('lat'),lon:+w.getAttribute('lon'),name:tx(w,'name')||'Punto',type:WT[tx(w,'type')]?tx(w,'type'):'punto',t:Date.parse(tx(w,'time'))||Date.now()});
  for(const trk of d.getElementsByTagName('trk')){
    const pts=[];let seg=0;
    for(const s of trk.getElementsByTagName('trkseg')){
      for(const p of s.getElementsByTagName('trkpt')){
        const lat=+p.getAttribute('lat'),lon=+p.getAttribute('lon');if(isNaN(lat)||isNaN(lon))continue;
        const ele=tx(p,'ele'),tm=tx(p,'time');
        pts.push([lat,lon,tm?Date.parse(tm)||0:0,0,ele!=null&&ele!==''?Math.round(+ele):null,seg]);
      }
      seg++;
    }
    if(pts.length>1)tracks.push({name:tx(trk,'name')||'Track importado',pts});
  }
  return {tracks,wpts};
}
async function importFile(){
  const f=await pickFile();if(!f)return;
  try{
    if(f.text.trimStart().startsWith('{')){
      const j=JSON.parse(f.text);if(!j.kv)throw new Error('Backup no reconocido');
      await restoreBackup(j);
      (await DB.all('kv','wpt:')).forEach(addWptMarker);refreshGates();
      const falta=(j.nets&&j.nets.length)||(await DB.all('kv','dlz:')).length;
      toast(`Copia importada (${j.kv.length} elementos)`+(falta?'. Falta volver a bajar los mapas':''),6000);
      if(falta)showMapMgr();else showTracks();return;
    }
    const g=parseGPX(f.text);
    for(const t of g.tracks){
      const id=uid();
      await DB.put('kv','track:'+id,{id,name:t.name,t0:t.pts[0][2],t1:t.pts[t.pts.length-1][2],pts:t.pts,stats:calcStats(t.pts),circuitId:null,laps:[],src:'gpx'});
    }
    for(const w of g.wpts){await DB.put('kv','wpt:'+w.id,w);addWptMarker(w);}
    toast(`Importado: ${g.tracks.length} tracks, ${g.wpts.length} puntos`);showTracks();
  }catch(e){toast('No se pudo importar: '+e.message,5000);}
}
