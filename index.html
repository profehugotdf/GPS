  openSheet('Más',`<div class="grid3">
    <button class="btn big" data-act="tracks">📂<br>Tracks</button>
    <button class="btn big" data-act="fix">🛠️<br>Correcciones</button>
    <button class="btn big" data-act="ovl">🛩️<br>Fotos de dron</button>
    <button class="btn big" data-act="maps">🗂️<br>Mis mapas</button>
    <button class="btn big" data-act="set">⚙️<br>Ajustes</button></div>`,
    a=>{if(a==='tracks')showTracks();else if(a==='fix')showFix();else if(a==='ovl')showOvl();else if(a==='maps')showMapMgr();else if(a==='set')showMore();});
}
function showMore(){
  openSheet('Ajustes',`
    <label for="s1">Precisión máxima aceptada (m)</label><input class="in" id="s1" type="number" min="5" max="150" value="${S.maxAcc}">
    <p class="mut">Los puntos con peor precisión se descartan. Bajo el follaje conviene subirla a 40 o 50.</p>
    <label for="s2">Distancia mínima entre puntos (m)</label><input class="in" id="s2" type="number" min="1" max="30" value="${S.minDist}">
    <label for="s3">Unidad de velocidad</label>
    <select class="in" id="s3"><option value="kmh">km/h</option><option value="minkm">min/km (carrera)</option><option value="min500">min/500 m (kayak)</option></select>
    <label class="chk"><input type="checkbox" id="s4" ${S.voice?'checked':''}> Avisos por voz y sonido en las puertas</label>
    <button class="btn sm" data-act="tv">🔊 Probar la voz</button>
    <label class="chk"><input type="checkbox" id="s5" ${S.keepAwake?'checked':''}> Mantener la pantalla encendida al grabar</label>
    <h3>Tiempos estimados de las rutas</h3>
    <label for="s6">Tu velocidad a pie (km/h)</label><input class="in" id="s6" type="number" step="0.5" min="2" max="10" value="${S.vFoot}">
    <label for="s7">Tu velocidad en bici (km/h)</label><input class="in" id="s7" type="number" step="1" min="5" max="40" value="${S.vBike}">
    <label for="s8">Tráfico en auto</label>
    <select class="in" id="s8"><option value="0.6">Pesado (60 % de la velocidad legal)</option><option value="0.8">Normal (80 %)</option><option value="1">Fluido (100 %)</option></select>
    <label for="s9">Ruta que se muestra primero</label>
    <select class="in" id="s9"><option value="foot">A pie</option><option value="bike">En bici</option><option value="car">En auto</option></select>
    <h3>Copia de seguridad</h3>
    <p class="mut">Guarda tracks, marcas, puntos, circuitos y correcciones (no los mapas, la red de calles ni las fotos de dron). Hacela antes de reinstalar la app.</p>
    <div class="row"><button class="btn" data-act="bk">Exportar copia</button><button class="btn" data-act="imp">Importar copia o GPX</button></div>
    <p class="mut" style="margin-top:16px">Rumbo v0.2 · Mapas: Esri, OpenStreetMap, OpenTopoMap · Calles: © colaboradores de OpenStreetMap (ODbL)</p>`,
    a=>{
      if(a==='bk')(async()=>{
        const kv=(await DB.entries('kv')).filter(e=>e.k!=='rec:current'&&!e.k.startsWith('net:')&&!e.k.startsWith('ovl:')&&!e.k.startsWith('dlz:')&&!e.k.startsWith('netidx:'));
        const d=new Date(),n=`rumbo-backup-${d.getFullYear()}${pad2(d.getMonth()+1)}${pad2(d.getDate())}.json`;
        shareFile(n,JSON.stringify({v:2,kv}),'application/json');
      })();
      else if(a==='imp')importFile();
      else if(a==='tv'){unlockAudio();if(!window.speechSynthesis){toast('Este teléfono no tiene voz disponible',4000);return;}beep(880,.12);say('Prueba de voz. En cien metros, girá a la derecha. Lomo de burro en cincuenta metros.');}
    },
    t=>{
      if(t.id==='s1')S.maxAcc=Math.max(5,+t.value||30);
      else if(t.id==='s2')S.minDist=Math.max(1,+t.value||3);
      else if(t.id==='s3')S.speedMode=t.value;
      else if(t.id==='s4')S.voice=t.checked;
      else if(t.id==='s5')S.keepAwake=t.checked;
      else if(t.id==='s6'){S.vFoot=Math.max(2,Math.min(10,+t.value||5));dropGraph();}
      else if(t.id==='s7'){S.vBike=Math.max(5,Math.min(40,+t.value||16));dropGraph();}
      else if(t.id==='s8'){S.carF=+t.value;dropGraph();}
      else if(t.id==='s9')S.routeMode=t.value;
      saveS();
    });
  $('#s3').value=S.speedMode;$('#s8').value=String(S.carF);$('#s9').value=S.routeMode;
}

/* ---------- Botones ---------- */
$('#nMaps').onclick=showMaps;
$('#nRoutes').onclick=showRoutes;
$('#nGates').onclick=showCircuits;
$('#nMore').onclick=showMoreMenu;
$('#fPts').onclick=showPoints;
$('#fIn').onclick=()=>map.zoomIn();
$('#fOut').onclick=()=>map.zoomOut();
$('#fLoc').onclick=()=>{
  if(!lastFix){toast('Todavía sin GPS');return;}
  setFollow(true);map.setView([lastFix.lat,lastFix.lon],Math.max(map.getZoom(),16));
};
$('#fAct').onclick=()=>{
  if(REC.state!=='idle'){toast('La actividad se cambia al terminar la grabación');return;}
  const k=Object.keys(ACT);S.act=k[(k.indexOf(S.act)+1)%k.length];saveS();updActBtn();
  toast(ACT[S.act][0]+' '+ACT[S.act][1]);
};

/* ---------- Inicio ---------- */
(async()=>{
  await DB.open();
  setLayer(S.layer);
  await loadRuns();
  await migrate();
  await loadWpts();
  await loadOvl();
  updActBtn();updRecUi();
  startWatch(false);
  drawEdits();
  const rc=await DB.get('kv','rec:current');
  if(rc&&rc.pts&&rc.pts.length>1)offerRecover(rc);
  if(isNative()){
    try{
      const App=plugin('App');
      App.addListener('backButton',()=>{
        if(draw)cancelDraw();
        else if(PICK)cancelPick();
        else if(sheet.classList.contains('open'))closeSheet();
        else App.minimizeApp();
      });
    }catch(e){}
  }
})();
</script>
</body>
</html>
