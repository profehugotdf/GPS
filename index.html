function barChart(vals,labels,bestIdx){
  const W=320,H=110,mx=Math.max(...vals),mn=Math.min(...vals),lo=mn*.9,bw=(W-8)/vals.length;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Tiempos">`+vals.map((v,i)=>{
    const bh=Math.max(6,(v-lo)/((mx-lo)||1)*(H-26)),x=4+i*bw+bw*.12,w=bw*.76,y=H-18-bh;
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${bh.toFixed(1)}" rx="2" fill="${i===bestIdx?'#2E7D5B':'#0E2A36'}"/><text x="${(x+w/2).toFixed(1)}" y="${H-5}" font-size="10" text-anchor="middle" fill="#566B74">${esc(labels[i])}</text>`;
  }).join('')+`</svg>`;
}
function lapBlock(r){
  const laps=r.laps,secs=laps.map(lapSectors),nS=secs[0].length;
  const bl=bestOf(laps).time,bs=[];
  for(let i=0;i<nS;i++)bs.push(Math.min(...secs.map(s=>s[i])));
  const theo=bs.reduce((a,b)=>a+b,0);
  let h=`<h3>${esc(r.name||'Circuito')}</h3><div class="tblw"><table class="tbl"><tr><th>#</th><th>Tiempo</th>${bs.map((_,i)=>`<th>S${i+1}</th>`).join('')}</tr>`;
  laps.forEach((l,i)=>{
    h+=`<tr><td>${l.pb?'🏆 ':''}${l.n}</td><td class="${l.time===bl?'bl':''}">${fmtT(l.time,true)}</td>${secs[i].map((s,j)=>`<td class="${s===bs[j]?'bs':''}">${fmtT(s,true)}${l.gold&&l.gold[j]?' ⚡':''}</td>`).join('')}</tr>`;
  });

function ensureGraph(opt){

  if(G)return Promise.resolve(G);

    try{
      const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),regional?320000:130000);
      const r=await fetch(url,{method:'POST',body:new URLSearchParams({data:q}),signal:ctl.signal});
      clearTimeout(to);
      if(!r.ok)throw new Error('HTTP '+r.status);
      const j=await r.json(),ways=[],hz=[];
      for(const el of j.elements||[]){
        if(el.type==='node'){
          const tc=el.tags&&el.tags.traffic_calming;
          if(tc&&['bump','hump','table','cushion'].includes(tc)&&el.lat!=null)hz.push({lat:+el.lat.toFixed(6),lon:+el.lon.toFixed(6),k:'lomo'});
          continue;
        }
        if(el.type!=='way'||!el.geometry||!el.nodes||el.geometry.length!==el.nodes.length||el.geometry.some(g=>!g))continue;
        const t={};for(const k of KEEP)if(el.tags&&el.tags[k]!=null)t[k]=el.tags[k];
        const p=[];for(const g of el.geometry)p.push(+g.lat.toFixed(6),+g.lon.toFixed(6));
        ways.push({id:el.id,t,n:el.nodes,p});
      }
      if(!ways.length)throw new Error('no hay calles en esa zona');
      return {ways,hz};
    }catch(e){last=e;}
  }
  throw last||new Error('sin conexión');
}
const viewKm=()=>{const b=map.getBounds();return [(b.getEast()-b.getWest())*111.32*Math.cos((b.getNorth()+b.getSouth())/2*rad),(b.getNorth()-b.getSouth())*110.54];};
const DEM_Z=13;
async function fetchDem(bb){
  const list=demTiles(bb,DEM_Z),tiles=new Map();
  if(list.length>150)throw new Error('la zona es demasiado grande para bajar la altura');
  let i=0;
  const worker=async()=>{
    while(i<list.length){
      const t=list[i++];
      try{
        const blob=await getTileBlob(`https://s3.amazonaws.com/elevation-tiles-prod/terrarium/${DEM_Z}/${t.x}/${t.y}.png`);
        const bmp=await createImageBitmap(blob);
        const c=document.createElement('canvas');c.width=c.height=256;
        const ctx=c.getContext('2d',{willReadFrequently:true});ctx.drawImage(bmp,0,0);
        const d=ctx.getImageData(0,0,256,256).data,el=new Float32Array(65536);
        for(let k=0;k<65536;k++)el[k]=d[k*4]*256+d[k*4+1]+d[k*4+2]/256-32768;
        tiles.set(t.x+'/'+t.y,el);
      }catch(e){}
    }
  };
  await Promise.all(Array.from({length:4},worker));
  if(!tiles.size)throw new Error('no se pudo bajar');
  return tiles;
}
async function fetchNetFull(bb,say,regional){
  if(regional){
    const g=await fetchNet(bb,true);
    return {ways:compactWays(g.ways,15),hz:[],dem:false,demErr:'',regional:true};
  }
  const {ways,hz}=await fetchNet(bb);
  let dem=null,demErr='';
  try{
    if(say)say('Descargando la altura del terreno…');
    /* solo la zona pedida (+ un margen): una ruta larga como la RN3 se sale mucho y agrandaba la zona sin necesidad */
    dem=await fetchDem({n:bb.n+.01,s:bb.s-.01,w:bb.w-.01,e:bb.e+.01});
    for(const w of ways){
      const z=[];
      for(let q=0;q<w.p.length;q+=2){const v=sampleDem(dem,DEM_Z,w.p[q],w.p[q+1]);z.push(isNaN(v)?null:Math.round(v*10)/10);}
      w.z=z;
    }
  }catch(e){demErr=e.message||String(e);dem=null;}
  return {ways,hz,dem:!!dem,demErr};
}
async function dlNet(replace,mode,ui){
  ui=ui||{btn:'#netgo',msg:'#netmsg'};
  const btn=ui.btn?$(ui.btn):null,say=t=>{const m=$(ui.msg);if(m)m.textContent=t;};
  const regional=mode==='regional';
  let bb;
  if(regional){
    const b=map.getBounds(),[wk,hk]=viewKm();
    if(wk>1200||hk>1200){say('La vista es enorme (máximo 1200 km por lado). Acercá un poco el mapa.');return false;}
    bb={s:b.getSouth(),w:b.getWest(),n:b.getNorth(),e:b.getEast()};
  }else bb=frameBB();
  if(btn)btn.disabled=true;
  say(regional?'Descargando la red regional (solo rutas principales y ferris)… puede tardar varios minutos.':'Descargando calles… puede tardar hasta un minuto.');
  try{
    const f=await fetchNetFull(bb,say,regional);
    if(replace)for(const k of await DB.keys('kv','net:'))await DB.del('kv',k);
    const id=uid();
    await DB.put('kv','net:'+id,{id,bb,date:Date.now(),ways:f.ways,hz:f.hz,regional:!!f.regional});
    await netIndex();
    netsChanged();
    if(regional){toast(`Red regional descargada: ${f.ways.length} tramos de rutas principales y ferris`,6000);return true;}
    toast(`Red descargada: ${f.ways.length} calles y senderos, ${f.hz.length} lomos de burro`+(f.dem?' y la altura del terreno':`. Sin altura (${f.demErr}): no va a funcionar "menos pendiente"`),6000);
    return true;
  }catch(e){
    say('No se pudo descargar: '+(e.message||e)+'. Revisá la conexión y probá de nuevo.');
    const bt=ui.btn?$(ui.btn):null;if(bt)bt.disabled=false;
    return false;
  }
}

  routeLayer.clearLayers();

    L.polyline(r.coords,{color:(RT.cands&&RT.cands.length>1&&cc)?cc.col:MC[RT.sel],weight:6,interactive:false}).addTo(routeLayer);
    ends.push(['A',r.coords[0]],['B',r.coords[r.coords.length-1]]);
  }else{
    if(RT.from)ends.push(['A',[RT.from.lat,RT.from.lon]]);
    if(RT.to)ends.push(['B',[RT.to.lat,RT.to.lon]]);
  }
  /* los otros caminos que se están comparando, más finos y punteados */
  for(const c of RT.cands||[])if(c.route!==r&&c.mode===RT.sel)L.polyline(c.route.coords,{color:c.col,weight:5,opacity:.8,dashArray:'9 7',interactive:false}).addTo(routeLayer);

  if(!RT.to){toast('Elegí el destino');return;}

const dirLabel=(ov,prof)=>{
  if(ov)return {closed:ov.all?'cerrada para todos':'cerrada a vehículos',two:'doble sentido',fwd:'un sentido, con la flecha',rev:'un sentido, contra la flecha'}[ov.dir];
  const ow=prof.car.ok?prof.car.ow:prof.bike.ow;
  return ow===0?'doble sentido (según OpenStreetMap)':ow===1?'un sentido, con la flecha (según OpenStreetMap)':'un sentido, contra la flecha (según OpenStreetMap)';
};
const editTitle=e=>e.type==='path'?`${KIND_UI[e.kind][0]} ${esc(e.name||KIND_UI[e.kind][1])}`
  :e.type==='area'?`${AREA_UI[e.kind]?AREA_UI[e.kind][0]:'⬛'} ${esc(e.name||(AREA_UI[e.kind]?AREA_UI[e.kind][1]:'Área'))} · área`
  :e.type==='turn'?`🚫 Giro ${e.kind==='only'?'obligatorio':'prohibido'}: ${esc(e.name||'')}`
  :e.type==='barrier'?`⛔ ${esc(e.name||'Barrera')}`
  :`↔️ ${esc(e.name||'Calle')} · ${dirLabel({dir:e.dir,all:e.all})}`;
const blockGeom=(g,key)=>g.blockEdges(key).map(ei=>{const x=g.E[ei];return [g.lat[x.a],g.lon[x.a],g.lat[x.b],g.lon[x.b]];});
async function drawEdits(){
  editLayer.clearLayers();
  const edits=await DB.all('kv','edit:');
  for(const e of edits)if(e.type==='path'){
    L.polyline(e.pts,{color:KCOL[e.kind]||'#B0157A',weight:4,dashArray:'6 6',interactive:false}).addTo(editLayer);
    /* franja ancha e invisible: tocar un trazo abre sus propiedades */
    L.polyline(e.pts,{color:'#000',weight:22,opacity:.001}).on('click',ev=>{
      if(TR.on||GE.on||CAP.on||PICK||draw||REC.state!=='idle'||NAV.on||sheet.classList.contains('open'))return;
      if(ev&&ev.originalEvent)ev.originalEvent._owned=true;
      showEditPath(e.id);
    }).addTo(editLayer);
  }
  for(const e of edits)if(e.type==='area'){
    const cl=areaRestricted(e);
    L.polygon(e.pts,{color:cl?'#D0392B':'#6B7B85',weight:2,dashArray:'6 4',fillColor:AREA_COL[e.kind]||'#E0DCD2',fillOpacity:.3,interactive:false}).addTo(editLayer);
    L.polyline(e.pts.concat([e.pts[0]]),{color:'#000',weight:22,opacity:.001}).on('click',ev=>{
      if(TR.on||GE.on||CAP.on||NP.on||PICK||draw||REC.state!=='idle'||NAV.on||sheet.classList.contains('open'))return;
      if(ev&&ev.originalEvent)ev.originalEvent._owned=true;
      showEditArea(e.id);
    }).addTo(editLayer);
  }
  for(const e of edits)if(e.type==='turn'||e.type==='barrier')
    L.marker([e.lat,e.lon],{interactive:false,icon:L.divIcon({html:`<div class="nodem">${e.type==='turn'?'🚫':'⛔'}</div>`,className:'',iconSize:[26,26],iconAnchor:[13,13]})}).addTo(editLayer);
  /* los tramos corregidos se dibujan con la geometría guardada; solo los viejos (sin ella) necesitan el grafo, una única vez */
  const old=edits.filter(e=>e.type==='ov'&&!e.geom);
  if(old.length){
    let g=null;try{g=await ensureGraph();}catch(er){}
    if(g)for(const e of old){e.geom=blockGeom(g,`${e.way}:${e.n1}:${e.n2}`);if(e.geom.length)await DB.put('kv','edit:'+e.id,e);}
  }
  for(const e of edits)if(e.type==='ov'&&e.geom){
    const col=e.dir==='closed'?'#F04A1C':'#E0A100';
    for(const q of e.geom)L.polyline([[q[0],q[1]],[q[2],q[3]]],{color:col,weight:6,opacity:.8,interactive:false}).addTo(editLayer);
  }
}

  }).join('');
  if(edits.some(x=>x.type==='path'||x.type==='area'||x.type==='turn'||x.type==='barrier'))h+=`<h3>Exportar lo calcado</h3><p class="mut">Para usarlo en otros programas (OsmAnd, QGIS, JOSM…).</p><div class="row"><button class="btn" data-act="expg">GeoJSON</button><button class="btn" data-act="expx">GPX</button></div>`;
  openSheet('Correcciones',h,async(a,d,el)=>{
    if(a==='cap')openCap();
    else if(a==='dl'){if(await dlNet())showFix();}
    else if(a==='dlr'){if(await dlNet(true))showFix();}
    else if(a==='netdel'){if(armed(el)){for(const n of nets)await DB.del('kv','net:'+n.id);netsChanged();toast('Red borrada');showFix();}}
    else if(a==='newpath')openTrace();
    else if(a==='etr')showEditPath(d.id);
    else if(a==='ear')showEditArea(d.id);
    else if(a==='nodes')openNodeTool();
    else if(a==='expg')exportTraced('geojson');
    else if(a==='expx')exportTraced('gpx');
    else if(a==='pickway'){PICK={type:'way'};closeSheet();banner('Tocá la calle que querés corregir');}
    else if(a==='edel'){if(armed(el)){await DB.del('kv','edit:'+d.id);dropGraph();vecInvalidate();await drawEdits();showFix();}}
    else if(a==='eview'){
      const e=edits.find(x=>x.id===d.id);
      if(e.type==='path'||e.type==='area'){closeSheet();map.fitBounds(L.latLngBounds(e.pts),{padding:[50,50]});}
      else if(e.type==='turn'||e.type==='barrier'){closeSheet();map.setView([e.lat,e.lon],18);}
      else if(e.geom&&e.geom.length){closeSheet();map.setView([e.geom[0][0],e.geom[0][1]],18);}
    }
  });

      msg=a&&b?'Guardado y conectado en los dos extremos':(a||b)?'Guardado, pero un extremo quedó sin conectar a ninguna calle':'Guardado, pero no quedó conectado a ninguna calle';}

async function pickWayAt(ll){
  const g=await ensureGraph();
  const h=g&&g.nearestEdge(ll.lat,ll.lon,40,e=>e.blk);
  if(!h){toast('No hay una calle cerca. Acercá el mapa y tocá sobre la calle.',4500);return;}
  const e=g.E[h.ei],w=g.W[e.w],[wid,n1,n2]=e.blk.split(':');
  pickLayer.clearLayers();
  let len=0;
  g.blockEdges(e.blk).forEach(ei=>{const x=g.E[ei];len+=x.len;L.polyline([[g.lat[x.a],g.lon[x.a]],[g.lat[x.b],g.lon[x.b]]],{color:'#FFC400',weight:9,opacity:.9,interactive:false}).addTo(pickLayer);});
  const a=[g.lat[e.a],g.lon[e.a]],b=[g.lat[e.b],g.lon[e.b]],brg=bearingTo(a,b);
  L.marker([(a[0]+b[0])/2,(a[1]+b[1])/2],{interactive:false,icon:L.divIcon({html:`<div class="arrow" style="transform:rotate(${brg-90}deg)">➤</div>`,className:'',iconSize:[30,30],iconAnchor:[15,15]})}).addTo(pickLayer);
  PICK=null;banner(null);
  const info={key:e.blk,wid:Number(wid),n1:Number(n1),n2:Number(n2),name:w.name};
  const save=async(dir,all)=>{
    const id=`ov_${info.wid}_${info.n1}_${info.n2}`;
    await DB.put('kv','edit:'+id,{type:'ov',id,way:info.wid,n1:info.n1,n2:info.n2,dir,all:!!all,name:info.name,geom:blockGeom(g,e.blk),created:Date.now()});
    dropGraph();toast('Corrección guardada');pickLayer.clearLayers();await drawEdits();showFix();
  };
  openSheet('Sentido o cierre',`<p><b>${esc(w.name||'Calle sin nombre')}</b> · ${Math.round(len)} m entre esquinas</p>
    <p>Hoy: <b>${dirLabel(e.ov,w.prof)}</b></p>
    <p class="mut">La flecha amarilla marca el sentido de trazado del mapa. La corrección vale para bici y auto; a pie no cambia, salvo "cerrada para todos".</p>
    <div class="row"><button class="btn" data-act="two">↔️ Doble sentido</button><button class="btn" data-act="fwd">➤ Solo con la flecha</button><button class="btn" data-act="rev">◀ Solo contra la flecha</button></div>
    <div class="row"><button class="btn danger" data-act="cv">⛔ Cerrada a vehículos</button><button class="btn danger" data-act="ca">⛔ Cerrada para todos</button></div>
    <div class="row"><button class="btn sm" data-act="reset">Volver a lo que dice el mapa</button><button class="btn sm" data-act="back">Cancelar</button></div>`,
    async(act)=>{
      if(act==='two')save('two');else if(act==='fwd')save('fwd');else if(act==='rev')save('rev');
      else if(act==='cv')save('closed',false);else if(act==='ca')save('closed',true);
      else if(act==='reset'){await DB.del('kv',`edit:ov_${info.wid}_${info.n1}_${info.n2}`);dropGraph();pickLayer.clearLayers();await drawEdits();showFix();}
      else if(act==='back'){pickLayer.clearLayers();showFix();}
    });
}
function onPickClick(e){
  const ll={lat:e.latlng.lat,lon:e.latlng.lng};

  }
}

const NAV={on:false,N:null,mode:'foot',dest:null,lastRecalc:0,busy:false,prev:null,endT:null};
async function collectHz(g){
  const hz=(g.hz||[]).slice();
  for(const w of await DB.all('kv','wpt:'))if(w.type==='lomo'||w.type==='pozo'||w.type==='peligro')hz.push({lat:w.lat,lon:w.lon,k:w.type});
  return hz;
}
function hzSummary(hzs){
  const c={};hzs.forEach(h=>c[h.k]=(c[h.k]||0)+1);
  const nm={lomo:['lomo de burro','lomos de burro'],pozo:['pozo','pozos'],peligro:['punto peligroso','puntos peligrosos']};
  return Object.entries(c).map(([k,n])=>`${n} ${nm[k][n>1?1:0]}`).join(', ');
}
function navSay(t){if(!S.voice)return;beep(880,.12);say(t);}
async function startNav(){
  const r=RT.res&&RT.res[RT.sel];if(!r||r.err)return;
  unlockAudio();
  const g=await ensureGraph();
  Object.assign(NAV,{mode:RT.sel,dest:RT.to,lastRecalc:0,busy:false,prev:null});
  NAV.N=navInit(r,NAV.mode,await collectHz(g));
  NAV.on=true;
  closeSheet();drawRoute(false);setFollow(true);
  if(lastFix)map.setView([lastFix.lat,lastFix.lon],Math.max(map.getZoom(),17));
  if(!watch||watch.type!=='bg'){
    try{await startWatch(true,'Guiando la ruta');}
    catch(e){toast('No se pudo iniciar el GPS en segundo plano: '+(e.message||e),5000);}
  }
  keepAwake(true);
  $('#nav').hidden=false;updNavTop();
  const h=NAV.N.hzs.length;
  navSay(r.steps[0].text+'.'+(h?` Hay ${h} aviso${h>1?'s':''} en el camino.`:''));
  const s1=r.steps[1]||r.steps[0];
  updNav({next:{step:s1,dist:s1.at},rem:NAV.N.total});
}
function updNav(res){
  const st=res.next.step,N=NAV.N,left=N.route.time*(res.rem/Math.max(1,N.total));
  $('#nvIco').textContent=st.ico;
  $('#nvTxt').textContent=st.text;
  $('#nvDist').textContent=st.kind==='end'?fmtD(res.rem):'en '+fmtD(res.next.dist);
  $('#nvEta').textContent='Llegás a las '+hhmm(Date.now()+left*1000);
  $('#nvRem').textContent=fmtD(res.rem)+' · '+fmtDur(left);
  $('#nvMute').textContent=S.voice?'🔊':'🔇';
}
function navOnFix(f){
  if(!NAV.on||!NAV.N||f.acc>60)return;
  const sp=f.speed!=null?f.speed:(NAV.prev?hav([NAV.prev.lat,NAV.prev.lon],[f.lat,f.lon])/Math.max(1,(f.t-NAV.prev.t)/1000):0);
  NAV.prev=f;
  const res=navTick(NAV.N,{lat:f.lat,lon:f.lon,speed:sp});
  if(res.off){navRecalc(f);return;}
  if(res.say.length)navSay(res.say.join('. '));
  updNav(res);
  if(res.arrived&&!NAV.endT)NAV.endT=setTimeout(()=>{NAV.endT=null;endNav();},9000);
}
async function navRecalc(f){
  if(NAV.busy||Date.now()-NAV.lastRecalc<12000)return;
  NAV.busy=true;NAV.lastRecalc=Date.now();
  navSay('Recalculando');
  try{
    const g=await ensureGraph(),r=findRoute(g,NAV.mode,{lat:f.lat,lon:f.lon},NAV.dest,(NAV.N&&NAV.N.route.pref)||'fast');
    if(r.err)navSay('No encuentro un camino desde acá');
    else{
      r.hzs=[];RT.res=RT.res||{};RT.res[NAV.mode]=r;RT.sel=NAV.mode;
      NAV.N=navInit(r,NAV.mode,await collectHz(g));r.hzs=NAV.N.hzs;
      drawRoute(false);navSay(r.steps[0].text);
    }
  }catch(e){}
  NAV.busy=false;
}
function updNavTop(){
  const hud=$('#hud'),pill=$('#pill');
  const ref=hud.classList.contains('on')?hud:pill;
  document.documentElement.style.setProperty('--navtop',Math.round(ref.getBoundingClientRect().bottom+6)+'px');
}
setInterval(()=>{if(NAV.on)updNavTop();},700);
function endNav(){
  if(!NAV.on)return;
  NAV.on=false;NAV.N=null;clearTimeout(NAV.endT);NAV.endT=null;
  $('#nav').hidden=true;
  keepAwake(REC.state!=='idle'&&S.keepAwake);
  if(REC.state==='idle'){setFollow(false);startWatch(false);}
  toast('Guía terminada');
}

map.createPane('ovl').style.zIndex=250;
const OvlLayer=L.Layer.extend({
  initialize(o){this.o=o;},
  onAdd(m){
    const im=this._im=L.DomUtil.create('img','leaflet-image-layer');
    im.alt='';im.src=this.o.url;
    im.style.cssText='position:absolute;left:0;top:0;max-width:none;pointer-events:none;transform-origin:50% 50%;';
    m.getPane('ovl').appendChild(im);
    this._upd();
  },
  onRemove(){L.DomUtil.remove(this._im);},
  getEvents(){return {zoomstart:this._hide,zoom:this._upd,zoomend:this._upd,viewreset:this._upd};},
  _hide(){if(this._im)this._im.style.visibility='hidden';},
  _upd(){
    const m=this._map,o=this.o,im=this._im;if(!m||!im)return;
    const p=m.latLngToLayerPoint([o.lat,o.lon]);
    const mpp=40075016.686*Math.cos(o.lat*Math.PI/180)/(256*Math.pow(2,m.getZoom()));
    const w=o.w/mpp,h=o.h/mpp;
    im.style.width=w+'px';im.style.height=h+'px';im.style.opacity=o.op;
    im.style.transform=`translate3d(${p.x-w/2}px,${p.y-h/2}px,0) rotate(${o.rot}deg)`;
    im.style.visibility='visible';
  }
});
let OVL=[];
const ovlMeta=m=>{const {layer,url,...r}=m;return r;};
const saveOvl=m=>DB.put('kv','ovl:'+m.id,ovlMeta(m));
function ovlShow(m){m.url=m.url||null;if(!m.layer)m.layer=new OvlLayer(m);if(!map.hasLayer(m.layer))m.layer.addTo(map);}
async function loadOvl(){

function pickImages(){
  return new Promise(res=>{
    const i=document.createElement('input');i.type='file';i.accept='image/jpeg,image/*';i.multiple=true;
    i.onchange=()=>res([...i.files]);i.click();
  });
}
async function resizeImg(file,max){
  const url=URL.createObjectURL(file);
  try{
    const im=await new Promise((ok,ko)=>{const x=new Image();x.onload=()=>ok(x);x.onerror=ko;x.src=url;});
    const aw=im.naturalWidth,ah=im.naturalHeight,k=Math.min(1,max/Math.max(aw,ah));
    const c=document.createElement('canvas');c.width=Math.round(aw*k);c.height=Math.round(ah*k);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',0.86));
    return {blob,aw,ah};
  }finally{URL.revokeObjectURL(url);}
}
async function addPhotos(){
  const files=await pickImages();if(!files.length)return;
  toast('Cargando fotos…',2500);
  const added=[];let bad=0,tilted=0;
  for(const f of files){
    try{
      const meta=parseJpegMeta(await f.arrayBuffer())||{};
      const {blob,aw,ah}=await resizeImg(f,2048);
      const c=map.getCenter(),alt=meta.rel!=null&&meta.rel>5?meta.rel:100,fp=droneFootprint(alt,aw,ah,MAVIC_FOV);
      const m={id:uid(),name:f.name,lat:meta.lat!=null?meta.lat:c.lat,lon:meta.lon!=null?meta.lon:c.lng,w:fp.w,h:fp.h,asp:aw/ah,alt,
        rot:meta.gyaw!=null?meta.gyaw:(meta.fyaw!=null?meta.fyaw:0),op:.75,on:true,t:Date.now()+added.length,gps:meta.lat!=null};
      if(meta.pitch!=null&&Math.abs(meta.pitch+90)>15)tilted++;
      await DB.put('tiles','ovl/'+m.id,blob);await saveOvl(m);
      m.url=URL.createObjectURL(blob);m.layer=new OvlLayer(m);m.layer.addTo(map);
      OVL.push(m);added.push(m);
    }catch(e){bad++;}
  }
  const g=added.filter(m=>m.gps);
  if(g.length)map.fitBounds(L.latLngBounds(g.map(m=>[m.lat,m.lon])),{maxZoom:18,padding:[40,40]});
  const noGps=added.length-g.length;
  toast(`${added.length} foto${added.length===1?'':'s'} cargada${added.length===1?'':'s'}`+(noGps?` · ${noGps} sin ubicación: acomodalas a mano`:'')+(tilted?` · ${tilted} no miran hacia abajo, van a quedar aproximadas`:'')+(bad?` · ${bad} fallaron`:''),6000);
}
function showOvl(){

function showOvlAdjust(id){

    <div class="row"><button class="btn" data-act="go">Ir a la foto</button><button class="btn" data-act="hide">${m.on?'Ocultar':'Mostrar'}</button><button class="btn danger" data-act="del">Borrar</button></div>
    <button class="btn" data-act="back">Volver</button>`,
    async(a,d,el)=>{

      else if(a==='rot'){m.rot+=+d.d;upd();showOvlAdjust(id);}
      else if(a==='sc'){m.w*=+d.f;m.h*=+d.f;m.alt*=+d.f;upd();showOvlAdjust(id);}
      else if(a==='go'){closeSheet();map.setView([m.lat,m.lon],18);}
      else if(a==='hide'){m.on=!m.on;if(m.on)ovlShow(m);else map.removeLayer(m.layer);await saveOvl(m);showOvlAdjust(id);}
      else if(a==='del'&&armed(el)){
        map.removeLayer(m.layer);OVL=OVL.filter(x=>x!==m);
        await DB.del('kv','ovl:'+id);await DB.del('tiles','ovl/'+id);showOvl();

    t=>{
      if(t.id==='oo'){m.op=+t.value/100;m.layer._upd();saveOvl(m);}
      else if(t.id==='oa'){
        const alt=Math.max(5,Math.min(600,+t.value||m.alt)),fp=droneFootprint(alt,m.asp*1000,1000,MAVIC_FOV);
        m.alt=alt;m.w=fp.w;m.h=fp.h;upd();showOvlAdjust(id);
      }
    });
}

/* Índice liviano de las redes de calles descargadas (para no cargar todas las calles cada vez) */
async function netIndex(){
  const keys=(await DB.keys('kv','net:')).map(k=>k.slice(4));
  let idx=await DB.all('kv','netidx:');
  for(const x of idx)if(!keys.includes(x.id)&&!x.pending)await DB.del('kv','netidx:'+x.id);
  idx=idx.filter(x=>keys.includes(x.id)||x.pending);
  for(const id of keys)if(!idx.some(x=>x.id===id&&!x.pending)){
    idx=idx.filter(x=>x.id!==id);
    const n=await DB.get('kv','net:'+id);if(!n)continue;
    const x={id,bb:n.bb,date:n.date,ways:n.ways.length,hz:(n.hz||[]).length,z:n.ways.some(w=>w.z&&w.z.some(v=>v!=null)),regional:!!n.regional};
    await DB.put('kv','netidx:'+id,x);idx.push(x);
  }
  return idx;
}

}

const NP={on:false,pt:null,node:null,items:[],type:'turn',from:0,to:1,kind:'no',car:true,bike:true,bar:{foot:false,bike:true,car:true}};
const nodeLayer=L.layerGroup().addTo(map);
const LETTERS='ABCDEFGH';
function nodeItems(g,n){
  const items=[];
  for(const ei of g.adj[n]){
    const e=g.E[ei];if(!e.alive)continue;
    const o=e.a===n?e.b:e.a,P=[g.lat[n],g.lon[n]],brg=bearingTo(P,[g.lat[o],g.lon[o]]);
    if(!(g.pass(e,'car',1)||g.pass(e,'car',-1)||g.pass(e,'bike',1)||g.pass(e,'bike',-1)))continue;
    if(items.some(it=>angDiff(it.brg,brg)<12))continue;
    const w=g.W[e.w];
    items.push({brg,name:w.name||HWN[w.hw]||'calle'});
  }
  items.sort((a,b)=>a.brg-b.brg);
  return items;
}

/* ---------- Calcar: dibujar senderos, calles y escaleras sobre la imagen (quedan en el mapa y son ruteables) ---------- */
const TR={on:false,pts:[],snapped:[],strokes:[],mode:'taps',shape:'line',kind:'sendero',akind:'bosque',oneway:0,props:{},aprops:{},snap:true,saved:0,drawing:false,pid:null};
const LINE_QUICK=['sendero','escalera','calle','camino','nivel'],AREA_QUICK=['bosque','agua','parque','cerrada','edificio','otro'];
const traceLayer=L.layerGroup().addTo(map);
const VKIND={sendero:'path',escalera:'steps',peatonal:'footway',ciclovia:'cycleway',calle:'residential',camino:'track',servicio:'service',principal:'secondary',ruta:'primary',ferry:'ferry',nivel:'contour_minor'};
const mppNow=()=>40075016.686*Math.cos(map.getCenter().lat*rad)/(256*Math.pow(2,map.getZoom()));
/* Imán: pega el punto a la calle o sendero más cercano (a ~14 px), así el trazo queda conectado */
function traceSnap(ll){
  if(!TR.snap||!G||TR.shape==='area')return null;
  const r=Math.max(5,(TR.kind==='ferry'?60:14)*mppNow()),ok=e=>G.W[e.w].hw!=='connector';
  /* si lo que se calca es para autos, el imán prefiere una calle por la que pase un auto */
  const carKind=['calle','camino','servicio','principal','ruta','ferry'].includes(TR.kind)&&!(TR.props&&TR.props.access&&TR.props.access.car===false);
  const h=(carKind&&G.nearestEdge(ll[0],ll[1],r,e=>ok(e)&&(G.pass(e,'car',1)>0||G.pass(e,'car',-1)>0)))||G.nearestEdge(ll[0],ll[1],r,ok);
  return h?[h.lat,h.lon]:null;
}
function traceLen(){let d=0;for(let i=1;i<TR.pts.length;i++)d+=hav(TR.pts[i-1],TR.pts[i]);return d;}
function drawTrace(){
  traceLayer.clearLayers();
  if(!TR.on)return;
  const area=TR.shape==='area',col=area?(areaRestricted({props:TR.aprops})?'#D0392B':'#2E7D5B'):KCOL[TR.kind];
  if(TR.pts.length){
    if(area&&TR.pts.length>=3)L.polygon(TR.pts,{color:col,weight:3,fillColor:AREA_COL[TR.akind]||'#E0DCD2',fillOpacity:.45,interactive:false}).addTo(traceLayer);
    else{
      L.polyline(TR.pts,{color:'#fff',weight:9,opacity:.85,interactive:false}).addTo(traceLayer);
      L.polyline(TR.pts,{color:col,weight:5,dashArray:TR.kind==='escalera'?'2 5':null,interactive:false}).addTo(traceLayer);
    }
    TR.pts.forEach((p,i)=>{
      const sn=TR.snapped[i];
      if(TR.mode==='taps'||i===0||i===TR.pts.length-1||sn)
        L.circleMarker(p,{radius:sn?7:5,color:sn?'#2E7D5B':col,weight:3,fillColor:'#fff',fillOpacity:1,interactive:false}).addTo(traceLayer);
    });
  }
  updTrace();
}
function renderTraceKinds(){
  const el=$('#trKind');
  el.innerHTML=TR.shape==='line'
    ?LINE_QUICK.map(k=>`<button data-k="${k}">${KIND_UI[k][0]} ${KIND_UI[k][1].split(' ')[0]}</button>`).join('')
    :AREA_QUICK.map(k=>`<button data-k="${k}">${AREA_UI[k][0]} ${AREA_UI[k][1].split(' ')[0]}</button>`).join('');

function updTrace(){
  const area=TR.shape==='area',cur=area?TR.akind:TR.kind;
  document.querySelectorAll('#trKind button').forEach(b=>b.classList.toggle('on',b.dataset.k===cur));

  if(REC.state!=='idle'){toast('Terminá la grabación para calcar',4000);return;}
  closeSheet();sBody.innerHTML='';hidePin();

function traceTap(e){
  if(!TR.on||TR.mode!=='taps')return;
  const raw=[e.latlng.lat,e.latlng.lng],sn=traceSnap(raw);
  TR.pts.push(sn||raw);TR.snapped.push(!!sn);TR.strokes.push(1);drawTrace();
}
function traceUndo(){

  for(let i=0;i<n;i++){TR.pts.pop();TR.snapped.pop();}
  drawTrace();

async function traceSave(){
  const area=TR.shape==='area';
  if(TR.pts.length<(area?3:2))return;
  const pts=TR.pts.map(p=>[+p[0].toFixed(7),+p[1].toFixed(7)]);
  const e=area
    ?{type:'area',id:uid(),kind:TR.akind,name:$('#trName').value.trim(),pts,props:JSON.parse(JSON.stringify(TR.aprops||{})),created:Date.now()}
    :{type:'path',id:uid(),kind:TR.kind,name:$('#trName').value.trim(),oneway:TR.oneway,pts,props:JSON.parse(JSON.stringify(TR.props||{})),created:Date.now()};
  await DB.put('kv','edit:'+e.id,e);
  dropGraph();vecInvalidate();
  let msg='Guardado';
  if(area)msg=areaRestricted(e)?'Área guardada: las rutas la van a evitar':'Área guardada';
  else if(TR.kind!=='nivel')try{
    const g=await ensureGraph(),w=g&&g.W.find(x=>x.id==='u:'+e.id);
    if(w){const a=g.adj[w.nodes[0]].length>1,b=g.adj[w.nodes[w.nodes.length-1]].length>1;
      msg=a&&b?'Guardado y conectado en los dos extremos ✔':(a||b)?'Guardado, pero un extremo no quedó pegado a ninguna calle':'Guardado, pero no quedó conectado: acercá los extremos a una calle y activá el imán';}
  }catch(er){}
  TR.saved++;TR.pts=[];TR.snapped=[];TR.strokes=[];
  $('#trName').value='';
  if(TR.props)TR.props.note='';if(TR.aprops)TR.aprops.note='';
  toast(msg,5000);await drawEdits();drawTrace();
}
/* dibujo libre con el dedo */
function endFree(){
  if(TR.drawing){TR.drawing=false;try{map.dragging.enable();}catch(e){}}
}
(function(){
  const el=$('#map'),ptrs=new Set();
  const pos=e=>{const p=map.mouseEventToLatLng(e);return [p.lat,p.lng];};
  el.addEventListener('pointerdown',e=>{
    ptrs.add(e.pointerId);
    if(!TR.on||TR.mode!=='free')return;
    if(ptrs.size>1){ // segundo dedo: es un gesto de mapa, no un trazo
      if(TR.drawing){const n=TR.strokes.pop()||0;for(let i=0;i<n;i++){TR.pts.pop();TR.snapped.pop();}drawTrace();}
      endFree();return;
    }
    TR.drawing=true;TR.pid=e.pointerId;
    try{map.dragging.disable();}catch(er){}
    el.style.touchAction='none';
    const raw=pos(e),sn=TR.pts.length?null:traceSnap(raw);
    TR.strokes.push(1);TR.pts.push(sn||raw);TR.snapped.push(!!sn);
    e.stopPropagation();
    try{el.setPointerCapture(e.pointerId);}catch(er){}
    drawTrace();
  },true);
  el.addEventListener('pointermove',e=>{
    if(!TR.drawing||e.pointerId!==TR.pid)return;
    const p=pos(e),last=TR.pts[TR.pts.length-1];
    if(hav(last,p)<Math.max(1.2,4*mppNow()))return;
    TR.pts.push(p);TR.snapped.push(false);TR.strokes[TR.strokes.length-1]++;
    e.stopPropagation();drawTrace();
  },true);
  const up=e=>{
    ptrs.delete(e.pointerId);
    if(!TR.drawing||e.pointerId!==TR.pid)return;
    /* al soltar: se aliviana el trazo y se pega el final a una calle si está cerca */
    const n=TR.strokes[TR.strokes.length-1],start=TR.pts.length-n,seg=TR.pts.slice(start);
    const simp=seg.length>2?simplifyDP(seg,Math.max(.8,1.6*mppNow())):seg;
    const last=simp[simp.length-1],sn=traceSnap(last);
    TR.pts.splice(start,n,...simp);
    TR.snapped.splice(start,n,...simp.map(()=>false));
    if(sn&&simp.length>1){TR.pts[TR.pts.length-1]=sn;TR.snapped[TR.snapped.length-1]=true;}
    if(start===0&&TR.snapped[0]===false){const s0=traceSnap(TR.pts[0]);if(s0){TR.pts[0]=s0;TR.snapped[0]=true;}}
    TR.strokes[TR.strokes.length-1]=simp.length;
    endFree();drawTrace();
  };
  el.addEventListener('pointerup',up,true);el.addEventListener('pointercancel',up,true);
})();
$('#trKind').addEventListener('click',ev=>{
  const b=ev.target.closest('button');if(!b)return;
  if(TR.shape==='line')TR.kind=b.dataset.k;
  else{TR.akind=b.dataset.k;if(TR.akind==='cerrada'&&!areaRestricted({props:TR.aprops}))TR.aprops=Object.assign({},TR.aprops,{restrict:{foot:true,bike:true,car:true}});}

document.querySelectorAll('#trMode button[data-m]').forEach(b=>b.onclick=()=>{TR.mode=b.dataset.m;endFree();drawTrace();});

/* Lista de lo calcado: editar propiedades (en sec_props) y exportar */
async function exportTraced(fmt){
  const all=await DB.all('kv','edit:'),eds=all.filter(e=>e.type==='path'),areas=all.filter(e=>e.type==='area'),nodes=all.filter(e=>e.type==='turn'||e.type==='barrier');
  if(!eds.length&&!areas.length&&!nodes.length){toast('Todavía no calcaste nada');return;}
  if(fmt==='geojson'){
    const f=[];
    for(const e of eds)f.push({type:'Feature',properties:Object.assign({kind:e.kind,nota:(e.props&&e.props.note)||''},e.kind==='nivel'?{contour:'elevation',ele:(e.props&&e.props.ele)||''}:{},userTags(e)),geometry:{type:'LineString',coordinates:e.pts.map(p=>[p[1],p[0]])}});

/* ---------- Ver el último nivel disponible cuando el mapa no tiene más detalle ---------- */
/* Esri devuelve una imagen gris con "Map data not yet available" donde no hay más zoom. Acá se la detecta y, en lugar de mostrarla,
   se agranda la tesela del nivel anterior (aunque se vea con menos resolución). */
const VOID=new Set(),TPROM=new Map();
let _pc=null;
function isPlaceholder(bmp,size){
  if(size>26000)return false;
  if(!_pc){_pc=document.createElement('canvas');_pc.width=_pc.height=32;}
  const g=_pc.getContext('2d',{willReadFrequently:true});
  g.drawImage(bmp,0,0,32,32);
  const d=g.getImageData(0,0,32,32).data;
  let gray=0,sum=0;
  for(let i=0;i<d.length;i+=4){
    sum+=d[i];
    if(Math.abs(d[i]-d[i+1])<7&&Math.abs(d[i+1]-d[i+2])<7)gray++;
  }
  const px=d.length/4,mean=sum/px;
  return gray/px>0.95&&mean>105&&mean<185;
}
/* la misma tesela se pide una sola vez aunque la usen varias a la vez */
function tileBlobOnce(opt,z,x,y){
  const key=opt.lid+'/'+z+'/'+x+'/'+y;
  let p=TPROM.get(key);
  if(p)return p;
  p=(async()=>{
    if(opt.offline){try{const b=await DB.get('tiles',key);if(b)return b;}catch(e){}}
    try{return await getTileBlob(tileUrl(LAYERS[opt.lid],z,x,y));}catch(e){return null;}
  })();
  TPROM.set(key,p);
  if(TPROM.size>500)TPROM.delete(TPROM.keys().next().value);
  return p;
}
/* Devuelve {bmp,d}: la imagen del nivel z-d que cubre la tesela pedida, o null si no hay ninguna */
async function tileFallback(opt,z,x,y){
  const n=Math.pow(2,z);x=((x%n)+n)%n;
  for(let d=0;d<=5&&z-d>=10;d++){
    const zz=z-d,xx=x>>d,yy=y>>d,key=opt.lid+'/'+zz+'/'+xx+'/'+yy;
    if(VOID.has(key))continue;
    if(zz>=15&&VOID.has(opt.lid+'/'+(zz-1)+'/'+(xx>>1)+'/'+(yy>>1))){VOID.add(key);continue;}   /* si el nivel de arriba está vacío, este también */
    const b=await tileBlobOnce(opt,zz,xx,yy);
    if(!b)continue;
    let bmp;try{bmp=await createImageBitmap(b);}catch(e){continue;}
    if(zz>=15&&isPlaceholder(bmp,b.size)){VOID.add(key);continue;}
    return {bmp,d};
  }
  return null;
}
function fbTile(layer,coords,done){
  const dpr=Math.min(2,window.devicePixelRatio||1),c=document.createElement('canvas');
  c.width=c.height=Math.round(256*dpr);c.style.width=c.style.height='256px';
  tileFallback(layer.options,coords.z,coords.x,coords.y).then(r=>{
    if(r){
      const g=c.getContext('2d'),k=Math.pow(2,r.d),sw=r.bmp.width/k,sh=r.bmp.height/k,n=Math.pow(2,coords.z),xm=((coords.x%n)+n)%n;
      g.imageSmoothingEnabled=true;g.imageSmoothingQuality='high';
      g.drawImage(r.bmp,(xm%k)*sw,(coords.y%k)*sh,sw,sh,0,0,c.width,c.height);
    }
    done(null,c);
  }).catch(()=>done(null,c));
  return c;
}

    const np=w.p.length/2;
    for(let i0=0;i0<np-1;i0+=24){
      const i1=Math.min(i0+24,np-1);

      if((ci1-ci0+1)*(cj1-cj0+1)>400)big.push(id);

    const np=p.length/2;

      const i1=Math.min(i0+24,np-1);let a=90,b=-90,c=180,d=-180;
      for(let i=i0;i<=i1;i++){const la=p[2*i],lo=p[2*i+1];if(la<a)a=la;if(la>b)b=la;if(lo<c)c=lo;if(lo>d)d=lo;}
      const id=chunks.length;chunks.push({w:wi,i0,i1,bb:[a,c,b,d]});
      const ci0=Math.floor(a/cs)+20000,ci1=Math.floor(b/cs)+20000,cj0=Math.floor(c/cs)+40000,cj1=Math.floor(d/cs)+40000;
      if((ci1-ci0+1)*(cj1-cj0+1)>400)big.push(id);
      else for(let i=ci0;i<=ci1;i++)for(let j=cj0;j<=cj1;j++){const k=vkey(i,j);let l=cells.get(k);if(!l){l=[];cells.set(k,l);}l.push(id);}

      areas.push({kind:e.kind,name:e.name||'',pts:e.pts,bb:[a,c,b,d],minz:e.props&&e.props.minz||null,closed:areaRestricted(e)});

const vlon=(x,z)=>x/Math.pow(2,z)*360-180;

/* Dibuja una tesela de 256 px. Devuelve cuántos tramos dibujó. */
function vecDraw(canvas,z,tx,ty,night,only){

  const ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);

  const A=la0-mLa,B=la1+mLa,C=lo0-mLo,D=lo1+mLo,cs=VEC.cs;

    const l=VEC.cells.get(vkey(i,j));if(l)for(const id of l)ids.add(id);

  /* áreas: bajo las curvas y las calles */
  if(!only)for(const ar of VEC.areas){
    const bb=ar.bb;
    if(bb[2]<A||bb[0]>B||bb[3]<C||bb[1]>D)continue;
    if(z<(ar.minz!=null?ar.minz:(ar.kind==='agua'||ar.kind==='nieve'?6:ar.kind==='bosque'?9:12)))continue;

  }

      }

          const [x0,y0]=pts[i-1],[x1,y1]=pts[i],L=Math.hypot(x1-x0,y1-y0),mx=(x0+x1)/2,my=(y0+y1)/2;

    }

    ctx.strokeStyle=night?VNIGHT.halo:'rgba(255,255,255,.85)';ctx.strokeText(al.nm,al.x,al.y);ctx.fillStyle=night?VNIGHT.txt:'#4A5A40';ctx.fillText(al.nm,al.x,al.y);

  if(labs.size){

    }

}

/* Averigua para qué lado hay que girar el mapa: probamos con un punto al este y vemos si queda arriba */
function oriCalib(){
  if(ORI.ok!==null)return ORI.ok;
  try{
    if(!map.options.rotate||typeof map.setBearing!=='function')throw new Error('sin rotación');
    const c=map.getCenter(),s=map.getSize(),mpp=40075016.686*Math.cos(c.lat*rad)/(256*Math.pow(2,map.getZoom()));
    for(const sg of [1,-1]){
      map.setBearing(sg*90);
      const p=destPoint(c.lat,c.lng,90,120*mpp),cp=map.latLngToContainerPoint(p),up=s.y/2-cp.y;
      if(up>60&&Math.abs(cp.x-s.x/2)<up*.35){ORI.sign=sg;ORI.ok=true;map.setBearing(0);return true;}
    }
  }catch(e){}
  ORI.ok=false;
  try{map.setBearing(0);}catch(e){}
  toast('No pude activar la rotación del mapa en este teléfono: queda con el norte arriba',6000);
  return false;
}
function setHeading(h){
  if(Date.now()<ORI.manualUntil)return;      /* si giraste con los dedos, no lo pisamos por un rato */
  if(!oriCalib())return;
  const d=((h-ORI.cur+540)%360)-180;
  if(Math.abs(d)<2)return;

  map.setBearing(ORI.sign*ORI.cur);ORI.setB=ORI.sign*ORI.cur;
}

function onCompass(e){

  else if((e.absolute||e.type==='deviceorientationabsolute')&&e.alpha!=null&&e.beta!=null)h=headingFromOrientation(e.alpha,e.beta,e.gamma||0);
  if(h==null)return;

function changeOrient(k){

  if(k!=='north'&&!canRotatePlugin()){toast('Esta versión no trae el módulo para rotar el mapa. Instalá el APK nuevo completo.',6000);return false;}
  const needReload=k!=='north'&&!(map.options&&map.options.rotate);
  if(needReload&&REC.state!=='idle'){toast('Terminá la grabación para cambiar la orientación',4000);return false;}
  S.orient=k;saveS();
  if(k==='north'){ORI.cur=0;try{if(map.setBearing)map.setBearing(0);}catch(e){}}
  else if(needReload){toast('Reiniciando el mapa para rotarlo…',1500);setTimeout(()=>location.reload(),1200);}

    try{
      const T=plugin('TextToSpeech');
      try{await T.stop();}catch(e){}
      try{await T.speak({text:t,lang:'es-AR',rate:1,pitch:1,volume:1,category:'ambient'});}
      catch(e1){ if(ttsNative!==null)throw e1; await T.speak({text:t,lang:'es-ES',rate:1,pitch:1,volume:1,category:'ambient'}); }
      ttsNative=true;return;
    }catch(e){ if(ttsNative===null)ttsNative=false; }
  }
  sayWeb(t);
}


/* Flecha de rumbo del "vehículo": va en el panel de marcadores, siempre por encima de la ruta */
function posIcon(){
  return L.divIcon({className:'',iconSize:[34,34],iconAnchor:[17,17],html:'<div class="posm"><div class="posa off"></div><div class="posd"></div></div>'});
}
function setPosHeading(f){
  if(!posMk||typeof posMk.getElement!=='function')return;
  const el=posMk.getElement();if(!el||!el.querySelector)return;
  const a=el.querySelector('.posa');if(!a)return;
  const moving=f&&f.speed!=null&&f.speed>0.8&&f.brg!=null&&!isNaN(f.brg);
  if(moving)POS.hdg=f.brg;
  a.classList.toggle('off',POS.hdg==null);
  a.style.opacity=moving?1:.5;
  if(POS.hdg!=null){
    const hUp=ORI.ok===false?0:ORI.sign*getB();       /* hacia dónde mira la parte de arriba de la pantalla */
    a.style.transform=`rotate(${POS.hdg-hUp}deg)`;
  }
}
/* Botón "norte": aparece cuando el mapa está girado */
function northBtn(){
  const b=getB(),rot=Math.abs(((b+540)%360)-180)>1.5;
  const n=$('#fNorth');if(n)n.hidden=!rot;
  /* ¿lo giró el usuario con los dedos? */
  if(ORI.setB!=null&&Math.abs(((b-ORI.setB+540)%360)-180)>3){
    ORI.manualUntil=Date.now()+15000;ORI.cur=norm360((ORI.sign||1)*b);ORI.setB=b;
  }
  else if(ORI.setB==null&&rot){ORI.manualUntil=Date.now()+15000;ORI.setB=b;ORI.cur=norm360((ORI.sign||1)*b);}
  if(lastFix)setPosHeading(null);
}
setInterval(northBtn,500);
$('#fNorth').onclick=()=>{
  try{map.setBearing(0);}catch(e){}
  ORI.cur=0;ORI.setB=0;ORI.manualUntil=0;
  if(S.orient!=='north'){S.orient='north';saveS();toast('Norte arriba');}
  northBtn();
};

function applyNavOp(){document.documentElement.style.setProperty('--navA',String(S.navOp==null?.42:S.navOp));}
/* ---------- Más, ajustes y backup ---------- */
function showMoreMenu(){
  openSheet('Más',`<div class="grid3">
    <button class="btn big" data-act="tracks">📂<br>Tracks</button>
    <button class="btn big" data-act="fix">🛠️<br>Correcciones</button>
    <button class="btn big" data-act="ovl">🛩️<br>Fotos de dron</button>
    <button class="btn big" data-act="maps">🗂️<br>Mis mapas</button>
    <button class="btn big" data-act="set">⚙️<br>Ajustes</button></div>`,
    a=>{if(a==='tracks')showTracks();else if(a==='fix')showFix();else if(a==='ovl')showOvl();else if(a==='maps')showMapMgr();else if(a==='set')showMore();});
}
function showMore(){
  const chips=(id,cur,opts)=>`<div class="chips">${opts.map(([k,n])=>`<button data-act="${id}" data-k="${k}" class="${k===cur?'on':''}">${n}</button>`).join('')}</div>`;
  openSheet('Ajustes',`
    <h3>Pantalla</h3>
    <label>Modo noche</label>
    ${chips('nt',S.night,[['auto','🌗 Automático'],['on','🌙 Siempre'],['off','☀️ Nunca']])}
    <p class="mut">Automático: se oscurece cuando el sol baja, según dónde estás.</p>
    <label>Orientación del mapa</label>
    ${chips('ori',S.orient,[['north','🧭 Norte arriba'],['course','➡️ Rumbo arriba (GPS)'],['compass','📱 Brújula del teléfono']])}
    <p class="mut">Rumbo arriba usa hacia dónde te movés (hace falta ir a más de 3 km/h). La brújula sirve también parado. Si girás el mapa con los dedos, la orientación automática espera 15 segundos antes de volver a actuar.</p>
    <label class="chk"><input type="checkbox" id="s15" ${S.fingerRotate!==false?'checked':''}> Rotar el mapa con dos dedos (reinicia el mapa al cambiar)</label>
    <label for="s16">Opacidad del fondo de la tarjeta de guía: <b id="s16v">${Math.round(S.navOp*100)} %</b></label>
    <input type="range" id="s16" min="0" max="90" value="${Math.round(S.navOp*100)}">
    <h3>GPS</h3>
    <label for="s1">Precisión máxima aceptada (m)</label><input class="in" id="s1" type="number" min="5" max="150" value="${S.maxAcc}">
    <p class="mut">Los puntos con peor precisión se descartan. Bajo el follaje conviene subirla a 40 o 50.</p>
    <label for="s2">Distancia mínima entre puntos (m)</label><input class="in" id="s2" type="number" min="1" max="30" value="${S.minDist}">
    <label for="s3">Unidad de velocidad</label>
    <select class="in" id="s3"><option value="kmh">km/h</option><option value="minkm">min/km (carrera)</option><option value="min500">min/500 m (kayak)</option></select>
    <h3>Avisos</h3>
    <label class="chk"><input type="checkbox" id="s4" ${S.voice?'checked':''}> Avisos por voz y sonido (puertas y guía)</label>
    <button class="btn sm" data-act="tv">🔊 Probar la voz</button>
    <label class="chk"><input type="checkbox" id="s5" ${S.keepAwake?'checked':''}> Mantener la pantalla encendida al grabar</label>
    <h3>Cómo se estima el tiempo de las rutas</h3>
    ${chips('tm',S.timeMode,[['model','🛣️ Por tipo de calle'],['avg','📈 Por mi velocidad promedio']])}
    <p class="mut">Por tipo de calle: en auto usa la velocidad máxima de cada calle (o la típica de su tipo) por el factor de tráfico; a pie y en bici, tu velocidad según el tipo de camino y la pendiente. Por velocidad promedio: distancia dividida tu promedio real, más un porcentaje de paradas; sirve si tus salidas grabadas se parecen a lo que vas a hacer (misma ciudad, mismo tipo de camino). El ferry se suma aparte.</p>
    <label for="s11">Promedio a pie (km/h)</label><input class="in" id="s11" type="number" step="0.1" min="1" max="12" value="${S.avgFoot}">
    <label for="s12">Promedio en bici (km/h)</label><input class="in" id="s12" type="number" step="0.1" min="3" max="45" value="${S.avgBike}">
    <label for="s13">Promedio en auto (km/h)</label><input class="in" id="s13" type="number" step="1" min="10" max="120" value="${S.avgCar}">
    <label for="s14">Paradas y demoras (% extra)</label><input class="in" id="s14" type="number" step="1" min="0" max="60" value="${S.avgStops}">
    <button class="btn sm" data-act="cal">📈 Calcular desde mis salidas grabadas</button><p id="calmsg" class="mut"></p>
    <h3>Velocidades del modo "por tipo de calle"</h3>
    <label for="s6">Tu velocidad a pie (km/h)</label><input class="in" id="s6" type="number" step="0.5" min="2" max="10" value="${S.vFoot}">
    <label for="s7">Tu velocidad en bici (km/h)</label><input class="in" id="s7" type="number" step="1" min="5" max="40" value="${S.vBike}">
    <label for="s8">Tráfico en auto</label>
    <select class="in" id="s8"><option value="0.6">Pesado (60 % de la velocidad legal)</option><option value="0.8">Normal (80 %)</option><option value="1">Fluido (100 %)</option></select>
    <label for="s10">Espera para embarcar en un ferry (min)</label><input class="in" id="s10" type="number" min="0" max="240" value="${S.ferryWait}">
    <p class="mut">Se suma al tiempo del cruce. Los horarios reales no están en el mapa: conviene confirmarlos.</p>
    <label for="s9">Ruta que se muestra primero</label>
    <select class="in" id="s9"><option value="foot">A pie</option><option value="bike">En bici</option><option value="car">En auto</option></select>
    <h3>Copia de seguridad</h3>
    <p class="mut">Guarda tracks, marcas, puntos, circuitos, correcciones, fotos de dron y la lista de mapas descargados. Los mapas en sí no entran (pesan mucho): al importar la copia, la app los vuelve a bajar con un toque. Hacela antes de reinstalar.</p>
    <div class="row"><button class="btn" data-act="bk">Exportar copia completa</button><button class="btn" data-act="imp">Importar copia o GPX</button></div>
    <p class="mut" style="margin-top:16px">Rumbo <span id="ver"></span> · Mapas: Esri, OpenStreetMap, OpenTopoMap, Sentinel-2 · Calles: © colaboradores de OpenStreetMap (ODbL)</p>`,
    async(a,d)=>{
      if(a==='bk')exportFull();
      else if(a==='imp')importFile();
      else if(a==='tv'){
        unlockAudio();beep(880,.12);
        if(isNative()){
          await say('Prueba de voz. En cien metros, girá a la derecha. Lomo de burro en cincuenta metros.');
          toast(ttsNative?'Se oye con la voz del sistema. Si no oís nada, subí el volumen multimedia.':'La voz del sistema no responde: revisá Ajustes del teléfono → Administración general → Texto a voz.',6000);
        }else{
          if(!window.speechSynthesis){toast('Este navegador no tiene voz',4000);return;}
          sayWeb('Prueba de voz. En cien metros, girá a la derecha.');
        }
      }
      else if(a==='tm'){S.timeMode=d.k;saveS();dropGraph();sBody.querySelectorAll('[data-act=tm]').forEach(b=>b.classList.toggle('on',b.dataset.k===d.k));}
      else if(a==='cal'){
        const r=avgSpeeds(await DB.all('kv','track:')),names={foot:'A pie',bike:'En bici',car:'En auto'},f={foot:'avgFoot',bike:'avgBike',car:'avgCar'},ids={foot:'#s11',bike:'#s12',car:'#s13'},got=[];
        for(const k of MODES)if(r[k]&&r[k].km>=3){S[f[k]]=Math.round(r[k].kmh*10)/10;$(ids[k]).value=S[f[k]];got.push(`${names[k]}: ${S[f[k]]} km/h (${r[k].n} salida${r[k].n>1?'s':''}, ${Math.round(r[k].km)} km)`);}
        if(r.stops!=null&&got.length){S.avgStops=r.stops;$('#s14').value=r.stops;}
        saveS();dropGraph();
        $('#calmsg').textContent=got.length?'Listo. '+got.join(' · ')+(r.stops!=null?` · Paradas: ${r.stops} %`:'')+'. Ahora elegí "Por mi velocidad promedio" arriba.':'Todavía no hay suficientes salidas grabadas (hacen falta al menos 3 km por tipo de actividad: caminata, bici o auto).';
      }
      else if(a==='nt'){S.night=d.k;saveS();applyNight();sBody.querySelectorAll('[data-act=nt]').forEach(b=>b.classList.toggle('on',b.dataset.k===d.k));}
      else if(a==='ori'){if(changeOrient(d.k))sBody.querySelectorAll('[data-act=ori]').forEach(b=>b.classList.toggle('on',b.dataset.k===d.k));}
    },
    t=>{
      if(t.id==='s1')S.maxAcc=Math.max(5,+t.value||30);
      else if(t.id==='s2')S.minDist=Math.max(1,+t.value||3);
      else if(t.id==='s3')S.speedMode=t.value;
      else if(t.id==='s4')S.voice=t.checked;
      else if(t.id==='s5')S.keepAwake=t.checked;
      else if(t.id==='s6'){S.vFoot=Math.max(2,Math.min(10,+t.value||5));dropGraph();}
      else if(t.id==='s7'){S.vBike=Math.max(5,Math.min(40,+t.value||16));dropGraph();}
      else if(t.id==='s8'){S.carF=+t.value;dropGraph();}
      else if(t.id==='s9')S.routeMode=t.value;
      else if(t.id==='s15'){
        if(t.checked&&!canRotatePlugin()){t.checked=false;toast('Esta versión no trae el módulo para rotar el mapa.',5000);return;}
        S.fingerRotate=t.checked;saveS();
        if(REC.state!=='idle'){toast('Se aplica la próxima vez que abras la app',4000);return;}
        toast('Reiniciando el mapa…',1500);setTimeout(()=>location.reload(),1200);
      }
      else if(t.id==='s16'){S.navOp=+t.value/100;$('#s16v').textContent=t.value+' %';applyNavOp();}
      else if(t.id==='s11'){S.avgFoot=Math.max(1,Math.min(12,+t.value||5));dropGraph();}
      else if(t.id==='s12'){S.avgBike=Math.max(3,Math.min(45,+t.value||16));dropGraph();}
      else if(t.id==='s13'){S.avgCar=Math.max(10,Math.min(120,+t.value||45));dropGraph();}
      else if(t.id==='s14'){S.avgStops=Math.max(0,Math.min(60,+t.value||0));dropGraph();}
      else if(t.id==='s10'){S.ferryWait=Math.max(0,Math.min(240,+t.value||0));dropGraph();}
      saveS();
    });
  $('#s3').value=S.speedMode;$('#s8').value=String(S.carF);$('#s9').value=S.routeMode;
  if(isNative())try{plugin('App').getInfo().then(i=>{const e=$('#ver');if(e)e.textContent='v'+i.version+' (build '+i.build+')';}).catch(()=>{});}catch(e){}
}

/* ---------- Botones ---------- */
$('#nMaps').onclick=showMaps;
$('#nRoutes').onclick=showRoutes;
$('#nGates').onclick=showCircuits;
$('#nMore').onclick=showMoreMenu;
$('#fPts').onclick=showPoints;
$('#fIn').onclick=()=>map.zoomIn();
$('#fOut').onclick=()=>map.zoomOut();
$('#fLoc').onclick=()=>{
  if(!lastFix){toast('Todavía sin GPS');return;}
  setFollow(true);map.setView([lastFix.lat,lastFix.lon],Math.max(map.getZoom(),16));
};
$('#fAct').onclick=()=>{
  if(REC.state!=='idle'){toast('La actividad se cambia al terminar la grabación');return;}
  const k=Object.keys(ACT);S.act=k[(k.indexOf(S.act)+1)%k.length];saveS();updActBtn();
  toast(ACT[S.act][0]+' '+ACT[S.act][1]);
};

/* ---------- Inicio ---------- */
(async()=>{
  await DB.open();
  await loadSources();
  setLayer(S.layer);applyOverlays();
  await loadRuns();
  await migrate();
  await loadWpts();
  await loadOvl();
  updActBtn();updRecUi();
  applyNight();applyNavOp();if(map.options&&map.options.rotate){oriCalib();oriStart();}
  startWatch(false);
  drawEdits();
  const rc=await DB.get('kv','rec:current');
  if(rc&&rc.pts&&rc.pts.length>1)offerRecover(rc);
  if(isNative()){
    try{
      const App=plugin('App');
      App.addListener('backButton',()=>{
        if(draw)cancelDraw();
        else if(PICK)cancelPick();
        else if(sheet.classList.contains('open'))closeSheet();
        else App.minimizeApp();
      });
    }catch(e){}
  }
})();
</script>
