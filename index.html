/* ---------- Movimiento fluido y ahorro de datos móviles ---------- */
let lastMoveT=0;
/* Entre una lectura de GPS y la siguiente (cada ~1 s) el punto y el mapa se deslizan en línea recta en vez de saltar.
   Es una transición de CSS: la hace la placa de video, casi no usa procesador. */
function smoothMove(ll){
  const now=performance.now(),dt=lastMoveT?Math.min(1.5,Math.max(.4,(now-lastMoveT)/1000)):.4;lastMoveT=now;
  const smooth=S.smooth!==false&&!document.hidden;
  let dx=0,dy=0,flip=false;
  if(smooth&&Math.abs(getB())<1){
    const p0=map.latLngToLayerPoint(posMk.getLatLng());
    posMk.setLatLng(ll);
    const p1=map.latLngToLayerPoint(ll);dx=p0.x-p1.x;dy=p0.y-p1.y;
    const m=Math.hypot(dx,dy);flip=m>.5&&m<400;
  }else posMk.setLatLng(ll);
  if(flip){
    const el=posMk.getElement(),inner=el&&el.firstElementChild;
    if(inner){
      inner.style.transition='none';inner.style.transform=`translate(${dx}px,${dy}px)`;
      void inner.offsetWidth;
      inner.style.transition=`transform ${dt}s linear`;inner.style.transform='translate(0px,0px)';
    }
  }
  if(follow)map.panTo(ll,smooth?{animate:true,duration:dt,easeLinearity:1,noMoveStart:true}:{animate:true,duration:.4});
}

/* Datos móviles: 'allow' usa siempre internet, 'wifi' no baja mapas con datos móviles, 'never' usa solo lo guardado */
const connType=()=>{const c=navigator.connection;return c&&c.type?c.type:'unknown';};
const connLabel=()=>({wifi:'Wi‑Fi',cellular:'datos móviles',ethernet:'cable',none:'sin conexión',other:'otra',unknown:'el teléfono no lo informa',bluetooth:'bluetooth',wimax:'WiMAX'})[connType()]||connType();
function netBlocked(){
  if(S.dataMode==='never')return true;
  if(S.dataMode==='wifi')return connType()==='cellular';
  return false;
}
/* antes de una descarga a propósito (mapas, calles, relieve) */
async function netAllowed(what){
  if(S.dataMode==='never'){toast('Elegiste usar solo lo guardado (Ajustes → Datos móviles). No se descarga nada.',6000);return false;}
  if(S.dataMode==='wifi'&&connType()==='cellular')return confirm(`Estás con datos móviles. ¿Querés ${what} igual? Se va a gastar de tu plan.`);
  return true;
}
let wasBlocked=null;
function updNetPill(){
  const b=netBlocked(),p=$('#netpill');
  if(p){p.hidden=!b;p.textContent=S.dataMode==='never'?'📴 Solo mapas guardados':'📴 Sin datos móviles';}
  const c=$('#conn');if(c)c.textContent=connLabel();
  /* al volver a poder bajar, se vuelven a pedir las teselas que quedaron en blanco */
  if(wasBlocked===true&&!b){
    if(baseLayer&&baseLayer.redraw)baseLayer.redraw();
    for(const k of Object.keys(OVT))if(OVT[k].redraw)OVT[k].redraw();
  }

}

async function saveIncoming(){
  const g=INC.g,have=await DB.all('kv','track:');
  let last=null,nuevos=0;
  for(const t of g.tracks){
    const t0=t.pts[0][2],dup=have.find(h=>h.t0===t0&&h.pts.length===t.pts.length&&t0);
    if(dup){last=dup.id;continue;}
    const id=uid();last=id;nuevos++;
    await DB.put('kv','track:'+id,{id,name:t.name,t0,t1:t.pts[t.pts.length-1][2],pts:t.pts,stats:calcStats(t.pts),circuitId:null,laps:[],src:'gpx'});
  }
  const haveW=await DB.all('kv','wpt:');let nw=0;
  for(const w of g.wpts){
    if(haveW.some(h=>h.name===w.name&&Math.abs(h.lat-w.lat)<1e-5&&Math.abs(h.lon-w.lon)<1e-5))continue;
    await DB.put('kv','wpt:'+w.id,w);addWptMarker(w);nw++;
  }
  toast(nuevos||nw?`Guardado: ${nuevos} recorrido${nuevos===1?'':'s'}${nw?` y ${nw} punto${nw>1?'s':''}`:''}`:'Ya estaba guardado en Recorridos',4000);

}

/* Guía paso a paso siguiendo un recorrido (ruta fija, sin calles): de inicio a fin o al revés */
async function startFollow(tr,rev){
  if(!lastFix){toast('Todavía no hay señal de GPS: sin tu posición no puedo guiarte',5000);return;}
  const here=[lastFix.lat,lastFix.lon],pts=rev?tr.pts.slice().reverse():tr.pts;
  const st=tr.stats||calcStats(tr.pts),mode=tr.act==='bike'?'bike':tr.act==='car'?'car':'foot';
  const spd=st&&st.avg>0.3&&isFinite(st.avg)?st.avg*0.95:(mode==='foot'?1.2:mode==='bike'?4.5:12);
  const r=followTrackRoute(pts,here,{speed:spd,mode});
  if(r.error){toast(r.error,4000);return;}
  const end=pts[pts.length-1];
  RT.res={};RT.res[mode]=r;RT.sel=mode;RT.cands=[];
  RT.to={lat:end[0],lon:end[1],label:(rev?'Inicio de ':'Final de ')+tr.name};RT.from=null;RT.calcFrom={lat:here[0],lon:here[1]};
  if(r.offTrack>150)toast(`Estás a ${fmtD(r.offTrack)} del recorrido: andá hasta ${rev?'su final':'su comienzo'} y te voy guiando por la línea.`,9000);
  await startNav();
}

async function fetchJson(url){

  catch(e){

const ago=ms=>{const m=Math.max(0,Math.round((Date.now()-ms)/60000));return m<1?'recién':m<60?`hace ${m} min`:`hace ${Math.floor(m/60)} h ${m%60} min`;};

/* ===== Clima ===== */
const WXK='wx:last';
async function wxGet(lat,lon,o){
  o=o||{};
  const prev=await DB.get('kv',WXK),near=prev&&hav([prev.lat,prev.lon],[lat,lon])<8000;
  if(near&&!o.force&&Date.now()-prev.t<10*60000)return {sum:wxSummary(prev.data),t:prev.t,stale:false};
  if(netBlocked()&&!o.force){
    if(near)return {sum:wxSummary(prev.data),t:prev.t,stale:true,blocked:true};
    throw new Error('Sin datos móviles: no puedo consultar el clima');
  }
  try{
    const url=`https://api.open-meteo.com/v1/forecast?latitude=${lat.toFixed(4)}&longitude=${lon.toFixed(4)}&current=temperature_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m,wind_gusts_10m,wind_direction_10m&hourly=temperature_2m,precipitation_probability,precipitation,weather_code,wind_speed_10m,wind_gusts_10m&forecast_days=2&timezone=auto&wind_speed_unit=kmh`;
    const data=await fetchJson(url);
    if(!data||!data.current||!data.hourly)throw new Error('respuesta inesperada');
    await DB.put('kv',WXK,{t:Date.now(),lat,lon,data});
    return {sum:wxSummary(data),t:Date.now(),stale:false};
  }catch(e){
    if(near)return {sum:wxSummary(prev.data),t:prev.t,stale:true,err:e.message};
    throw new Error('No pude consultar el clima ('+(e.message||e)+')');
  }
}
function wxAlertsHtml(sum){
  return sum.alerts.map(a=>`<div class="wxal ${a.lvl}">${a.lvl==='danger'?'🚨':'⚠️'} ${esc(a.txt)}</div>`).join('');
}
function wxNowHtml(sum){
  const c=sum.cur,[ic,txt]=wxCode(c.weather_code),n=v=>v==null?'–':Math.round(v);
  return `<div class="wxnow"><span class="wxi">${ic}</span><b>${n(c.temperature_2m)}°</b> <small>sensación ${n(c.apparent_temperature)}°</small><br>${txt} · 💨 ${n(c.wind_speed_10m)} km/h${c.wind_direction_10m!=null?' del '+compassWord(c.wind_direction_10m):''} (ráfagas ${n(c.wind_gusts_10m)})</div>`;
}
async function showWeather(pt){

    <div id="wxBody"><p class="mut">Consultando el pronóstico…</p></div>

    <p class="mut small">Pronóstico: Open-Meteo.com · Radar: Weather data by Rain Viewer. El pronóstico es una guía: en la montaña cambia más rápido y por zona.</p>`,
    (a)=>{
      if(a==='wxme'){if(!lastFix){toast('Todavía sin GPS');return;}showWeather(null);}
      else if(a==='wxctr')showWeather([map.getCenter().lat,map.getCenter().lng]);

        <p class="mut small">Hora · tiempo · temp · lluvia · viento/ráfagas (km/h). Actualizado ${ago(w.t)}${w.stale?' — <b>dato guardado</b>'+(w.blocked?' (sin datos móviles)':''):''}.</p>
        <div class="row"><button class="btn sm" data-act="wxref">🔄 Actualizar</button></div>`;
    }catch(e){if($('#wxBody'))$('#wxBody').innerHTML=`<div class="wxal warn">⚠️ ${esc(e.message||String(e))}</div><div class="row"><button class="btn sm" data-act="wxref">Reintentar</button></div>`;}

/* ===== Radar de lluvia ===== */
const RV={on:false,frames:[],idx:0,host:'',layer:null,cov:null,url:'',timer:0,showCov:false};

}
function rvDraw(){
  if(RV.layer){map.removeLayer(RV.layer);RV.layer=null;}

  RV.layer=new CachedTiles(RV.url,{lid:'rv',offline:false,maxNativeZoom:7,maxZoom:21,opacity:.65,attribution:'Weather data by <a href="https://www.rainviewer.com">Rain Viewer</a>'});

}
async function setRadar(on,quiet){
  if(on){
    if(netBlocked()){if(!quiet)toast('El radar necesita internet y elegiste no usar datos móviles',5000);RV.on=false;S.radarOn=false;saveS();const c=$('#wxrv');if(c)c.checked=false;return;}
    try{await rvLoad();}catch(e){if(!quiet)toast('No pude cargar el radar: '+(e.message||e),5000);RV.on=false;S.radarOn=false;saveS();const c=$('#wxrv');if(c)c.checked=false;return;}
    RV.on=true;S.radarOn=true;saveS();rvDraw();
    clearInterval(RV.timer);
    RV.timer=setInterval(async()=>{if(!RV.on||netBlocked())return;try{await rvLoad();rvDraw();}catch(e){}},10*60000);
    if(!quiet)toast('Radar de las últimas 2 horas. Si el mapa no se pinta, tu zona puede no tener radar (🗺️ muestra la cobertura).',7000);

/* ===== Retorno seguro ===== */
const RS={key:null,d:null,here:null,fast:null,tok:0,custom:null,speed:1.1};
const actMode=()=>{const a=REC.state!=='idle'?REC.act:S.act;return a==='bike'?'bike':a==='car'?'car':'foot';};
async function returnSources(){

  if(REC.state!=='idle'&&REC.pts.length>=2)out.push({key:'rec',label:'Inicio de esta salida',pts:REC.pts});
  else{
    const ts=(await DB.all('kv','track:')).sort((a,b)=>(b.t1||0)-(a.t1||0)),t=ts[0];
    if(t&&t.pts&&t.pts.length>=2&&Date.now()-(t.t1||0)<24*3600000)out.push({key:'trk:'+t.id,label:'Inicio de la última salida',pts:t.pts});

async function returnDests(srcs,here){
  const out=srcs.map(s=>({key:'src:'+s.key,label:s.label,lat:s.pts[0][0],lon:s.pts[0][1],icon:'🏁',src:s}));

    .sort((a,b)=>hav(here,[a.lat,a.lon])-hav(here,[b.lat,b.lon])).slice(0,3).forEach(x=>out.push(x));

function sunLine(here){

async function showSafeReturn(key){

  /* clima */
  wxGet(here[0],here[1]).then(w=>{

/* ---------- Ver el último nivel disponible cuando el mapa no tiene más detalle ---------- */
/* Esri devuelve una imagen gris con "Map data not yet available" donde no hay más zoom. Acá se la detecta y, en lugar de mostrarla,
   se agranda la tesela del nivel anterior (aunque se vea con menos resolución). */
const VOID=new Set(),TPROM=new Map();
let _pc=null;
/* La tesela "Map data not yet available" es un fondo gris liso (del tono que sea) con letras: casi todos sus píxeles valen lo mismo.
   Una foto real, aunque sea nieve o cemento, tiene textura. Se mira a tamaño real, sin promediar. */
function isPlaceholder(bmp,size){
  if(size>30000)return false;
  if(!_pc){_pc=document.createElement('canvas');_pc.width=_pc.height=256;}
  const g=_pc.getContext('2d',{willReadFrequently:true});
  g.clearRect(0,0,256,256);
  g.drawImage(bmp,0,0,256,256);
  const d=g.getImageData(0,0,256,256).data,hist=new Uint32Array(256);
  let low=0,n=0;
  for(let i=0;i<d.length;i+=8){
    n++;
    if(Math.abs(d[i]-d[i+1])<7&&Math.abs(d[i+1]-d[i+2])<7)low++;
    hist[d[i+1]]++;
  }
  if(low/n<0.95)return false;
  let mode=0;for(let v=1;v<256;v++)if(hist[v]>hist[mode])mode=v;
  let near=0;for(let v=Math.max(0,mode-2);v<=Math.min(255,mode+2);v++)near+=hist[v];
  return near/n>0.70;
}
/* la misma tesela se pide una sola vez aunque la usen varias a la vez */
function tileBlobOnce(opt,z,x,y){
  const key=opt.lid+'/'+z+'/'+x+'/'+y;
  let p=TPROM.get(key);
  if(p)return p;
  p=(async()=>{
    if(opt.offline){try{const b=await DB.get('tiles',key);if(b)return b;}catch(e){}}
    if(netBlocked())return null;                  /* sin gastar datos: solo lo guardado */
    try{return await getTileBlob(tileUrl(LAYERS[opt.lid],z,x,y));}catch(e){return null;}
  })().then(v=>{if(v===null)TPROM.delete(key);return v;});
  TPROM.set(key,p);
  if(TPROM.size>500)TPROM.delete(TPROM.keys().next().value);
  return p;
}
/* Devuelve {bmp,d}: la imagen del nivel z-d que cubre la tesela pedida, o null si no hay ninguna */
async function tileFallback(opt,z,x,y){
  const n=Math.pow(2,z);x=((x%n)+n)%n;
  for(let d=0;d<=5&&z-d>=10;d++){
    const zz=z-d,xx=x>>d,yy=y>>d,key=opt.lid+'/'+zz+'/'+xx+'/'+yy;
    if(VOID.has(key))continue;
    if(zz>=15&&VOID.has(opt.lid+'/'+(zz-1)+'/'+(xx>>1)+'/'+(yy>>1))){VOID.add(key);continue;}   /* si el nivel de arriba está vacío, este también */
    const b=await tileBlobOnce(opt,zz,xx,yy);
    if(!b)continue;
    let bmp;try{bmp=await createImageBitmap(b);}catch(e){continue;}
    if(zz>=15&&isPlaceholder(bmp,b.size)){VOID.add(key);continue;}
    return {bmp,d};
  }
  return null;
}
function fbTile(layer,coords,done){
  const dpr=Math.min(2,window.devicePixelRatio||1),c=document.createElement('canvas');
  c.width=c.height=Math.round(256*dpr);c.style.width=c.style.height='256px';
  tileFallback(layer.options,coords.z,coords.x,coords.y).then(r=>{
    if(r){
      const g=c.getContext('2d'),k=Math.pow(2,r.d),sw=r.bmp.width/k,sh=r.bmp.height/k,n=Math.pow(2,coords.z),xm=((coords.x%n)+n)%n;
      g.imageSmoothingEnabled=true;g.imageSmoothingQuality='high';
      g.drawImage(r.bmp,(xm%k)*sw,(coords.y%k)*sh,sw,sh,0,0,c.width,c.height);
    }
    done(null,c);
  }).catch(()=>done(null,c));
  return c;
}

      const i1=Math.min(i0+24,np-1);
      let a=90,b=-90,c=180,d=-180;
      for(let i=i0;i<=i1;i++){const la=w.p[2*i],lo=w.p[2*i+1];if(la<a)a=la;if(la>b)b=la;if(lo<c)c=lo;if(lo>d)d=lo;}
      const id=chunks.length;chunks.push({w:wi,i0,i1,bb:[a,c,b,d]});
      const ci0=Math.floor(a/cs)+20000,ci1=Math.floor(b/cs)+20000,cj0=Math.floor(c/cs)+40000,cj1=Math.floor(d/cs)+40000;
      if((ci1-ci0+1)*(cj1-cj0+1)>400)big.push(id);
      else for(let i=ci0;i<=ci1;i++)for(let j=cj0;j<=cj1;j++){const k=vkey(i,j);let l=cells.get(k);if(!l){l=[];cells.set(k,l);}l.push(id);}
    }
  }
  /* lo calcado por el usuario también va al mapa */
  const add=(w,cls,name,p,ref,minz)=>{
    const wi=ways.length;ways.push({cls,name,ref:ref||'',p,minz:minz||null});
    const np=p.length/2;
    for(let i0=0;i0<np-1;i0+=24){
      const i1=Math.min(i0+24,np-1);let a=90,b=-90,c=180,d=-180;
      for(let i=i0;i<=i1;i++){const la=p[2*i],lo=p[2*i+1];if(la<a)a=la;if(la>b)b=la;if(lo<c)c=lo;if(lo>d)d=lo;}
      const id=chunks.length;chunks.push({w:wi,i0,i1,bb:[a,c,b,d]});
      const ci0=Math.floor(a/cs)+20000,ci1=Math.floor(b/cs)+20000,cj0=Math.floor(c/cs)+40000,cj1=Math.floor(d/cs)+40000;
      if((ci1-ci0+1)*(cj1-cj0+1)>400)big.push(id);
      else for(let i=ci0;i<=ci1;i++)for(let j=cj0;j<=cj1;j++){const k=vkey(i,j);let l=cells.get(k);if(!l){l=[];cells.set(k,l);}l.push(id);}
    }
  };
  const edits=await DB.all('kv','edit:'),areas=[];
  for(const e of edits){
    if(e.type==='path'&&e.pts&&e.pts.length>1){
      const q=e.props||{};
      let cls=VKIND[e.kind]||'path',name=e.name||'';
      if(e.kind==='nivel'){cls=(q.ele>0&&q.ele%100===0)?'contour_major':'contour_minor';if(!name&&q.ele)name=q.ele+' m';}
      add(e,cls,name,e.pts.flatMap(p=>[p[0],p[1]]),q.ref,q.minz);
    }else if(e.type==='area'&&e.pts&&e.pts.length>=3){
      let a=90,b=-90,c=180,d=-180;
      for(const p of e.pts){if(p[0]<a)a=p[0];if(p[0]>b)b=p[0];if(p[1]<c)c=p[1];if(p[1]>d)d=p[1];}
      areas.push({kind:e.kind,name:e.name||'',pts:e.pts,bb:[a,c,b,d],minz:e.props&&e.props.minz||null,closed:areaRestricted(e)});
    }
  }
  /* curvas de nivel generadas a partir del relieve descargado */
  for(const set of await DB.all('kv','ctr:'))for(const l of set.lines){
    const major=l.e%(5*set.interval)===0;
    add(l,major?'contour_major':'contour_minor',major?l.e+' m':'',l.p,'',null);
  }
  Object.assign(VEC,{ways,chunks,cells,big,areas,ready:true,count:ways.length+areas.length});
  if(VEC.dirty)return vecBuild();
}
function vecEnsure(){
  if(VEC.ready&&!VEC.dirty)return Promise.resolve();
  if(!VEC.building)VEC.building=vecBuild().catch(()=>{}).then(()=>{VEC.building=null;});
  return VEC.building;
}
function vecInvalidate(){
  VEC.dirty=true;
  if(S.layer==='vec'||ctrLayer)vecEnsure().then(()=>{if(S.layer==='vec'&&baseLayer&&baseLayer.redraw)baseLayer.redraw();if(ctrLayer&&ctrLayer.redraw)ctrLayer.redraw();});
}
const vlon=(x,z)=>x/Math.pow(2,z)*360-180;
const vlat=(y,z)=>{const n=Math.PI-2*Math.PI*y/Math.pow(2,z);return 180/Math.PI*Math.atan(.5*(Math.exp(n)-Math.exp(-n)));};
function vecPx(lat,lon,z,tx,ty){
  const n=Math.pow(2,z),r=lat*rad;
  return [((lon+180)/360*n-tx)*256,((1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*n-ty)*256];
}
/* Dibuja una tesela de 256 px. Devuelve cuántos tramos dibujó. */
function vecDraw(canvas,z,tx,ty,night,only){
  const dpr=Math.min(2,window.devicePixelRatio||1);
  canvas.width=canvas.height=Math.round(256*dpr);canvas.style.width=canvas.style.height='256px';
  const ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);
  if(!only){ctx.fillStyle=night?VNIGHT.bg:'#F2EFE9';ctx.fillRect(0,0,256,256);}
  if(!VEC.ready||!(VEC.chunks.length||VEC.areas.length))return 0;
  const n=Math.pow(2,z);tx=((tx%n)+n)%n;
  const la1=vlat(ty,z),la0=vlat(ty+1,z),lo0=vlon(tx,z),lo1=vlon(tx+1,z),mLa=(la1-la0)*14/256,mLo=(lo1-lo0)*14/256;
  const A=la0-mLa,B=la1+mLa,C=lo0-mLo,D=lo1+mLo,cs=VEC.cs;
  const ids=new Set();
  for(let i=Math.floor(A/cs)+20000;i<=Math.floor(B/cs)+20000;i++)for(let j=Math.floor(C/cs)+40000;j<=Math.floor(D/cs)+40000;j++){
    const l=VEC.cells.get(vkey(i,j));if(l)for(const id of l)ids.add(id);
  }
  for(const id of VEC.big)ids.add(id);
  const by={};
  for(const id of ids){
    const ch=VEC.chunks[id],bb=ch.bb;
    if(bb[2]<A||bb[0]>B||bb[3]<C||bb[1]>D)continue;
    const cls=VEC.ways[ch.w].cls;
    (by[cls]=by[cls]||[]).push(ch);
  }
  ctx.lineCap='round';ctx.lineJoin='round';
  let drawn=0;const labs=new Map(),alabs=[];
  /* áreas: bajo las curvas y las calles */
  if(!only)for(const ar of VEC.areas){
    const bb=ar.bb;
    if(bb[2]<A||bb[0]>B||bb[3]<C||bb[1]>D)continue;
    if(z<(ar.minz!=null?ar.minz:(ar.kind==='agua'||ar.kind==='nieve'?6:ar.kind==='bosque'?9:12)))continue;
    ctx.beginPath();
    ar.pts.forEach((p,i)=>{const q=vecPx(p[0],p[1],z,tx,ty);if(i)ctx.lineTo(q[0],q[1]);else ctx.moveTo(q[0],q[1]);});
    ctx.closePath();
    ctx.fillStyle=(night?AREA_COLN:AREA_COL)[ar.kind]||(night?'#2C363C':'#E0DCD2');ctx.fill();
    ctx.setLineDash(ar.closed?[6,4]:[]);ctx.lineWidth=ar.closed?1.6:1;ctx.strokeStyle=ar.closed?'#D0392B':(night?'rgba(255,255,255,.12)':'rgba(0,0,0,.18)');ctx.stroke();ctx.setLineDash([]);
    drawn++;
    if(ar.name&&z>=14){const q=vecPx((bb[0]+bb[2])/2,(bb[1]+bb[3])/2,z,tx,ty);if(q[0]>8&&q[0]<248&&q[1]>8&&q[1]<248)alabs.push({nm:ar.name,x:q[0],y:q[1]});}
  }
  const scale=Math.pow(2,(z-14)*.45);
  for(const cls of VORDER){
    const list=by[cls],st=VSTY[cls];
    if(!list||(only&&cls.indexOf('contour')!==0))continue;
    const w=Math.max(.9,st.w*scale);
    const path=new Path2D();
    for(const ch of list){
      const way=VEC.ways[ch.w];let first=true,prev=null;
      if(z<(way.minz!=null?way.minz:st.z))continue;
      const pts=[];
      for(let i=ch.i0;i<=ch.i1;i++){
        const p=vecPx(way.p[2*i],way.p[2*i+1],z,tx,ty);pts.push(p);
        if(first){path.moveTo(p[0],p[1]);first=false;}else path.lineTo(p[0],p[1]);
      }
      drawn++;
      const nm=way.name||(st.lab<=12?way.ref:'');
      if(nm&&z>=st.lab){
        for(let i=1;i<pts.length;i++){
          const [x0,y0]=pts[i-1],[x1,y1]=pts[i],L=Math.hypot(x1-x0,y1-y0),mx=(x0+x1)/2,my=(y0+y1)/2;
          if(mx<6||mx>250||my<6||my>250||L<24)continue;
          const cur=labs.get(ch.w);
          if(!cur||L>cur.L)labs.set(ch.w,{w:ch.w,nm,L,mx,my,ang:Math.atan2(y1-y0,x1-x0),ord:VORDER.indexOf(cls)});
        }
      }
    }
    if(st.cs){
      ctx.setLineDash([]);ctx.strokeStyle=night?VNIGHT.cs:st.cs;ctx.lineWidth=w+(w>3?2.4:1.6);ctx.stroke(path);
      ctx.strokeStyle=night?VNIGHT.c[cls]:st.c;ctx.lineWidth=w;ctx.stroke(path);
    }else{
      ctx.lineCap='butt';ctx.setLineDash((st.dash||[]).map(v=>v*Math.max(1,w*.7)));ctx.strokeStyle=night?VNIGHT.c[cls]:st.c;ctx.lineWidth=w;ctx.stroke(path);ctx.setLineDash([]);ctx.lineCap='round';
    }
  }
  for(const al of alabs){
    ctx.font='700 12px system-ui,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineWidth=3;
    ctx.strokeStyle=night?VNIGHT.halo:'rgba(255,255,255,.85)';ctx.strokeText(al.nm,al.x,al.y);ctx.fillStyle=night?VNIGHT.txt:'#4A5A40';ctx.fillText(al.nm,al.x,al.y);
  }
  /* nombres de calles: sobre el trazo, sin pisarse */
  if(labs.size){
    ctx.font='600 11px system-ui,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineWidth=3;
    const placed=[];
    for(const it of [...labs.values()].sort((a,b)=>b.ord-a.ord)){
      const tw=ctx.measureText(it.nm).width;
      if(it.L<tw+8)continue;
      if(placed.some(q=>Math.hypot(q.x-it.mx,q.y-it.my)<(q.r+tw/2+4)))continue;
      let ang=it.ang;if(ang>Math.PI/2||ang<-Math.PI/2)ang+=Math.PI;
      ctx.save();ctx.translate(it.mx,it.my);ctx.rotate(ang);
      ctx.strokeStyle=night?VNIGHT.halo:'rgba(255,255,255,.9)';ctx.strokeText(it.nm,0,0);
      ctx.fillStyle=night?VNIGHT.txt:'#3A3A3A';ctx.fillText(it.nm,0,0);ctx.restore();
      placed.push({x:it.mx,y:it.my,r:tw/2});
    }
  }
  return drawn;
}

const ORI={ok:null,sign:1,cur:0,comp:null,t:0,bound:false,setB:null,manualUntil:0};
const POS={hdg:null};
const getB=()=>{try{return typeof map.getBearing==='function'?(map.getBearing()||0):0;}catch(e){return 0;}};
const canRotatePlugin=()=>!!(L.Map&&L.Map.prototype&&typeof L.Map.prototype.setBearing==='function');
/* Averigua para qué lado hay que girar el mapa: probamos con un punto al este y vemos si queda arriba */
function oriCalib(){
  if(ORI.ok!==null)return ORI.ok;
  try{
    if(!map.options.rotate||typeof map.setBearing!=='function')throw new Error('sin rotación');
    const c=map.getCenter(),s=map.getSize(),mpp=40075016.686*Math.cos(c.lat*rad)/(256*Math.pow(2,map.getZoom()));
    for(const sg of [1,-1]){
      map.setBearing(sg*90);
      const p=destPoint(c.lat,c.lng,90,120*mpp),cp=map.latLngToContainerPoint(p),up=s.y/2-cp.y;
      if(up>60&&Math.abs(cp.x-s.x/2)<up*.35){ORI.sign=sg;ORI.ok=true;map.setBearing(0);return true;}
    }
  }catch(e){}
  ORI.ok=false;
  try{map.setBearing(0);}catch(e){}
  toast('No pude activar la rotación del mapa en este teléfono: queda con el norte arriba',6000);
  return false;
}
function setHeading(h){
  if(Date.now()<ORI.manualUntil)return;      /* si giraste con los dedos, no lo pisamos por un rato */
  if(!oriCalib())return;
  const d=((h-ORI.cur+540)%360)-180;
  if(Math.abs(d)<2)return;
  ORI.cur=(ORI.cur+d*.4+360)%360;
  map.setBearing(ORI.sign*ORI.cur);ORI.setB=ORI.sign*ORI.cur;
}
function oriFromFix(f){
  if(S.orient==='course'&&f.speed!=null&&f.speed>0.8&&f.brg!=null&&!isNaN(f.brg))setHeading(f.brg);
}
function onCompass(e){
  if(S.orient!=='compass')return;
  let h=null;
  if(e.webkitCompassHeading!=null)h=e.webkitCompassHeading;
  else if((e.absolute||e.type==='deviceorientationabsolute')&&e.alpha!=null&&e.beta!=null)h=headingFromOrientation(e.alpha,e.beta,e.gamma||0);
  if(h==null)return;
  ORI.comp=smoothAngle(ORI.comp,h,.2);
  const now=Date.now();if(now-ORI.t<200)return;
  ORI.t=now;setHeading(ORI.comp);
}
function oriStart(){
  if(ORI.bound)return;
  window.addEventListener('deviceorientationabsolute',onCompass,true);
  window.addEventListener('deviceorientation',onCompass,true);
  ORI.bound=true;
}
/* devuelve true si el cambio se aplicó */
function changeOrient(k){
  if(k===S.orient)return true;
  if(k!=='north'&&!canRotatePlugin()){toast('Esta versión no trae el módulo para rotar el mapa. Instalá el APK nuevo completo.',6000);return false;}
  const needReload=k!=='north'&&!(map.options&&map.options.rotate);
  if(needReload&&REC.state!=='idle'){toast('Terminá la grabación para cambiar la orientación',4000);return false;}
  S.orient=k;saveS();
  if(k==='north'){ORI.cur=0;try{if(map.setBearing)map.setBearing(0);}catch(e){}}
  else if(needReload){toast('Reiniciando el mapa para rotarlo…',1500);setTimeout(()=>location.reload(),1200);}
  else oriStart();
  return true;
}

let ttsNative=null;
function sayWeb(t){
  try{const u=new SpeechSynthesisUtterance(t);u.lang='es-AR';u.rate=1.05;speechSynthesis.cancel();speechSynthesis.speak(u);return true;}catch(e){return false;}
}
async function say(t){
  if(!S.voice)return;
  if(isNative()&&ttsNative!==false){
    try{
      const T=plugin('TextToSpeech');
      try{await T.stop();}catch(e){}
      try{await T.speak({text:t,lang:'es-AR',rate:1,pitch:1,volume:1,category:'ambient'});}
      catch(e1){ if(ttsNative!==null)throw e1; await T.speak({text:t,lang:'es-ES',rate:1,pitch:1,volume:1,category:'ambient'}); }
      ttsNative=true;return;
    }catch(e){ if(ttsNative===null)ttsNative=false; }
  }
  sayWeb(t);
}

    <h3>🏊 Aguas abiertas</h3>
    <label for="sw">Ritmo de nado (segundos cada 100 m)</label><input class="in" id="sw" type="number" min="45" max="300" step="5" value="${S.swimSec||120}">
    <p class="mut" id="swh">${fmtPace100(S.swimSec||120)} · ${(swimV(S.swimSec||120)*3.6).toFixed(1).replace('.',',')} km/h. Con 120 s son 3 km/h.</p>
    <label class="chk"><input type="checkbox" id="swc" ${S.swimShore?'checked':''}> Costear: nadar cerca de la orilla en vez de cruzar los lagos en línea recta (más largo, pero más seguro)</label>
    <h3>Rendimiento</h3>
    <button class="btn" data-act="diag">🩺 Diagnóstico de rendimiento y registro del GPS</button>
    <h3>Datos móviles</h3>
    ${chips('dm',S.dataMode,[['allow','📶 Usar siempre'],['wifi','📡 Solo con Wi‑Fi'],['never','📴 Nunca: solo lo guardado']])}
    <p class="mut">Con <b>Solo con Wi‑Fi</b>, si estás con datos móviles el mapa no baja imágenes nuevas y las descargas te piden confirmación. Con <b>Nunca</b>, no se usa internet para mapas aunque haya Wi‑Fi. Siempre se ven los mapas que ya tengas guardados. Conexión detectada ahora: <b id="conn"></b>.</p>
    <label class="chk"><input type="checkbox" id="s18" ${S.wxWatch!==false?'checked':''}> Avisarme si el clima empeora mientras grabo (consulta el pronóstico cada 20 min)</label>
    <h3>GPS</h3>
    <label for="s1">Precisión máxima aceptada (m)</label><input class="in" id="s1" type="number" min="5" max="150" value="${S.maxAcc}">
    <p class="mut">Los puntos con peor precisión se descartan. Bajo el follaje conviene subirla a 40 o 50.</p>
    <label for="s2">Distancia mínima entre puntos (m)</label><input class="in" id="s2" type="number" min="1" max="30" value="${S.minDist}">
    <label for="s3">Unidad de velocidad</label>
    <select class="in" id="s3"><option value="kmh">km/h</option><option value="minkm">min/km (carrera)</option><option value="min500">min/500 m (kayak)</option></select>
    <h3>Avisos</h3>
    <label class="chk"><input type="checkbox" id="s4" ${S.voice?'checked':''}> Avisos por voz y sonido (puertas y guía)</label>
    <button class="btn sm" data-act="tv">🔊 Probar la voz</button>
    <label class="chk"><input type="checkbox" id="s5" ${S.keepAwake?'checked':''}> Mantener la pantalla encendida al grabar</label>
    <h3>Cómo se estima el tiempo de las rutas</h3>
    ${chips('tm',S.timeMode,[['model','🛣️ Por tipo de calle'],['avg','📈 Por mi velocidad promedio']])}
    <p class="mut">Por tipo de calle: en auto usa la velocidad máxima de cada calle (o la típica de su tipo) por el factor de tráfico; a pie y en bici, tu velocidad según el tipo de camino y la pendiente. Por velocidad promedio: distancia dividida tu promedio real, más un porcentaje de paradas; sirve si tus salidas grabadas se parecen a lo que vas a hacer (misma ciudad, mismo tipo de camino). El ferry se suma aparte.</p>
    <label for="s11">Promedio a pie (km/h)</label><input class="in" id="s11" type="number" step="0.1" min="1" max="12" value="${S.avgFoot}">
    <label for="s12">Promedio en bici (km/h)</label><input class="in" id="s12" type="number" step="0.1" min="3" max="45" value="${S.avgBike}">
    <label for="s13">Promedio en auto (km/h)</label><input class="in" id="s13" type="number" step="1" min="10" max="120" value="${S.avgCar}">
    <label for="s14">Paradas y demoras (% extra)</label><input class="in" id="s14" type="number" step="1" min="0" max="60" value="${S.avgStops}">
    <button class="btn sm" data-act="cal">📈 Calcular desde mis salidas grabadas</button><p id="calmsg" class="mut"></p>
    <h3>Velocidades del modo "por tipo de calle"</h3>
    <label for="s6">Tu velocidad a pie (km/h)</label><input class="in" id="s6" type="number" step="0.5" min="2" max="10" value="${S.vFoot}">
    <label for="s7">Tu velocidad en bici (km/h)</label><input class="in" id="s7" type="number" step="1" min="5" max="40" value="${S.vBike}">
    <label for="s8">Tráfico en auto</label>
    <select class="in" id="s8"><option value="0.6">Pesado (60 % de la velocidad legal)</option><option value="0.8">Normal (80 %)</option><option value="1">Fluido (100 %)</option></select>
    <label for="s10">Espera para embarcar en un ferry (min)</label><input class="in" id="s10" type="number" min="0" max="240" value="${S.ferryWait}">
    <p class="mut">Se suma al tiempo del cruce. Los horarios reales no están en el mapa: conviene confirmarlos.</p>
    <label for="s9">Ruta que se muestra primero</label>
    <select class="in" id="s9"><option value="foot">A pie</option><option value="bike">En bici</option><option value="car">En auto</option></select>
    <h3>Copia de seguridad</h3>
    <p class="mut">Guarda tracks, marcas, puntos, circuitos, correcciones, fotos de dron y la lista de mapas descargados. Los mapas en sí no entran (pesan mucho): al importar la copia, la app los vuelve a bajar con un toque. Hacela antes de reinstalar.</p>
    <div class="row"><button class="btn" data-act="bk">Exportar copia completa</button><button class="btn" data-act="imp">Importar copia o GPX</button></div>
    <p class="mut" style="margin-top:16px">Rumbo <span id="ver"></span> · Mapas: Esri, OpenStreetMap, OpenTopoMap, Sentinel-2 · Calles: © colaboradores de OpenStreetMap (ODbL)</p>`,
    async(a,d)=>{
      if(a==='bk')exportFull();
      else if(a==='imp')importFile();
      else if(a==='tv'){
        unlockAudio();beep(880,.12);
        if(isNative()){
          await say('Prueba de voz. En cien metros, girá a la derecha. Lomo de burro en cincuenta metros.');
          toast(ttsNative?'Se oye con la voz del sistema. Si no oís nada, subí el volumen multimedia.':'La voz del sistema no responde: revisá Ajustes del teléfono → Administración general → Texto a voz.',6000);
        }else{
          if(!window.speechSynthesis){toast('Este navegador no tiene voz',4000);return;}
          sayWeb('Prueba de voz. En cien metros, girá a la derecha.');
        }
      }
      else if(a==='tm'){S.timeMode=d.k;saveS();dropGraph();sBody.querySelectorAll('[data-act=tm]').forEach(b=>b.classList.toggle('on',b.dataset.k===d.k));}
      else if(a==='cal'){
        const r=avgSpeeds(await DB.all('kv','track:')),names={foot:'A pie',bike:'En bici',car:'En auto'},f={foot:'avgFoot',bike:'avgBike',car:'avgCar'},ids={foot:'#s11',bike:'#s12',car:'#s13'},got=[];
        for(const k of MODES)if(r[k]&&r[k].km>=3){S[f[k]]=Math.round(r[k].kmh*10)/10;$(ids[k]).value=S[f[k]];got.push(`${names[k]}: ${S[f[k]]} km/h (${r[k].n} salida${r[k].n>1?'s':''}, ${Math.round(r[k].km)} km)`);}
        if(r.stops!=null&&got.length){S.avgStops=r.stops;$('#s14').value=r.stops;}
        saveS();dropGraph();
        $('#calmsg').textContent=got.length?'Listo. '+got.join(' · ')+(r.stops!=null?` · Paradas: ${r.stops} %`:'')+'. Ahora elegí "Por mi velocidad promedio" arriba.':'Todavía no hay suficientes salidas grabadas (hacen falta al menos 3 km por tipo de actividad: caminata, bici o auto).';
      }
      else if(a==='diag')showDiag();
      else if(a==='dm'){S.dataMode=d.k;saveS();updNetPill();sBody.querySelectorAll('[data-act=dm]').forEach(b=>b.classList.toggle('on',b.dataset.k===d.k));}
      else if(a==='nt'){S.night=d.k;saveS();applyNight();sBody.querySelectorAll('[data-act=nt]').forEach(b=>b.classList.toggle('on',b.dataset.k===d.k));}
      else if(a==='ori'){if(changeOrient(d.k))sBody.querySelectorAll('[data-act=ori]').forEach(b=>b.classList.toggle('on',b.dataset.k===d.k));}
    },
    t=>{
      if(t.id==='s1')S.maxAcc=Math.max(5,+t.value||30);
      else if(t.id==='s2')S.minDist=Math.max(1,+t.value||3);
      else if(t.id==='s3')S.speedMode=t.value;
      else if(t.id==='s4')S.voice=t.checked;
      else if(t.id==='s5')S.keepAwake=t.checked;
      else if(t.id==='s6'){S.vFoot=Math.max(2,Math.min(10,+t.value||5));dropGraph();}
      else if(t.id==='s7'){S.vBike=Math.max(5,Math.min(40,+t.value||16));dropGraph();}
      else if(t.id==='s8'){S.carF=+t.value;dropGraph();}
      else if(t.id==='s9')S.routeMode=t.value;
      else if(t.id==='s17'){S.smooth=t.checked;saveS();}
      else if(t.id==='s19'){S.penMode=t.checked;saveS();}
      else if(t.id==='sw'){S.swimSec=Math.max(45,Math.min(300,Math.round(+t.value||120)));saveS();const h=$('#swh');if(h)h.textContent=`${fmtPace100(S.swimSec)} · ${(swimV(S.swimSec)*3.6).toFixed(1).replace('.',',')} km/h. Con 120 s son 3 km/h.`;}
      else if(t.id==='swc'){S.swimShore=t.checked;saveS();}
      else if(t.id==='kv'){S.vKayak=Math.max(2,Math.min(15,+t.value||7));saveS();}
      else if(t.id==='kc'){S.kCur=Math.max(0,Math.min(10,+t.value||0));saveS();kayakDrop();}
      else if(t.id==='s18'){S.wxWatch=t.checked;saveS();}
      else if(t.id==='s15'){
        if(t.checked&&!canRotatePlugin()){t.checked=false;toast('Esta versión no trae el módulo para rotar el mapa.',5000);return;}
        S.fingerRotate=t.checked;saveS();
        if(REC.state!=='idle'){toast('Se aplica la próxima vez que abras la app',4000);return;}
        toast('Reiniciando el mapa…',1500);setTimeout(()=>location.reload(),1200);
      }
      else if(t.id==='s16'){S.navOp=+t.value/100;$('#s16v').textContent=t.value+' %';applyNavOp();}
      else if(t.id==='s11'){S.avgFoot=Math.max(1,Math.min(12,+t.value||5));dropGraph();}
      else if(t.id==='s12'){S.avgBike=Math.max(3,Math.min(45,+t.value||16));dropGraph();}
      else if(t.id==='s13'){S.avgCar=Math.max(10,Math.min(120,+t.value||45));dropGraph();}
      else if(t.id==='s14'){S.avgStops=Math.max(0,Math.min(60,+t.value||0));dropGraph();}
      else if(t.id==='s10'){S.ferryWait=Math.max(0,Math.min(240,+t.value||0));dropGraph();}
      saveS();
    });
  updNetPill();
  $('#s3').value=S.speedMode;$('#s8').value=String(S.carF);$('#s9').value=S.routeMode;
  if(isNative())try{plugin('App').getInfo().then(i=>{const e=$('#ver');if(e)e.textContent='v'+i.version+' (build '+i.build+')';}).catch(()=>{});}catch(e){}
}

/* ---------- Botones ---------- */
$('#nMaps').onclick=showMaps;
$('#nRoutes').onclick=showRoutes;
$('#nGates').onclick=showCircuits;
$('#nMore').onclick=showMoreMenu;
$('#fPts').onclick=showPoints;
$('#fIn').onclick=()=>map.zoomIn();
$('#fOut').onclick=()=>map.zoomOut();
$('#fLoc').onclick=()=>{
  if(!lastFix){toast('Todavía sin GPS');return;}
  setFollow(true);map.setView([lastFix.lat,lastFix.lon],Math.max(map.getZoom(),16));
};
$('#fAct').onclick=()=>{
  if(REC.state!=='idle'){toast('La actividad se cambia al terminar la grabación');return;}
  const k=Object.keys(ACT);S.act=k[(k.indexOf(S.act)+1)%k.length];saveS();updActBtn();
  toast(ACT[S.act][0]+' '+ACT[S.act][1]);
};

/* ---------- Inicio ---------- */
(async()=>{
  await DB.open();
  await loadSources();
  await loadGpsLog();
  setLayer(S.layer);applyOverlays();
  await loadRuns();
  await migrate();
  await loadWpts();
  await loadOvl();
  updActBtn();updRecUi();
  applyNight();applyNavOp();updNetPill();if(map.options&&map.options.rotate){oriCalib();oriStart();}
  startWatch(false);
  setTimeout(checkIntent,700);
  restoreTarget();
  if(S.radarOn)setTimeout(()=>setRadar(true,true),1800);
  drawEdits();
  const rc=await DB.get('kv','rec:current');
  if(rc&&rc.pts&&rc.pts.length>1)offerRecover(rc);
  if(isNative()){
    try{
      const App=plugin('App');
      App.addListener('backButton',()=>{
        if(draw)cancelDraw();
        else if(PICK)cancelPick();
        else if(sheet.classList.contains('open'))closeSheet();
        else App.minimizeApp();
      });
      App.addListener('appStateChange',s=>{if(s&&s.isActive)checkIntent();});
    }catch(e){}
  }
})();
</script>
</body>
</html>
