/* ====================== KAYAK: RED DE AGUA (ríos y lagos dibujados o bajados) ====================== */
/* rivers: [{pts:[[lat,lon]…], name, flow:1 (dibujado aguas abajo) | 0 (no se sabe), cur: corriente en m/s}]
   lakes:  [{pts: anillo [[lat,lon]…], name}] */
function buildWaterGraph(rivers,lakes,o){
  o=o||{};
  const MERGE=o.merge||15,TJ=o.tj||60,PORTAL=o.portal||300;
  const lat=[],lon=[],adj=[],CS=0.002,cells=new Map();
  const ck=(la,lo)=>(Math.floor(la/CS)+100000)*1000000+(Math.floor(lo/CS)+300000);
  const near=(p,r)=>{                 /* nodo existente más cercano a menos de r metros */
    const ci=Math.floor(p[0]/CS)+100000,cj=Math.floor(p[1]/CS)+300000;let best=-1,bd=r;
    for(let i=ci-1;i<=ci+1;i++)for(let j=cj-1;j<=cj+1;j++){const l=cells.get(i*1000000+j);if(!l)continue;for(const n of l){const d=hav(p,[lat[n],lon[n]]);if(d<=bd){bd=d;best=n;}}}
    return best;
  };
  const mk=p=>{const n=lat.length;lat.push(p[0]);lon.push(p[1]);adj.push([]);const k=ck(p[0],p[1]);let l=cells.get(k);if(!l){l=[];cells.set(k,l);}l.push(n);return n;};
  const nodeFor=p=>{const n=near(p,MERGE);return n>=0?n:mk(p);};
  const edge=(a,b,kind,flow,cur,name,cross)=>{
    if(a===b)return;
    const len=hav([lat[a],lon[a]],[lat[b],lon[b]]);
    adj[a].push({to:b,len,kind,flow,cur,name,cross});adj[b].push({to:a,len,kind,flow:-flow,cur,name,cross});
  };
  const rem=(a,b)=>{adj[a]=adj[a].filter(e=>e.to!==b);adj[b]=adj[b].filter(e=>e.to!==a);};
  /* ríos */
  const segs=[];
  for(const r of rivers){
    let prev=-1;
    for(const p of r.pts){
      const n=nodeFor(p);
      if(prev>=0&&prev!==n){edge(prev,n,'river',r.flow?1:0,r.cur||0,r.name||'');segs.push([prev,n,r.flow?1:0,r.cur||0,r.name||'']);}
      prev=n;
    }
  }
  /* uniones en T: un extremo suelto que cae cerca del medio de otro río se une ahí */
  const SC=0.01,sidx=new Map(),skey=(i,j)=>(i+20000)*100000+(j+40000);
  const addSeg=(si)=>{const [a,b]=segs[si];const i0=Math.floor(Math.min(lat[a],lat[b])/SC),i1=Math.floor(Math.max(lat[a],lat[b])/SC),j0=Math.floor(Math.min(lon[a],lon[b])/SC),j1=Math.floor(Math.max(lon[a],lon[b])/SC);for(let i=i0;i<=i1;i++)for(let j=j0;j<=j1;j++){const k=skey(i,j);let l=sidx.get(k);if(!l){l=[];sidx.set(k,l);}l.push(si);}};
  segs.forEach((_,i)=>addSeg(i));
  const ends=[];for(let n=0;n<lat.length;n++)if(adj[n].length===1)ends.push(n);
  for(const n of ends){
    const p=[lat[n],lon[n]],i=Math.floor(p[0]/SC),j=Math.floor(p[1]/SC);let best=null;
    for(let a=i-1;a<=i+1;a++)for(let b=j-1;b<=j+1;b++){const l=sidx.get(skey(a,b));if(!l)continue;
      for(const si of l){const s=segs[si];if(!s||s[0]===n||s[1]===n)continue;
        const pr=projSeg([lat[s[0]],lon[s[0]]],[lat[s[1]],lon[s[1]]],p);
        if(pr.d<=TJ&&(!best||pr.d<best.d))best={si,d:pr.d,pt:pr.pt,t:pr.t};}}
    if(!best)continue;
    const s=segs[best.si];let m;
    if(best.t<0.02)m=s[0];else if(best.t>0.98)m=s[1];
    else{m=mk(best.pt);rem(s[0],s[1]);edge(s[0],m,'river',s[2],s[3],s[4]);edge(m,s[1],'river',s[2],s[3],s[4]);segs[best.si]=null;segs.push([s[0],m,s[2],s[3],s[4]],[m,s[1],s[2],s[3],s[4]]);addSeg(segs.length-2);addSeg(segs.length-1);}
    edge(n,m,'river',0,0,s[4]);
  }
  /* lagos y embalses: la costa como camino, y cruces en línea recta desde donde llegan los ríos */
  const L=[],riverNodes=lat.length;
  for(const lk of lakes){
    if(!lk.pts||lk.pts.length<3)continue;
    const R=lk.pts,ring=R.map(p=>nodeFor(p)),nm=lk.name||'';
    for(let i=0;i<ring.length;i++)edge(ring[i],ring[(i+1)%ring.length],'shore',0,0,nm);
    let a=90,b=-90,c=180,d=-180;for(const p of R){if(p[0]<a)a=p[0];if(p[0]>b)b=p[0];if(p[1]<c)c=p[1];if(p[1]>d)d=p[1];}
    const m=PORTAL/111195,km=m/Math.cos(a*Math.PI/180),bb=[a-m,c-km,b+m,d+km];
    const access=[];
    for(let n=0;n<riverNodes;n++){
      if(lat[n]<bb[0]||lat[n]>bb[2]||lon[n]<bb[1]||lon[n]>bb[3])continue;
      const p=[lat[n],lon[n]];
      if(pip(p[0],p[1],R)){
        access.push(n);
        /* un río que termina adentro del lago: además de los cruces, se une a la costa más cercana */
        let rn=-1,rd=Infinity;for(const r of ring){const dd=hav(p,[lat[r],lon[r]]);if(dd<rd){rd=dd;rn=r;}}
        if(rn>=0&&rn!==n)edge(n,rn,'lake',0,0,nm);
        continue;
      }
      /* la boca del río: el punto de la costa más cercano (sobre el borde, no solo en los vértices) */
      let best=null;
      for(let i=0;i<R.length;i++){const pr=projSeg(R[i],R[(i+1)%R.length],p);if(!best||pr.d<best.d)best={i,d:pr.d,pt:pr.pt,t:pr.t};}
      if(!best||best.d>PORTAL)continue;
      let q;
      if(best.t<0.02)q=ring[best.i];else if(best.t>0.98)q=ring[(best.i+1)%R.length];
      else{q=near(best.pt,1);if(q<0){q=mk(best.pt);edge(ring[best.i],q,'shore',0,0,nm);edge(q,ring[(best.i+1)%R.length],'shore',0,0,nm);}}
      if(q!==n)edge(n,q,'lake',0,0,nm);
      access.push(q);
    }
    /* cruces: de cada boca a las demás y a la costa que se ve en línea recta (sin pasar por tierra) */
    const step=Math.max(1,Math.ceil(ring.length/200)),vis=[];for(let i=0;i<ring.length;i+=step)vis.push(ring[i]);
    const uniq=[...new Set(access)];
    for(let i=0;i<uniq.length;i++){
      const p=[lat[uniq[i]],lon[uniq[i]]];
      for(let j=i+1;j<uniq.length;j++){const q=[lat[uniq[j]],lon[uniq[j]]];if(segInside(p,q,R))edge(uniq[i],uniq[j],'lake',0,0,nm,true);}
      for(const v of vis){if(v===uniq[i]||adj[uniq[i]].some(e=>e.to===v))continue;const q=[lat[v],lon[v]];if(hav(p,q)>1&&segInside(p,q,R))edge(uniq[i],v,'lake',0,0,nm,true);}
    }
    L.push({pts:R,ring,vis,bb,name:nm,portals:uniq});
  }
  return {lat,lon,adj,lakes:L,nodes:lat.length};
}
/* ¿el segmento p–q va por dentro del polígono? (se miran 12 puntos intermedios) */
function segInside(p,q,poly){
  for(let k=1;k<12;k++){const t=k/12;if(!pip(p[0]+(q[0]-p[0])*t,p[1]+(q[1]-p[1])*t,poly))return false;}
  return true;
}
/* Ruta en kayak entre dos puntos. o.vPaddle y o.vWalk en m/s; o.maxSnap: hasta cuánto se camina con el kayak hasta el agua */
function findWaterRoute(WG,from,to,o){
  o=o||{};
  const vP=o.vPaddle||1.94,vW=o.vWalk||1.0,maxSnap=o.maxSnap||8000,N=WG.lat.length,lat=WG.lat,lon=WG.lon;
  if(!N)return {err:'sinagua'};
  const F=[from.lat,from.lon],T=[to.lat,to.lon],S=N,TT=N+1;
  const vx=n=>n===S?SP:n===TT?TP:[lat[n],lon[n]];
  /* tramo de río o costa más cercano (no solo un vértice: un río recto puede tener pocos puntos) */
  const segNear=P=>{
    let best=null;
    for(let u=0;u<N;u++)for(const e of WG.adj[u]){
      if(e.to<u)continue;
      const la=lat[u],lb=lat[e.to],m=maxSnap/111195;
      if(Math.max(la,lb)<P[0]-m||Math.min(la,lb)>P[0]+m)continue;
      const pr=projSeg([la,lon[u]],[lb,lon[e.to]],P);
      if(pr.d<=maxSnap&&(!best||pr.d<best.d))best={u,v:e.to,e,t:pr.t,d:pr.d,pt:pr.pt};
    }
    return best;
  };
  const inLake=P=>WG.lakes.find(lk=>pip(P[0],P[1],lk.pts));
  const xadj=new Map(),addX=(u,e)=>{let l=xadj.get(u);if(!l){l=[];xadj.set(u,l);}l.push(e);};
  let SP,TP,walkS=0,walkT=0;
  /* origen */
  const ls=inLake(F);
  const nearLake=(lk,P)=>lk.vis.concat(lk.portals).map(n=>({n,d:hav(P,[lat[n],lon[n]])})).sort((a,b)=>a.d-b.d).slice(0,3).map(x=>x.n);
  if(ls){SP=F;for(const n of (o.noCross?nearLake(ls,F):ls.portals.concat(ls.vis))){const q=[lat[n],lon[n]];if(o.noCross||segInside(F,q,ls.pts))addX(S,{to:n,len:hav(F,q),kind:'lake',flow:0,cur:0,name:ls.name,cross:!o.noCross?true:false});}}

    const sn=segNear(F);if(!sn)return {err:'origen'};
    SP=sn.pt;walkS=sn.d;const L=sn.e.len;
    addX(S,{to:sn.u,len:sn.t*L,kind:sn.e.kind,flow:-sn.e.flow,cur:sn.e.cur,name:sn.e.name});
    addX(S,{to:sn.v,len:(1-sn.t)*L,kind:sn.e.kind,flow:sn.e.flow,cur:sn.e.cur,name:sn.e.name});
    xadj.set('segS',sn);
  }

  const lt=inLake(T);let tnear=null;
  if(lt){TP=T;for(const n of (o.noCross?nearLake(lt,T):lt.portals.concat(lt.vis))){const q=[lat[n],lon[n]];if(o.noCross||segInside(T,q,lt.pts))addX(n,{to:TT,len:hav(T,q),kind:'lake',flow:0,cur:0,name:lt.name,cross:false});}tnear=lt.portals.length+lt.vis.length?1:null;}
  if(!tnear){
    const tn=segNear(T);if(!tn)return {err:'destino'};
    TP=tn.pt;walkT=tn.d;const L=tn.e.len;
    addX(tn.u,{to:TT,len:tn.t*L,kind:tn.e.kind,flow:tn.e.flow,cur:tn.e.cur,name:tn.e.name});
    addX(tn.v,{to:TT,len:(1-tn.t)*L,kind:tn.e.kind,flow:-tn.e.flow,cur:tn.e.cur,name:tn.e.name});
    const sn=xadj.get('segS');
    if(sn&&((sn.u===tn.u&&sn.v===tn.v)||(sn.u===tn.v&&sn.v===tn.u))){       /* origen y destino sobre el mismo tramo */
      const tS=sn.t,tT=sn.u===tn.u?tn.t:1-tn.t,fl=tT>tS?sn.e.flow:-sn.e.flow;

  const coords=[F],legs=[];

  for(let i=1;i<chain.length;i++){const e=pe[chain[i]];legs.push({kind:e.kind,len:e.len,name:e.name,flow:e.flow,cur:e.cur});coords.push(vx(chain[i]));}
  if(walkT>0){legs.push({kind:'portage',len:walkT,name:'',flow:0});}
  coords.push(T);
  const clean=coords.filter((p,i)=>i===0||hav(coords[i-1],p)>0.5);
  const sum=k=>legs.filter(l=>k(l)).reduce((a,l)=>a+l.len,0);
  const hard=legs.filter(l=>l.kind==='river'&&l.flow<0&&(l.cur||0)>0&&(vP-l.cur)<vP*0.5).reduce((a,l)=>a+l.len,0);
  const r={mode:o.mode||'kayak',hard,time,dist:sum(()=>true),water:sum(l=>l.kind!=='portage'),portage:sum(l=>l.kind==='portage'),
    down:sum(l=>l.kind==='river'&&l.flow>0&&l.cur>0),up:sum(l=>l.kind==='river'&&l.flow<0&&l.cur>0),lake:sum(l=>l.kind==='lake'||l.kind==='shore'),coords:clean,legs};
  /* pasos: el cambio de río o lago y los tramos a pie */
  const steps=[];let acc=0,cur=null;
  legs.forEach((l,i)=>{
    if(l.kind==='portage'&&l.len<30){acc+=l.len;return;}
    const key=l.kind==='portage'?'portage':(l.name||(l.kind==='river'?'río':'lago'))+(l.kind==='river'?'R':'L');
    if(key!==cur){
      const txt=l.kind==='portage'?(i===0?'Llevá el kayak hasta el agua':'Sacá el kayak y caminá'):l.kind==='river'?`Seguí por el ${l.name||'río'}`:`Cruzá ${l.name?'el '+l.name:'el lago'}`;
      steps.push({text:txt,dist:0,at:acc,ico:l.kind==='portage'?'🚶':'🛶',kind:steps.length?'turn':'start'});cur=key;
    }
    acc+=l.len;
  });
  if(!steps.length)steps.push({text:'Remá hasta el destino',dist:0,at:0,ico:'🛶',kind:'start'});
  steps.push({text:'Llegaste a tu destino',dist:0,at:acc,ico:'🏁',kind:'end'});
  for(let i=0;i<steps.length-1;i++)steps[i].dist=steps[i+1].at-steps[i].at;
  return Object.assign(r,{pref:'fast',avgKmh:null,avgStops:0,eids:[],elen:[],stairs:0,steps,hasZ:false,ferry:null,fixed:true,back:false,offFrom:0,offTo:0});
}
/* Respuesta de Overpass con ríos y lagos → {rivers, lakes} (los ríos de OpenStreetMap están dibujados aguas abajo) */
function osmWater(j,cur){
  const rivers=[],lakes=[],toP=g=>(g||[]).filter(q=>q&&q.lat!=null).map(q=>[q.lat,q.lon]);
  for(const el of j.elements||[]){
    const t=el.tags||{};
    if(el.type==='way'&&t.waterway&&el.geometry){
      const pts=toP(el.geometry);if(pts.length>1)rivers.push({pts,name:t.name||'',flow:1,cur:t.waterway==='river'?cur:t.waterway==='canal'?0:cur*0.6,ww:t.waterway});
    }else if(el.type==='way'&&(t.natural==='water'||t.landuse==='reservoir')&&el.geometry){
      const pts=toP(el.geometry);if(pts.length>3&&hav(pts[0],pts[pts.length-1])<1)lakes.push({pts:pts.slice(0,-1),name:t.name||''});
    }else if(el.type==='relation'&&(t.natural==='water'||t.landuse==='reservoir')&&el.members){
      const outers=el.members.filter(m=>m.type==='way'&&(m.role==='outer'||!m.role)&&m.geometry).map(m=>toP(m.geometry)).filter(p=>p.length>1);
      if(!outers.length)continue;
      const ch=chainLines(outers,50);
      if(ch.pts.length>3&&ch.closeGap<200)lakes.push({pts:ch.pts,name:t.name||''});
    }
  }
  return {rivers,lakes};
}

const DB=(()=>{

  });
  const st=(n,m)=>db.transaction(n,m).objectStore(n);
  const w=rq=>new Promise((res,rej)=>{rq.onsuccess=()=>res(rq.result);rq.onerror=()=>rej(rq.error);});
  const cur=(n,prefix,fn)=>new Promise((res,rej)=>{
    const out=[];const range=prefix?IDBKeyRange.bound(prefix,prefix+'\uffff'):null;
    const rq=st(n,'readonly').openCursor(range);
    rq.onsuccess=()=>{const c=rq.result;if(c){out.push(fn(c));c.continue();}else res(out);};
    rq.onerror=()=>rej(rq.error);
  });
  return {
    open,
    get:(n,k)=>w(st(n,'readonly').get(k)),
    put:(n,k,v)=>w(st(n,'readwrite').put(v,k)),
    del:(n,k)=>w(st(n,'readwrite').delete(k)),
    has:(n,k)=>w(st(n,'readonly').count(k)).then(c=>c>0),
    count:n=>w(st(n,'readonly').count()),
    clear:n=>w(st(n,'readwrite').clear()),
    all:(n,prefix)=>cur(n,prefix,c=>c.value),
    entries:(n)=>cur(n,null,c=>({k:c.key,v:c.value})),
    countp:(n,prefix)=>w(st(n,'readonly').count(IDBKeyRange.bound(prefix,prefix+'\uffff'))),
    keys:(n,prefix)=>new Promise((res,rej)=>{
      const out=[],rq=st(n,'readonly').openKeyCursor(prefix?IDBKeyRange.bound(prefix,prefix+'\uffff'):null);
      rq.onsuccess=()=>{const c=rq.result;if(c){out.push(c.key);c.continue();}else res(out);};
      rq.onerror=()=>rej(rq.error);
    }),
    delMany:(n,keys)=>new Promise((res,rej)=>{
      if(!keys.length){res();return;}
      const t=db.transaction(n,'readwrite'),s=t.objectStore(n);
      keys.forEach(k=>s.delete(k));t.oncomplete=()=>res();t.onerror=()=>rej(t.error);
    })
  };
})();

let DL=null;
async function getTileBlob(url){
  try{const r=await fetch(url);if(!r.ok)throw new Error('http '+r.status);return await r.blob();}
  catch(e){
    if(!isNative())throw e;
    const r=await plugin('CapacitorHttp').get({url,responseType:'blob'});
    const bin=atob(r.data),u=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
    return new Blob([u],{type:'image/jpeg'});
  }
}
async function runDownload(k,ranges){
  const l=LAYERS[k];
  const tiles=[];
  for(const t of ranges)for(let x=t.x0;x<=t.x1;x++)for(let y=t.y0;y<=t.y1;y++)tiles.push([t.z,x,y]);
  DL={cancel:false,done:0,fail:0,total:tiles.length};
  let i=0;
  const upd=()=>{
    const bar=$('#dlbar'),tx=$('#dlt');if(!bar)return;
    bar.style.width=(DL.done/DL.total*100)+'%';
    tx.textContent=`${DL.done} de ${DL.total} teselas`+(DL.fail?` · ${DL.fail} fallaron`:'');
  };
  const worker=async()=>{
    while(!DL.cancel){
      const j=i++;if(j>=tiles.length)break;
      const [z,x,y]=tiles[j],key=`${k}/${z}/${x}/${y}`;
      try{
        if(!(await DB.has('tiles',key))){
          const b=await getTileBlob(tileUrl(l,z,x,y));
          if(b.size<80)throw new Error('vacía');
          let vacia=false;
          if(z>=15&&b.size<26000){try{vacia=isPlaceholder(await createImageBitmap(b),b.size);}catch(er){}}
          if(!vacia)await DB.put('tiles',key,b);
        }
      }catch(e){DL.fail++;}
      DL.done++;if(DL.done%5===0||DL.done===DL.total)upd();
    }
  };
  await Promise.all(Array.from({length:6},worker));
  upd();
  const res=DL;DL=null;
  return res;
}
function dlPlan(){
  const l=LAYERS[S.layer];
  const bb=map.getBounds();
  const b={w:bb.getWest(),e:bb.getEast(),n:bb.getNorth(),s:bb.getSouth()};
  const zmax=Math.min(18,l.maxNative||18);
  const z0=Math.min(zmax,Math.max(8,Math.round(map.getZoom())));
  const z1=Math.min(zmax,z0+S.dlZoom);
  const ranges=tileRanges(b,z0,z1);
  const n=tileCount(ranges);
  return {l,b,ranges,z0,z1,n,mb:n*(l.kb||20)/1024};
}

function makeTimer(circ){
  const ent={circ,gt:null};
  /* mejor marca de referencia: anteriores + esta salida, con el mismo formato */
  ent.ref=skipLast=>{
    let b=bestBy(RUNS,circ.id,REC.act,null);
    const ls=skipLast?ent.gt.laps.slice(0,-1):ent.gt.laps;
    for(const l of ls)if(!b||l.time<b.time)b={time:l.time,splits:l.splits,t0:l.start,tid:REC.id};
    return b;
  };
  ent.gt=new GateTimer(circ,{
    onStart:()=>{cue(circ.name+', largada',null,'gate');REC.last={txt:circ.name+' · largada',d:null};setGhost(ent);},
    onGate:(gi,rel,idx)=>{
      const r=ent.ref(false),d=r&&r.splits[idx-1]!=null?rel-r.splits[idx-1]:null;
      const marks=ent.gt.cur.marks,sec=rel-(idx>1?marks[idx-2]-ent.gt.cur.start:0);
      const sb=sectorBests(RUNS,circ.id,REC.act,null);
      for(const l of ent.gt.laps)lapSectors(l).forEach((s,i)=>{if(sb[i]==null||s<sb[i])sb[i]=s;});
      const gold=sb[idx-1]!=null&&sec<sb[idx-1];
      REC.last={txt:`Puerta ${gi} ${fmtT(rel,true)}${gold?' ⚡':''}`,d};
      cue(`Puerta ${gi}${gold?', sector récord':''}`,d,'gate');
    },
    onLap:lap=>{
      const r=ent.ref(true),d=r?lap.time-r.time:null,pb=!!r&&lap.time<r.time;
      lap.pb=pb;
      const nm=circ.type==='p2p'?'':`Vuelta ${lap.n}, `;
      REC.last={txt:`${circ.type==='p2p'?'Tramo':'Vuelta '+lap.n} ${fmtT(lap.time,true)}${pb?' 🏆':''}`,d};
      if(pb){toast(`🏆 ¡Nuevo récord en ${circ.name}!`,5000);cue(`¡Nuevo récord! ${nm}${spoken(lap.time)}`,d,'lap');}
      else cue(`${nm}${spoken(lap.time)}`,d,'lap');
      if(circ.type!=='p2p')setGhost(ent);else clearGhost();
    }
  });
  return ent;
}

function ingest(f){
  if(f.acc>S.maxAcc)return;
  const p=[f.lat,f.lon,f.t,Math.round(f.acc),f.alt==null?null:Math.round(f.alt),REC.seg];
  const last=REC.pts[REC.pts.length-1];
  if(last&&last[5]===REC.seg){
    const d=hav(last,p),dt=(p[2]-last[2])/1000;
    if(dt<=0)return;
    if(d/dt>45)return;
    if(d<S.minDist&&dt<10){REC.speed=f.speed!=null?f.speed:0;return;}
    REC.dist+=d;
    REC.speed=f.speed!=null?f.speed:d/dt;
    for(const t of REC.timers)t.gt.feed(last,p);
  }
  REC.pts.push(p);
  REC.poly.addLatLng([p[0],p[1]]);
}

async function shareFile(name,text,mime){

function pickFile(){

function parseGPX(txt){
  const d=new DOMParser().parseFromString(txt,'application/xml');
  if(d.querySelector('parsererror'))throw new Error('El archivo no es un GPX válido');
  const tx=(el,tag)=>{const n=el.getElementsByTagName(tag)[0];return n?n.textContent:null;};
  const wpts=[],tracks=[];
  for(const w of d.getElementsByTagName('wpt'))
    wpts.push({id:uid(),lat:+w.getAttribute('lat'),lon:+w.getAttribute('lon'),name:tx(w,'name')||'Punto',type:WT[tx(w,'type')]?tx(w,'type'):'punto',t:Date.parse(tx(w,'time'))||Date.now()});
  for(const trk of d.getElementsByTagName('trk')){
    const pts=[];let seg=0;
    for(const s of trk.getElementsByTagName('trkseg')){
      for(const p of s.getElementsByTagName('trkpt')){
        const lat=+p.getAttribute('lat'),lon=+p.getAttribute('lon');if(isNaN(lat)||isNaN(lon))continue;
        const ele=tx(p,'ele'),tm=tx(p,'time');
        pts.push([lat,lon,tm?Date.parse(tm)||0:0,0,ele!=null&&ele!==''?Math.round(+ele):null,seg]);
      }
      seg++;
    }
    if(pts.length>1)tracks.push({name:tx(trk,'name')||'Track importado',pts});
  }
  for(const rte of d.getElementsByTagName('rte')){
    const pts=[];
    for(const p of rte.getElementsByTagName('rtept')){
      const lat=+p.getAttribute('lat'),lon=+p.getAttribute('lon');if(isNaN(lat)||isNaN(lon))continue;
      const ele=tx(p,'ele');pts.push([lat,lon,0,0,ele!=null&&ele!==''?Math.round(+ele):null,0]);
    }
    if(pts.length>1)tracks.push({name:tx(rte,'name')||'Ruta importada',pts});
  }
  return {tracks,wpts};
}
async function importFile(){
  const f=await pickFile();if(!f)return;
  try{
    if(f.text.trimStart().startsWith('{')){
      const j=JSON.parse(f.text);if(!j.kv)throw new Error('Backup no reconocido');
      await restoreBackup(j);
      (await DB.all('kv','wpt:')).forEach(addWptMarker);refreshGates();
      const falta=(j.nets&&j.nets.length)||(await DB.all('kv','dlz:')).length;
      toast(`Copia importada (${j.kv.length} elementos)`+(falta?'. Falta volver a bajar los mapas':''),6000);
      if(falta)showMapMgr();else showTracks();return;
    }
    const g=parseGPX(f.text);
    for(const t of g.tracks){
      const id=uid();
      await DB.put('kv','track:'+id,{id,name:t.name,t0:t.pts[0][2],t1:t.pts[t.pts.length-1][2],pts:t.pts,stats:calcStats(t.pts),circuitId:null,laps:[],src:'gpx'});
    }
    for(const w of g.wpts){await DB.put('kv','wpt:'+w.id,w);addWptMarker(w);}
    toast(`Importado: ${g.tracks.length} tracks, ${g.wpts.length} puntos`);showTracks();
  }catch(e){toast('No se pudo importar: '+e.message,5000);}
}

function barChart(vals,labels,bestIdx){
  const W=320,H=110,mx=Math.max(...vals),mn=Math.min(...vals),lo=mn*.9,bw=(W-8)/vals.length;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Tiempos">`+vals.map((v,i)=>{
    const bh=Math.max(6,(v-lo)/((mx-lo)||1)*(H-26)),x=4+i*bw+bw*.12,w=bw*.76,y=H-18-bh;
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${bh.toFixed(1)}" rx="2" fill="${i===bestIdx?'#2E7D5B':'#0E2A36'}"/><text x="${(x+w/2).toFixed(1)}" y="${H-5}" font-size="10" text-anchor="middle" fill="#566B74">${esc(labels[i])}</text>`;
  }).join('')+`</svg>`;
}
function lapBlock(r){
  const laps=r.laps,secs=laps.map(lapSectors),nS=secs[0].length;
  const bl=bestOf(laps).time,bs=[];
  for(let i=0;i<nS;i++)bs.push(Math.min(...secs.map(s=>s[i])));
  const theo=bs.reduce((a,b)=>a+b,0);
  let h=`<h3>${esc(r.name||'Circuito')}</h3><div class="tblw"><table class="tbl"><tr><th>#</th><th>Tiempo</th>${bs.map((_,i)=>`<th>S${i+1}</th>`).join('')}</tr>`;
  laps.forEach((l,i)=>{
    h+=`<tr><td>${l.pb?'🏆 ':''}${l.n}</td><td class="${l.time===bl?'bl':''}">${fmtT(l.time,true)}</td>${secs[i].map((s,j)=>`<td class="${s===bs[j]?'bs':''}">${fmtT(s,true)}${l.gold&&l.gold[j]?' ⚡':''}</td>`).join('')}</tr>`;
  });
  h+=`</table></div>`;
  const pb=laps.find(l=>l.pb);
  if(pb)h+=`<p><b>🏆 ¡Récord!</b> ${fmtT(pb.time,true)}${pb.delta!=null?' ('+fmtDelta(pb.delta)+' contra tu marca anterior)':''}</p>`;
  if(laps.length>1)h+=`<p class="mut">Verde: mejor vuelta · Violeta: mejor sector de esta salida · ⚡ mejor sector de siempre · Vuelta teórica: <b>${fmtT(theo,true)}</b></p>`+barChart(laps.map(l=>l.time),laps.map(l=>l.n),laps.findIndex(l=>l.time===bl));
  return h;
}
const fmtDelta=ms=>(ms<0?'−':'+')+(Math.abs(ms)/1000).toFixed(1)+' s';

async function showAnalPick(id){
  const cs=(await DB.all('kv','circuit:')).filter(c=>c.gates.length);
  const tr=await DB.get('kv','track:'+id);
  const hasT=tr.pts[0][2]>0;
  openSheet('Medir con un circuito',
    !hasT?'<p>Este track no tiene horas registradas, no se pueden medir tiempos.</p>':
    cs.length?`<p class="mut">Elegí el circuito para buscar tus pasadas en este track.</p>${cs.map(c=>`<button class="btn" data-act="go" data-c="${c.id}">${esc(c.name)}</button>`).join('')}`:
    '<p>Todavía no hay circuitos con puertas. Creá uno en Recorridos.</p>',
    async(a,d)=>{
      if(a==='go'){
        const c=await DB.get('kv','circuit:'+d.c),laps=analyze(tr.pts,c);
        tr.res=resOf(tr).filter(r=>r.cid!==c.id);
        if(laps.length)tr.res.push({cid:c.id,name:c.name,type:c.type,laps});
        tr.act=tr.act||'bike';
        await commitRuns(tr);await DB.put('kv','track:'+id,tr);
        toast(laps.length?`${laps.length} pasada${laps.length>1?'s':''} detectada${laps.length>1?'s':''}`:'No se detectaron pasadas');showTrackDetail(id);

/* ---------- Usar un recorrido como sendero de la red (las rutas pueden pasar por él) ---------- */
async function showTrackToPath(id){
  const tr=await DB.get('kv','track:'+id);if(!tr){showTracks();return;}
  await toPathForm(tr,{kind:'sendero',name:tr.name,tol:5});
}
function toPathPts(tr,tol){
  const ll=tr.pts.map(p=>[p[0],p[1]]);
  let sp=simplifyDP(ll,tol);
  if(sp.length>2500)sp=simplifyDP(ll,tol*3);
  return sp;
}
async function toPathForm(tr,st){
  const sp=toPathPts(tr,st.tol),len=polyLen(sp,false);
  const KINDS=['sendero','camino','calle','ciclovia','peatonal'];
  openSheet('Usar como sendero en la red',`
    <p class="mut">Convierte este recorrido en un camino de tu red: el calculador de rutas va a poder pasar por él. Los extremos se pegan solos a las calles que estén cerca.</p>
    <label>Tipo de camino</label>
    <div class="chips">${KINDS.map(k=>`<button data-act="tpk" data-k="${k}" class="${k===st.kind?'on':''}">${KIND_UI[k][0]} ${KIND_UI[k][1].split(' ')[0]}</button>`).join('')}</div>
    <label for="tpn">Nombre</label><input class="in" id="tpn" value="${esc(st.name)}">
    <p class="mut">${tr.pts.length} puntos del recorrido → ${sp.length} en la red · ${fmtD(len)}. Las pausas se ignoran: el camino queda continuo.</p>
    <div class="row" style="margin-top:10px"><button class="btn primary" data-act="ok">Agregar a la red</button><button class="btn" data-act="back">Volver</button></div>`,
    async(a,d)=>{
      if(a==='tpk'){st.kind=d.k;toPathForm(tr,st);}
      else if(a==='back')showTrackDetail(tr.id);
      else if(a==='ok')await toPathSave(tr,st,sp);
    },
    t=>{if(t.id==='tpn')st.name=t.value.trim();});
}
async function toPathSave(tr,st,sp){
  const e={type:'path',id:uid(),kind:st.kind,name:st.name||tr.name,oneway:0,pts:sp.map(p=>[+p[0].toFixed(7),+p[1].toFixed(7)]),props:{note:'Desde el recorrido '+tr.name},created:Date.now()};
  await DB.put('kv','edit:'+e.id,e);
  dropGraph();vecInvalidate();await drawEdits();
  let msg='Agregado a la red';
  try{
    const g=await ensureGraph(),w=g&&g.W.find(x=>x.id==='u:'+e.id);
    if(!g)msg='Agregado. Cuando bajes las calles de la zona, las rutas van a poder usarlo.';
    else if(w){
      const a=g.adj[w.nodes[0]].length>1,b=g.adj[w.nodes[w.nodes.length-1]].length>1;
      msg=a&&b?'Agregado y conectado en los dos extremos ✔':(a||b)?'Agregado, pero un extremo no quedó pegado a ninguna calle':'Agregado, pero no quedó pegado a ninguna calle: las rutas lo usan si empezás o terminás sobre él';
    }
  }catch(er){}
  closeSheet();
  map.fitBounds(L.latLngBounds(e.pts),{padding:[50,50]});
  toast(msg,6500);
}

const gateLayer=L.layerGroup().addTo(map);
let editingCirc=null,draw=null;
async function refreshGates(){
  gateLayer.clearLayers();
  const ids=new Set();
  if(editingCirc)ids.add(editingCirc);
  if(draw&&draw.circId)ids.add(draw.circId);
  REC.timers.forEach(t=>ids.add(t.circ.id));
  for(const id of ids){
    const c=await DB.get('kv','circuit:'+id);if(!c)continue;
    const roles=gateRoles(c);
    c.gates.forEach((g0,i)=>{
      const g=upgradeGate(g0,roles[i]),r=roles[i];
      L.polyline([g.a,g.b],{color:'#fff',weight:10,opacity:.85,interactive:false}).addTo(gateLayer);
      L.polyline([g.a,g.b],{color:ROLE_COL[r],weight:6,opacity:.95,interactive:false}).addTo(gateLayer);
      L.marker(g.c,{interactive:false,icon:L.divIcon({html:gateIconHtml(r,r==='split'?String(i):ROLE_ICON[r],g.brg,g.dirOnly),className:'',iconSize:[60,60],iconAnchor:[30,30]})}).addTo(gateLayer);
    });
  }
}

async function showCircuitDetail(id,act){
  const c=await DB.get('kv','circuit:'+id);if(!c){showCircuits();return;}
  editingCirc=id;refreshGates();
  const mine=RUNS.filter(r=>r.cid===id),acts=[...new Set(mine.map(r=>r.act))];
  act=act&&acts.includes(act)?act:(acts.includes(S.act)?S.act:acts[0]);
  let h=`<p class="mut">${c.type==='p2p'?'Punto a punto':'Cerrado'} · ${c.gates.length} puertas</p>`;
  if(!acts.length)h+='<p>Todavía no hay marcas. Grabá una salida pasando por las puertas y van a aparecer acá.</p>';
  else{
    const rs=mine.filter(r=>r.act===act).sort((a,b)=>a.time-b.time),best=rs[0];
    const recent=mine.filter(r=>r.act===act).sort((a,b)=>b.t0-a.t0),last5=recent.slice(0,5);
    const avg=last5.reduce((a,r)=>a+r.time,0)/last5.length,sb=sectorBests(RUNS,id,act,null);
    if(acts.length>1)h+=`<div class="chips">${acts.map(a=>`<button data-act="actf" data-k="${a}" class="${a===act?'on':''}">${ACT[a][0]} ${ACT[a][1]}</button>`).join('')}</div>`;
    h+=`<div class="stats"><div><b>${fmtT(best.time,true)}</b><small>🏆 récord</small></div><div><b>${rs.length}</b><small>marcas</small></div><div><b>${fmtT(avg)}</b><small>promedio últimas ${last5.length}</small></div></div>
    <p>Última marca: <b>${fmtT(recent[0].time,true)}</b> (${recent[0].time===best.time?'es tu récord':fmtDelta(recent[0].time-best.time)+' del récord'})</p>
    <h3>Tus mejores tiempos</h3>${rs.slice(0,5).map((r,i)=>`<div class="item" data-act="tr" data-id="${r.tid}"><div><b>${medal(i)} ${fmtT(r.time,true)}</b><br><small class="mut">${fmtDate(r.t0)}${i?' · '+fmtDelta(r.time-best.time):''}</small></div><span>›</span></div>`).join('')}
    ${sb.length>1?`<h3>Mejores sectores</h3><p>${sb.map((s,i)=>`S${i+1} <b>${fmtT(s,true)}</b>`).join(' · ')}<br><span class="mut">Vuelta teórica: <b>${fmtT(sb.reduce((a,b)=>a+b,0),true)}</b></span></p>`:''}`;
    const ev=recent.slice(0,15).reverse();
    if(ev.length>1)h+=`<h3>Evolución</h3>`+barChart(ev.map(r=>r.time),ev.map((_,i)=>i+1),ev.findIndex(r=>r.time===best.time));
  }
  h+=`<div class="row" style="margin-top:10px"><button class="btn" data-act="edit">Editar puertas</button><button class="btn sm ${c.watch!==false?'primary':''}" data-act="watch">${c.watch!==false?'Vigilando ✓':'Sin vigilar'}</button><button class="btn" data-act="back">Volver</button></div>
    ${mine.length?'<button class="btn danger sm" data-act="reset">Reiniciar récords de este circuito</button>':''}`;
  openSheet('Circuito',h,async(a,d,el)=>{
    if(a==='actf')showCircuitDetail(id,d.k);
    else if(a==='tr')showTrackDetail(d.id);
    else if(a==='edit')showCircuitEdit(id);
    else if(a==='watch'){c.watch=c.watch===false;await DB.put('kv','circuit:'+id,c);showCircuitDetail(id,act);}
    else if(a==='back')showCircuits();
    else if(a==='reset'&&armed(el)){
      for(const r of mine)await DB.del('kv','run:'+r.id);
      RUNS=RUNS.filter(r=>r.cid!==id);toast('Récords reiniciados');showCircuitDetail(id);
    }
  });
}

    <h3>Puertas (${c.gates.length})</h3>

    <p class="mut">Cada puerta se ubica tocando el mapa. Elegís el rol (largada, parcial, llegada o largada/llegada), el ancho, si cuenta en un solo sentido o en los dos, y el giro de 0 a 359°. Las puertas se recorren en el orden de esta lista.</p>
    <label class="chk"><input type="checkbox" id="cw" ${c.watch!==false?'checked':''}> Vigilar en cada grabación</label>
    <div class="row" style="margin-top:12px"><button class="btn primary" data-act="ok">Listo</button><button class="btn danger" data-act="del">Borrar circuito</button></div>`,
    async(a,d,el)=>{
      const save=async()=>{c.type=circType(c);await DB.put('kv','circuit:'+id,c);};
      if(a==='gadd')openGateEditor(id,null);
      else if(a==='gedit')openGateEditor(id,+d.i);
      else if(a==='here'){
        if(!lastFix){toast('Todavía no hay GPS');return;}
        let brg=null;
        if(lastFix.speed>0.7&&lastFix.brg!=null&&!isNaN(lastFix.brg))brg=lastFix.brg;
        else if(fixHist.length>1){const a0=fixHist[0];if(hav([a0.lat,a0.lon],[lastFix.lat,lastFix.lon])>6)brg=bearingTo([a0.lat,a0.lon],[lastFix.lat,lastFix.lon]);}
        openGateEditor(id,null,Object.assign({c:[lastFix.lat,lastFix.lon]},brg!=null?{brg}:{}));
      }
      else if(a==='gup'||a==='gdn'){
        const i=+d.i,j=a==='gup'?i-1:i+1;
        await freezeGates(c);[c.gates[i],c.gates[j]]=[c.gates[j],c.gates[i]];
        await save();await resetRunsOf(id);showCircuitEdit(id);
      }
      else if(a==='ok')showCircuitDetail(id);
      else if(a==='del'&&armed(el)){await DB.del('kv','circuit:'+id);await resetRunsOf(id);editingCirc=null;refreshGates();showCircuits();}
    },
    async t=>{
      if(t.id==='cn'){c.name=t.value.trim()||c.name;await DB.put('kv','circuit:'+id,c);}
      else if(t.id==='cw'){c.watch=t.checked;await DB.put('kv','circuit:'+id,c);}
    });
}
/* Si cambian las puertas, las marcas viejas dejan de ser comparables */
async function resetRunsOf(cid){
  const del=RUNS.filter(r=>r.cid===cid);
  if(!del.length)return;
  for(const r of del)await DB.del('kv','run:'+r.id);
  RUNS=RUNS.filter(r=>r.cid!==cid);
  toast('Cambiaron las puertas: se reiniciaron las marcas de este circuito',4500);
}
function banner(txt,opts){
  const b=$('#banner');
  if(!txt){b.hidden=true;return;}
  $('#bTxt').textContent=txt;b.hidden=false;
  $('#bUndo').hidden=!(opts&&opts.undo);$('#bOk').hidden=!(opts&&opts.ok);
}
function startDraw(id){draw={circId:id,pts:[],mk:[]};closeSheet();banner('Tocá el primer extremo de la puerta');}
function cancelDraw(){if(draw){draw.mk.forEach(m=>m.remove());const id=draw.circId;draw=null;banner(null);showCircuitEdit(id);}}
async function onDrawClick(e){
  const ll=[e.latlng.lat,e.latlng.lng];
  draw.pts.push(ll);
  draw.mk.push(L.circleMarker(ll,{radius:8,color:'#F04A1C',weight:3,fillColor:'#fff',fillOpacity:1,interactive:false}).addTo(map));
  if(draw.pts.length===1){banner('Ahora tocá el otro extremo');return;}
  const id=draw.circId,pts=draw.pts;draw.mk.forEach(m=>m.remove());draw=null;banner(null);
  const c=await DB.get('kv','circuit:'+id);c.gates.push({a:pts[0],b:pts[1]});
  await DB.put('kv','circuit:'+id,c);await resetRunsOf(id);showCircuitEdit(id);
}

/* Descarga de la red desde OpenStreetMap (Overpass) */
const OVERPASS=['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter'];
const KEEP=['highway','name','oneway','junction','access','foot','bicycle','motor_vehicle','motorcar','vehicle','maxspeed','service','oneway:bicycle','cycleway','cycleway:left','cycleway:right','route','duration','ref','surface','motorroad'];
async function fetchNet(bb,regional){
  const bx=`(${bb.s},${bb.w},${bb.n},${bb.e})`;
  /* zona chica: todas las calles, lomos y ferris. Región grande: solo rutas principales y ferris */
  const q=regional
    ?`[out:json][timeout:300][maxsize:1073741824];(way["highway"~"^(motorway|trunk|primary|secondary|tertiary)(_link)?$"]${bx};way["highway"="unclassified"]["ref"]${bx};way["route"="ferry"]${bx};);out geom qt;`
    :`[out:json][timeout:120];(way["highway"]["highway"!~"^(proposed|construction|abandoned|razed|platform|bus_stop|raceway|elevator|rest_area|services|no)$"]${bx};way["route"="ferry"]${bx};node["traffic_calming"]${bx};);out geom qt;`;
  let last;
  for(const url of OVERPASS){
    try{
      const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),regional?320000:130000);
      const r=await fetch(url,{method:'POST',body:new URLSearchParams({data:q}),signal:ctl.signal});
      clearTimeout(to);
      if(!r.ok)throw new Error('HTTP '+r.status);
      const j=await r.json(),ways=[],hz=[];
      for(const el of j.elements||[]){
        if(el.type==='node'){
          const tc=el.tags&&el.tags.traffic_calming;
          if(tc&&['bump','hump','table','cushion'].includes(tc)&&el.lat!=null)hz.push({lat:+el.lat.toFixed(6),lon:+el.lon.toFixed(6),k:'lomo'});
          continue;
        }
        if(el.type!=='way'||!el.geometry||!el.nodes||el.geometry.length!==el.nodes.length||el.geometry.some(g=>!g))continue;
        const t={};for(const k of KEEP)if(el.tags&&el.tags[k]!=null)t[k]=el.tags[k];
        const p=[];for(const g of el.geometry)p.push(+g.lat.toFixed(6),+g.lon.toFixed(6));
        ways.push({id:el.id,t,n:el.nodes,p});
      }
      if(!ways.length)throw new Error('no hay calles en esa zona');
      return {ways,hz};
    }catch(e){last=e;}
  }
  throw last||new Error('sin conexión');
}
const viewKm=()=>{const b=map.getBounds();return [(b.getEast()-b.getWest())*111.32*Math.cos((b.getNorth()+b.getSouth())/2*rad),(b.getNorth()-b.getSouth())*110.54];};
const DEM_Z=13;
async function fetchDem(bb,zz){
  const Z=zz||DEM_Z,list=demTiles(bb,Z),tiles=new Map();
  if(list.length>150)throw new Error('la zona es demasiado grande para bajar la altura');
  let i=0;
  const worker=async()=>{
    while(i<list.length){
      const t=list[i++];
      try{
        const dk=`dem/${Z}/${t.x}/${t.y}`;
        let blob=null;try{blob=await DB.get('tiles',dk);}catch(er){}
        if(!blob){
          blob=await getTileBlob(`https://s3.amazonaws.com/elevation-tiles-prod/terrarium/${Z}/${t.x}/${t.y}.png`);
          try{await DB.put('tiles',dk,blob);}catch(er){}
        }
        const bmp=await createImageBitmap(blob);
        const c=document.createElement('canvas');c.width=c.height=256;
        const ctx=c.getContext('2d',{willReadFrequently:true});ctx.drawImage(bmp,0,0);
        const d=ctx.getImageData(0,0,256,256).data,el=new Float32Array(65536);
        for(let k=0;k<65536;k++)el[k]=d[k*4]*256+d[k*4+1]+d[k*4+2]/256-32768;
        tiles.set(t.x+'/'+t.y,el);
      }catch(e){}
    }
  };
  await Promise.all(Array.from({length:4},worker));
  if(!tiles.size)throw new Error('no se pudo bajar');
  return tiles;
}
async function fetchNetFull(bb,say,regional){

  }
  const {ways,hz}=await fetchNet(bb);

    if(say)say('Descargando la altura del terreno…');

    if((m==='foot'&&D>150000)||(m==='bike'&&D>600000)){RT.res[m]={err:'lejos'};continue;}
    const r=findRoute(g,m,from,RT.to,S.pref);RT.res[m]=r;
    if(!r.err)r.hzs=navInit(r,m,hz).hzs;
  }
  RT.res.kayak=await waterRouteFor('kayak',from,RT.to);
  RT.res.swim=D>60000?{err:'lejos'}:await waterRouteFor('swim',from,RT.to);
  if(stopsList().length)await applyStops(g,from,hz);
  if(D>100000)toast('Ruta calculada',1800);
  RT.calcFrom=from;
  const ok=m=>RT.res[m]&&!RT.res[m].err;
  RT.sel=keep&&RT.sel&&ok(RT.sel)?RT.sel:(ok(S.routeMode)?S.routeMode:RMODES.find(ok)||S.routeMode);
  if(g&&!isWater(RT.sel))computeAlt(g);
  resetCands();
  drawRoute(true);showRoutes();
}
async function findAlts(){
  if(isWater(RT.sel)||stopsList().length){toast('Por el agua o con paradas no se buscan alternativas',3500);return;}
  const g=await ensureGraph({route:{from:RT.calcFrom,to:RT.to}});if(!g||!RT.calcFrom||!RT.to)return;
  const {alts}=findAlternatives(g,RT.sel,RT.calcFrom,RT.to,S.pref,2);
  RT.cands=RT.cands.filter(c=>!/^Alternativa/.test(c.label));
  if(!alts.length){toast('No encontré otro camino razonable entre esos dos puntos',4500);showRoutes();return;}
  const hz=await collectHz(g);
  alts.forEach((a,i)=>{a.hzs=navInit(a,a.mode,hz).hzs;addCand('Alternativa '+(i+1),a,false);});
  drawRoute(false);toast(`${alts.length} alternativa${alts.length>1?'s':''} para comparar`,3000);showRoutes();
}

async function addViaAt(ll){

  const g=await ensureGraph({route:{from:RT.calcFrom,to:RT.to}});if(!g||!RT.calcFrom||!RT.to){showRoutes();return;}
  let label='el punto elegido';
  try{const h=g.nearestEdge(ll.lat,ll.lon,60,x=>g.W[x.w].name);if(h)label=g.W[g.E[h.ei].w].name;}catch(er){}
  const via={lat:ll.lat,lon:ll.lon,label};
  const r=findRouteVia(g,RT.sel,RT.calcFrom,RT.to,S.pref,via);
  if(r.err){toast('No hay camino pasando por ahí: '+errText(r),5000);showRoutes();return;}
  r.hzs=navInit(r,r.mode,await collectHz(g)).hzs;
  const c=addCand('Por '+label,r,true);
  drawRoute(true);toast('Camino agregado para comparar',2500);showRoutes();
}

const dirLabel=(ov,prof)=>{
  if(ov)return {closed:ov.all?'cerrada para todos':'cerrada a vehículos',two:'doble sentido',fwd:'un sentido, con la flecha',rev:'un sentido, contra la flecha'}[ov.dir];
  const ow=prof.car.ok?prof.car.ow:prof.bike.ow;

const editTitle=e=>e.type==='path'?`${KIND_UI[e.kind][0]} ${esc(e.name||KIND_UI[e.kind][1])}`

async function drawEdits(){
  editLayer.clearLayers();
  const edits=await DB.all('kv','edit:');
  setLimColors(edits);
  for(const e of edits)if(e.type==='path'){
    const lc=e.kind==='limite'&&e.name?limColor(e.name):(KCOL[e.kind]||'#B0157A');
    L.polyline(e.pts,{color:lc,weight:e.kind==='limite'?5:4,dashArray:e.kind==='limite'?'12 4 3 4':'6 6',interactive:false}).addTo(editLayer);
    /* franja ancha e invisible: tocar un trazo abre sus propiedades (o lo elige, si se está armando un área) */
    L.polyline(e.pts,{color:'#000',weight:22,opacity:.001}).on('click',ev=>{
      if(PB.on){if(ev&&ev.originalEvent)ev.originalEvent._owned=true;pbToggle(e.id);return;}
      if(TR.on||GE.on||CAP.on||PICK||draw||EV.on||MS.on||REC.state!=='idle'||NAV.on||sheet.classList.contains('open'))return;
      if(ev&&ev.originalEvent)ev.originalEvent._owned=true;
      showEditPath(e.id);
    }).addTo(editLayer);
  }
  for(const e of edits)if(e.type==='area'){
    const cl=areaRestricted(e);
    L.polygon(e.pts,{color:cl?'#D0392B':'#6B7B85',weight:2,dashArray:'6 4',fillColor:AREA_COL[e.kind]||'#E0DCD2',fillOpacity:.3,interactive:false}).addTo(editLayer);
    L.polyline(e.pts.concat([e.pts[0]]),{color:'#000',weight:22,opacity:.001}).on('click',ev=>{
      if(TR.on||GE.on||CAP.on||NP.on||PICK||draw||EV.on||MS.on||REC.state!=='idle'||NAV.on||sheet.classList.contains('open'))return;
      if(ev&&ev.originalEvent)ev.originalEvent._owned=true;
      showEditArea(e.id);
    }).addTo(editLayer);
  }
  for(const e of edits)if(e.type==='turn'||e.type==='barrier')
    L.marker([e.lat,e.lon],{interactive:false,icon:L.divIcon({html:`<div class="nodem">${e.type==='turn'?'🚫':'⛔'}</div>`,className:'',iconSize:[26,26],iconAnchor:[13,13]})}).addTo(editLayer);
  /* los tramos corregidos se dibujan con la geometría guardada; solo los viejos (sin ella) necesitan el grafo, una única vez */
  const old=edits.filter(e=>e.type==='ov'&&!e.geom);
  if(old.length){
    let g=null;try{g=await ensureGraph();}catch(er){}
    if(g)for(const e of old){e.geom=blockGeom(g,`${e.way}:${e.n1}:${e.n2}`);if(e.geom.length)await DB.put('kv','edit:'+e.id,e);}
  }
  for(const e of edits)if(e.type==='ov'&&e.geom){
    const col=e.dir==='closed'?'#F04A1C':'#E0A100';
    for(const q of e.geom)L.polyline([[q[0],q[1]],[q[2],q[3]]],{color:col,weight:6,opacity:.8,interactive:false}).addTo(editLayer);
  }
}

const NAV={on:false,N:null,mode:'foot',dest:null,lastRecalc:0,busy:false,prev:null,endT:null};
async function collectHz(g){
  const hz=((g&&g.hz)||[]).slice();
  for(const w of await DB.all('kv','wpt:'))if(w.type==='lomo'||w.type==='pozo'||w.type==='peligro')hz.push({lat:w.lat,lon:w.lon,k:w.type});
  return hz;
}
function hzSummary(hzs){
  const c={};hzs.forEach(h=>c[h.k]=(c[h.k]||0)+1);
  const nm={lomo:['lomo de burro','lomos de burro'],pozo:['pozo','pozos'],peligro:['punto peligroso','puntos peligrosos']};
  return Object.entries(c).map(([k,n])=>`${n} ${nm[k][n>1?1:0]}`).join(', ');
}
function navSay(t){if(!S.voice)return;beep(880,.12);say(t);}
async function startNav(){
  const r=RT.res&&RT.res[RT.sel];if(!r||r.err)return;
  unlockAudio();
  const g=r.fixed?null:await ensureGraph();
  Object.assign(NAV,{mode:RT.sel,dest:RT.to,lastRecalc:0,busy:false,prev:null});
  NAV.N=navInit(r,NAV.mode,await collectHz(g));
  NAV.on=true;
  closeSheet();drawRoute(false);setFollow(true);
  if(lastFix)map.setView([lastFix.lat,lastFix.lon],Math.max(map.getZoom(),17));
  if(!watch||watch.type!=='bg'){
    try{await startWatch(true,'Guiando la ruta');}
    catch(e){toast('No se pudo iniciar el GPS en segundo plano: '+(e.message||e),5000);}
  }
  keepAwake(true);
  $('#nav').hidden=false;updNavTop();
  const h=NAV.N.hzs.length;
  navSay(r.steps[0].text+'.'+(h?` Hay ${h} aviso${h>1?'s':''} en el camino.`:''));
  const s1=r.steps[1]||r.steps[0];
  updNav({next:{step:s1,dist:s1.at},rem:NAV.N.total});
}
function updNav(res){
  const st=res.next.step,N=NAV.N,left=N.route.time*(res.rem/Math.max(1,N.total));
  $('#nvIco').textContent=st.ico;
  $('#nvTxt').textContent=st.text;
  $('#nvDist').textContent=st.kind==='end'?fmtD(res.rem):'en '+fmtD(res.next.dist);
  $('#nvEta').textContent='Llegás a las '+hhmm(Date.now()+left*1000);
  $('#nvRem').textContent=fmtD(res.rem)+' · '+fmtDur(left);
  $('#nvMute').textContent=S.voice?'🔊':'🔇';
}
function navOnFix(f){
  if(!NAV.on||!NAV.N||f.acc>60)return;
  const sp=f.speed!=null?f.speed:(NAV.prev?hav([NAV.prev.lat,NAV.prev.lon],[f.lat,f.lon])/Math.max(1,(f.t-NAV.prev.t)/1000):0);
  NAV.prev=f;
  const res=navTick(NAV.N,{lat:f.lat,lon:f.lon,speed:sp});
  if(res.off){navRecalc(f);return;}
  if(res.say.length)navSay(res.say.join('. '));
  updNav(res);
  if(res.arrived&&!NAV.endT)NAV.endT=setTimeout(()=>{NAV.endT=null;endNav();},9000);
}
async function navRecalc(f){
  if(NAV.N&&NAV.N.route.fixed){            /* volviendo por la huella: no se recalcula con calles, se te guía de nuevo hacia la línea */
    if(Date.now()-NAV.lastRecalc>20000){NAV.lastRecalc=Date.now();navSay('Te alejaste de la línea. Volvé hacia la línea marcada.');}
    return;
  }
  if(NAV.busy||Date.now()-NAV.lastRecalc<12000)return;
  NAV.busy=true;NAV.lastRecalc=Date.now();
  navSay('Recalculando');
  try{
    const g=await ensureGraph(),r=findRoute(g,NAV.mode,{lat:f.lat,lon:f.lon},NAV.dest,(NAV.N&&NAV.N.route.pref)||'fast');
    if(r.err)navSay('No encuentro un camino desde acá');
    else{
      r.hzs=[];RT.res=RT.res||{};RT.res[NAV.mode]=r;RT.sel=NAV.mode;
      NAV.N=navInit(r,NAV.mode,await collectHz(g));r.hzs=NAV.N.hzs;
      drawRoute(false);navSay(r.steps[0].text);
    }
  }catch(e){}
  NAV.busy=false;
}

map.createPane('ovl').style.zIndex=250;
const OvlLayer=L.Layer.extend({
  initialize(o){this.o=o;},
  onAdd(m){
    const im=this._im=L.DomUtil.create('img','leaflet-image-layer');
    im.alt='';im.src=this.o.url;
    im.style.cssText='position:absolute;left:0;top:0;max-width:none;pointer-events:none;transform-origin:50% 50%;';
    m.getPane('ovl').appendChild(im);
    this._upd();
  },
  onRemove(){L.DomUtil.remove(this._im);},
  getEvents(){return {zoomstart:this._hide,zoom:this._upd,zoomend:this._upd,viewreset:this._upd};},
  _hide(){if(this._im)this._im.style.visibility='hidden';},
  _upd(){
    const m=this._map,o=this.o,im=this._im;if(!m||!im)return;
    const p=m.latLngToLayerPoint([o.lat,o.lon]);
    const mpp=40075016.686*Math.cos(o.lat*Math.PI/180)/(256*Math.pow(2,m.getZoom()));
    const w=o.w/mpp,h=o.h/mpp;
    im.style.width=w+'px';im.style.height=h+'px';im.style.opacity=o.op;
    im.style.transform=`translate3d(${p.x-w/2}px,${p.y-h/2}px,0) rotate(${o.rot}deg)`;
    im.style.visibility='visible';
  }
});
let OVL=[];
const ovlMeta=m=>{const {layer,url,...r}=m;return r;};
const saveOvl=m=>DB.put('kv','ovl:'+m.id,ovlMeta(m));
function ovlShow(m){m.url=m.url||null;if(!m.layer)m.layer=new OvlLayer(m);if(!map.hasLayer(m.layer))m.layer.addTo(map);}
async function loadOvl(){
  const ms=(await DB.all('kv','ovl:')).sort((a,b)=>a.t-b.t);
  OVL=[];
  for(const m of ms){
    const b=await DB.get('tiles','ovl/'+m.id);if(!b)continue;
    m.url=URL.createObjectURL(b);m.layer=new OvlLayer(m);
    if(m.on)m.layer.addTo(map);
    OVL.push(m);
  }
}
function pickImages(){
  return new Promise(res=>{
    const i=document.createElement('input');i.type='file';i.accept='image/jpeg,image/*';i.multiple=true;
    i.onchange=()=>res([...i.files]);i.click();
  });
}
async function resizeImg(file,max){
  const url=URL.createObjectURL(file);
  try{
    const im=await new Promise((ok,ko)=>{const x=new Image();x.onload=()=>ok(x);x.onerror=ko;x.src=url;});
    const aw=im.naturalWidth,ah=im.naturalHeight,k=Math.min(1,max/Math.max(aw,ah));
    const c=document.createElement('canvas');c.width=Math.round(aw*k);c.height=Math.round(ah*k);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',0.86));
    return {blob,aw,ah};
  }finally{URL.revokeObjectURL(url);}
}
async function addPhotos(){
  const files=await pickImages();if(!files.length)return;

    try{
      const meta=parseJpegMeta(await f.arrayBuffer())||{};
      const {blob,aw,ah}=await resizeImg(f,2048);
      const c=map.getCenter(),alt=meta.rel!=null&&meta.rel>5?meta.rel:100,fp=droneFootprint(alt,aw,ah,MAVIC_FOV);
      const m={id:uid(),name:f.name,lat:meta.lat!=null?meta.lat:c.lat,lon:meta.lon!=null?meta.lon:c.lng,w:fp.w,h:fp.h,asp:aw/ah,alt,
        rot:meta.gyaw!=null?meta.gyaw:(meta.fyaw!=null?meta.fyaw:0),op:.75,on:true,t:Date.now()+added.length,gps:meta.lat!=null};
      if(meta.pitch!=null&&Math.abs(meta.pitch+90)>15)tilted++;

  }
  const g=added.filter(m=>m.gps);
  if(g.length)map.fitBounds(L.latLngBounds(g.map(m=>[m.lat,m.lon])),{maxZoom:18,padding:[40,40]});
  const noGps=added.length-g.length;
  toast(`${added.length} foto${added.length===1?'':'s'} cargada${added.length===1?'':'s'}`+(noGps?` · ${noGps} sin ubicación: acomodalas a mano`:'')+(tilted?` · ${tilted} no miran hacia abajo, van a quedar aproximadas`:'')+(bad?` · ${bad} fallaron`:''),6000);
}

    ${OVL.map(m=>`<div class="item"><div style="flex:1" data-act="adj" data-id="${m.id}"><b>${esc(m.name)}</b><br><small class="mut">${m.gps?'ubicada':'sin ubicación, acomodala'} · ${Math.round(m.w)} × ${Math.round(m.h)} m</small></div><button class="btn sm ${m.on?'primary':''}" data-act="tog" data-id="${m.id}">${m.on?'Visible':'Oculta'}</button></div>`).join('')||'<p class="mut">Todavía no cargaste fotos.</p>'}`,

    <div class="row"><button class="btn" data-act="go">Ir a la foto</button><button class="btn" data-act="hide">${m.on?'Ocultar':'Mostrar'}</button><button class="btn danger" data-act="del">Borrar</button></div>
    <button class="btn" data-act="back">Volver</button>`,

/* Índice liviano de las redes de calles descargadas (para no cargar todas las calles cada vez) */
async function netIndex(){
  const keys=(await DB.keys('kv','net:')).map(k=>k.slice(4));
  let idx=await DB.all('kv','netidx:');
  for(const x of idx)if(!keys.includes(x.id)&&!x.pending)await DB.del('kv','netidx:'+x.id);
  idx=idx.filter(x=>keys.includes(x.id)||x.pending);
  for(const id of keys)if(!idx.some(x=>x.id===id&&!x.pending)){
    idx=idx.filter(x=>x.id!==id);
    const n=await DB.get('kv','net:'+id);if(!n)continue;
    const x={id,bb:n.bb,date:n.date,ways:n.ways.length,hz:(n.hz||[]).length,z:n.ways.some(w=>w.z&&w.z.some(v=>v!=null)),regional:!!n.regional};
    await DB.put('kv','netidx:'+id,x);idx.push(x);
  }
  return idx;
}
async function drawCoverage(){
  covLayer.clearLayers();

    L.rectangle([[z.bb.s,z.bb.w],[z.bb.n,z.bb.e]],{color:'#1E6BFF',weight:2,fill:false,dashArray:'6 4',opacity:.75,interactive:false}).addTo(covLayer);
  for(const n of (await netIndex()).filter(x=>!x.pending))

}

/* ---------- Copia de seguridad completa y recuperación ---------- */
const blobB64=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(String(f.result).split(',')[1]);f.readAsDataURL(b);});
async function exportFull(){
  toast('Preparando la copia…',3000);
  const kv=[];
  for(const k of await DB.keys('kv'))if(k!=='rec:current'&&!/^(net|netidx|ctr|wx):/.test(k))kv.push({k,v:await DB.get('kv',k)});
  const photos=[];
  for(const o of OVL){const b=await DB.get('tiles','ovl/'+o.id);if(b)photos.push({id:o.id,b64:await blobB64(b)});}
  const nets=(await netIndex()).filter(n=>!n.pending).map(n=>({id:n.id,bb:n.bb,date:n.date,ways:n.ways,hz:n.hz,z:n.z,regional:n.regional}));
  const d=new Date();
  shareFile(`rumbo-copia-${d.getFullYear()}${pad2(d.getMonth()+1)}${pad2(d.getDate())}.json`,JSON.stringify({v:3,kv,photos,nets}),'application/json');
}
async function restoreBackup(j){
  for(const e of j.kv)await DB.put('kv',e.k,e.v);
  for(const p of (j.photos||[])){
    const bin=atob(p.b64),u=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
    await DB.put('tiles','ovl/'+p.id,new Blob([u],{type:'image/jpeg'}));
  }
  for(const n of (j.nets||[]))await DB.put('kv','netidx:'+n.id,Object.assign({},n,{pending:true}));
  await loadRuns();await loadOvl();drawEdits();drawCoverage();vecInvalidate();
}
async function zoneMissing(z){
  const r=z.ranges&&z.ranges[0];if(!r)return false;
  return !(await DB.has('tiles',`${z.layer}/${r.z}/${Math.floor((r.x0+r.x1)/2)}/${Math.floor((r.y0+r.y1)/2)}`));
}
async function recoverAll(){
  if(!(await netAllowed('recuperar los mapas')))return;
  const zs=await DB.all('kv','dlz:'),idx=await netIndex(),miss=[];
  for(const z of zs)if(await zoneMissing(z))miss.push(z);
  const pend=idx.filter(n=>n.pending),total=miss.length+pend.length;
  let i=0;
  const msg=t=>{const e=$('#rcmsg');if(e)e.textContent=t;},pr=$('#dlprog');
  if(pr)pr.hidden=false;
  for(const z of miss){
    i++;msg(`Mapa ${i} de ${total}: ${LAYERS[z.layer].name}`);
    const r=await runDownload(z.layer,z.ranges);
    if(r.cancel){toast('Cancelado');showMapMgr();return;}
  }
  for(const n of pend){
    i++;msg(`Calles ${i} de ${total}: bajando…`);
    try{
      const f=await fetchNetFull(n.bb,msg,n.regional);
      await DB.put('kv','net:'+n.id,{id:n.id,bb:n.bb,date:Date.now(),ways:f.ways,hz:f.hz,regional:!!n.regional});
      await DB.del('kv','netidx:'+n.id);
    }catch(e){toast('No se pudo bajar una red de calles: '+(e.message||e),5000);}
  }
  netsChanged();await netIndex();drawCoverage();toast('Mapas recuperados ✅',4000);showMapMgr();
}
/* ---------- Elegir la zona a descargar (marco) ---------- */
const frameLayer=L.layerGroup().addTo(map);
const CAP={on:false,lock:null};
/* Centro de la parte visible del mapa: descuenta las tarjetas de abajo (captura y puertas) */
function visPx(){
  const s=map.getSize(),mapTop=$('#map').getBoundingClientRect().top;
  let bot=s.y;
  for(const id of ['#cap','#gate']){const e=$(id);if(e&&!e.hidden)bot=Math.min(bot,e.getBoundingClientRect().top-mapTop);}
  return {x:s.x/2,y:Math.max(80,bot)/2};
}
const visCenter=()=>{const p=visPx();return map.containerPointToLatLng([p.x,p.y]);};
/* Lleva ll al centro de la parte visible */
function viewVisible(ll,z){
  map.setView(ll,z,{animate:false});
  const d=map.getSize().y/2-visPx().y;
  if(Math.abs(d)>2)map.panBy([0,d],{animate:false});
}
function frameBB(){
  if(CAP.lock)return CAP.lock;      /* mientras se descarga, el marco queda fijo aunque la tarjeta cambie de alto */
  const c=CAP.on||GE.on?visCenter():map.getCenter(),h=S.frameKm*500,dl=h/110540,dn=h/(111320*Math.cos(c.lat*rad));
  return {s:c.lat-dl,n:c.lat+dl,w:c.lng-dn,e:c.lng+dn};
}
function dlPlanFrame(){
  const l=LAYERS[S.layer],b=frameBB();
  const zmax=Math.min(18,l.maxNative||18),z1=Math.min(zmax,S.capZ),z0=Math.max(8,z1-S.dlZoom);
  const ranges=tileRanges({w:b.w,e:b.e,n:b.n,s:b.s},z0,z1),n=tileCount(ranges);
  return {l,b,ranges,z0,z1,n,mb:n*(l.kb||20)/1024};
}
function drawFrame(){
  frameLayer.clearLayers();
  if(!CAP.on)return;
  const b=frameBB();
  L.rectangle([[b.s,b.w],[b.n,b.e]],{color:'#F04A1C',weight:3,fill:true,fillColor:'#F04A1C',fillOpacity:.07,dashArray:'10 6',interactive:false}).addTo(frameLayer);
  updCap();
}
function updCap(){

  $('#capZ').value=S.capZ;
  let t='';
  if(l.off){
    const p=dlPlanFrame();
    t=`${l.name}: zoom ${p.z0} a ${p.z1} · ${p.n} teselas · unos ${p.mb<10?p.mb.toFixed(1):Math.round(p.mb)} MB`+(p.n>12000?' — demasiado grande: bajá el zoom o el tamaño':'');
    $('#capMap').disabled=p.n>12000&&!DL;
  }else{t=`${l.name} no se puede bajar. Cambiá a Satélite o Topográfico Esri en Mapas.`;$('#capMap').disabled=true;}
  const [wk,hk]=viewKm();
  $('#capInfo').textContent=t+` · Lo que ves ahora: ${Math.round(wk)} × ${Math.round(hk)} km (para "Regional", hasta 1200).`;
}

function stepFrame(dir){

(function(){

const NP={on:false,pt:null,node:null,items:[],type:'turn',from:0,to:1,kind:'no',car:true,bike:true,bar:{foot:false,bike:true,car:true}};
const nodeLayer=L.layerGroup().addTo(map);
const LETTERS='ABCDEFGH';
function nodeItems(g,n){
  const items=[];
  for(const ei of g.adj[n]){
    const e=g.E[ei];if(!e.alive)continue;
    const o=e.a===n?e.b:e.a,P=[g.lat[n],g.lon[n]],brg=bearingTo(P,[g.lat[o],g.lon[o]]);
    if(!(g.pass(e,'car',1)||g.pass(e,'car',-1)||g.pass(e,'bike',1)||g.pass(e,'bike',-1)))continue;
    if(items.some(it=>angDiff(it.brg,brg)<12))continue;
    const w=g.W[e.w];
    items.push({brg,name:w.name||HWN[w.hw]||'calle'});
  }
  items.sort((a,b)=>a.brg-b.brg);
  return items;
}

async function nodeTap(e){
  if(!NP.on)return;
  const g=G||await ensureGraph();if(!g){toast('Primero hay que bajar las calles de la zona',4000);return;}
  const ll=[e.latlng.lat,e.latlng.lng],r=Math.max(8,22*mppNow()),nd=g.nodeNear(ll[0],ll[1],r);
  if(nd&&g.adj[nd.n].filter(ei=>g.E[ei].alive).length>=3){
    NP.node=nd.n;NP.pt=[g.lat[nd.n],g.lon[nd.n]];NP.items=nodeItems(g,nd.n);
    if(NP.items.length>=3){NP.type='turn';NP.from=0;NP.to=Math.min(1,NP.items.length-1);}
    else{NP.type='barrier';}
  }else{
    const h=g.nearestEdge(ll[0],ll[1],r,x=>g.W[x.w].hw!=='connector');
    if(!h){toast('No hay una calle cerca: tocá sobre una calle o una esquina',4000);return;}
    NP.node=null;NP.pt=[h.lat,h.lon];NP.items=[];NP.type='barrier';
  }
  drawNodeTool();
}
async function nodeSave(){
  if(!NP.pt)return;
  const name=$('#npName').value.trim(),base={id:uid(),lat:+NP.pt[0].toFixed(7),lon:+NP.pt[1].toFixed(7),created:Date.now()};
  let e;
  if(NP.type==='turn'){
    const a=NP.items[NP.from],b=NP.items[NP.to];
    e=Object.assign(base,{type:'turn',fromBrg:Math.round(a.brg),toBrg:Math.round(b.brg),kind:NP.kind,modes:{car:NP.car,bike:NP.bike},name:name||`${a.name} → ${b.name}`});
    if(!NP.car&&!NP.bike){toast('Marcá al menos autos o bicis');return;}
  }else{
    if(!(NP.bar.foot||NP.bar.bike||NP.bar.car)){toast('Marcá qué corta la barrera');return;}
    e=Object.assign(base,{type:'barrier',modes:Object.assign({},NP.bar),name:name||'Barrera'});
  }
  await DB.put('kv','edit:'+e.id,e);
  dropGraph();await drawEdits();
  toast(e.type==='turn'?'Restricción de giro guardada':'Barrera guardada',3000);
  $('#npName').value='';NP.pt=null;drawNodeTool();
}

/* líneas, etiquetas por tramo y resultados (se redibujan mientras se arrastra un punto) */
function drawMeasureLines(){

  const pts=MS.pts,area=MS.mode==='area';
  if(pts.length>=2){
    if(area&&pts.length>=3)L.polygon(pts,{color:'#F04A1C',weight:3,fillColor:'#F04A1C',fillOpacity:.22,interactive:false}).addTo(measLines);
    else{
      L.polyline(pts,{color:'#fff',weight:8,opacity:.85,interactive:false}).addTo(measLines);
      L.polyline(pts,{color:'#F04A1C',weight:4,interactive:false}).addTo(measLines);
    }
    const n=area&&pts.length>=3?pts.length:pts.length-1;
    for(let i=0;i<n;i++){
      const a=pts[i],b=pts[(i+1)%pts.length],pa=map.latLngToContainerPoint(a),pb=map.latLngToContainerPoint(b);
      if(Math.hypot(pa.x-pb.x,pa.y-pb.y)<70)continue;

/* ----- con relieve: largo real sobre el terreno, desnivel, perfil y superficie real ----- */
let relTimer=0,relTok=0;
function scheduleRelief(){
  clearTimeout(relTimer);relTok++;
  const pts=MS.pts,area=MS.mode==='area',out=$('#msRelOut'),prof=$('#msProf');
  MS.relRes=null;
  if(!MS.rel||pts.length<(area?3:2)){out.innerHTML='';prof.innerHTML='';return;}
  out.innerHTML='<div class="mut">Calculando con el relieve…</div>';
  relTimer=setTimeout(runRelief,450);
}
/* altura de la zona: se baja una vez y queda guardada */
async function demForMeasure(pts){
  let a=90,b=-90,c=180,d=-180;
  for(const p of pts){if(p[0]<a)a=p[0];if(p[0]>b)b=p[0];if(p[1]<c)c=p[1];if(p[1]>d)d=p[1];}
  const mg=.004,bb={n:b+mg,s:a-mg,w:c-mg,e:d+mg};
  let z=13;while(z>10&&demTiles(bb,z).length>48)z--;
  const list=demTiles(bb,z);
  if(list.length>150)throw new Error('Es demasiado grande para medir con relieve (más de unos 150 km).');
  let falta=0;
  for(const t of list)if(!(await DB.has('tiles',`dem/${z}/${t.x}/${t.y}`)))falta++;
  if(falta){
    if(!MS.netOK){
      if(S.dataMode==='never')throw new Error('Esta zona no tiene la altura guardada y elegiste no usar internet.');
      if(!(await netAllowed('bajar la altura del terreno')))throw new Error('Sin permiso para bajar la altura de esta zona.');
      MS.netOK=true;
    }
  }
  const dem=await fetchDem(bb,z);
  return {dem,z};
}
async function runRelief(){
  const tok=relTok,pts=MS.pts.map(p=>p.slice()),area=MS.mode==='area',out=$('#msRelOut'),prof=$('#msProf');
  try{
    const {dem,z}=await demForMeasure(pts);
    if(tok!==relTok||!MS.on)return;
    const sample=(la,lo)=>sampleDem(dem,z,la,lo);
    const r=area?terrainArea(pts,sample):reliefProfile(pts,sample);
    if(r.error){out.innerHTML=`<div class="mwarn">⚠️ ${esc(r.error)}</div>`;prof.innerHTML='';return;}
    MS.relRes=r;MS.relKey=JSON.stringify(pts);
    out.innerHTML=area
      ?`<div class="mrel"><b>⛰️ Superficie real: ${fmtArea(r.relief)}</b> <span class="mut">(plano ${fmtArea(r.flat)}, +${((r.factor-1)*100).toFixed(1)} %)</span></div><div class="mut">Altura media ${r.mean} m (de ${r.min} a ${r.max}) · pendiente media ${r.avgSlope.toFixed(0)} %</div>`
      :`<div class="mrel"><b>⛰️ En relieve: ${fmtLen(r.relief)}</b> <span class="mut">(plano ${fmtLen(r.flat)})</span></div><div>↑ ${r.gain} m · ↓ ${r.loss} m · de ${r.start} a ${r.end} m de altura</div><div class="mut">Mín ${r.min} · máx ${r.max} m · pendiente media ${r.avgSlope.toFixed(0)} % · máx ${r.maxSlope.toFixed(0)} %</div>`;
    prof.innerHTML=area?'':profSvg(r);
  }catch(e){
    if(tok===relTok){out.innerHTML=`<div class="mwarn">⚠️ ${esc(e.message||String(e))}</div>`;prof.innerHTML='';}
  }
}
function profSvg(r){
  const W=300,H=70,mn=r.min,mx=r.max,span=Math.max(1,mx-mn),pf=r.profile;
  const xy=pf.map(([d,e])=>[d/r.flat*W,H-6-(e-mn)/span*(H-14)]);
  const line=xy.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  return `<div class="mprof"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><path d="${line} L${W} ${H} L0 ${H} Z" fill="rgba(240,74,28,.22)"/><path d="${line}" fill="none" stroke="#F04A1C" stroke-width="2" vector-effect="non-scaling-stroke"/></svg><span class="a">${mx} m</span><span class="b">${mn} m</span><span class="c">${fmtLen(r.flat)}</span></div>`;
}

/* ---------- Distancia en línea recta en vivo hacia un objetivo ---------- */
const TGT={on:false,lat:0,lon:0,label:'',hist:[],armed:true,timer:0,alertAt:30};
const tgtLine=L.polyline([],{color:'#F04A1C',weight:3,dashArray:'3 8',opacity:.9,interactive:false}).addTo(map);
let tgtMk=null;
function setTarget(lat,lon,label){
  TGT.on=true;TGT.lat=lat;TGT.lon=lon;TGT.label=label||'Objetivo';TGT.hist=[];TGT.armed=true;
  S.tgt={lat,lon,label:TGT.label};saveS();
  if(tgtMk)map.removeLayer(tgtMk);
  tgtMk=L.marker([lat,lon],{interactive:false,zIndexOffset:900,icon:L.divIcon({html:'<div class="tgtm">🎯</div>',className:'',iconSize:[30,30],iconAnchor:[15,26]})}).addTo(map);
  $('#tgt').hidden=false;
  clearInterval(TGT.timer);TGT.timer=setInterval(updTarget,1000);
  updTarget();
}
function clearTarget(){
  TGT.on=false;clearInterval(TGT.timer);TGT.hist=[];
  S.tgt=null;saveS();
  if(tgtMk){map.removeLayer(tgtMk);tgtMk=null;}
  tgtLine.setLatLngs([]);$('#tgt').hidden=true;
}
function updTarget(){
  if(!TGT.on)return;
  const sub=$('#tgtSub'),arrow=$('#tgtArrow');
  if(!lastFix){$('#tgtD').textContent='—';sub.textContent=TGT.label+' · esperando GPS';tgtLine.setLatLngs([]);return;}
  const here=[lastFix.lat,lastFix.lon],there=[TGT.lat,TGT.lon];
  /* altitud (mediana de las últimas lecturas, para que el ruido del GPS no la haga saltar) y velocidad */
  const an=altNow(),alt=an?an.alt:null;
  let spd=lastFix.speed;
  if(spd==null&&fixHist.length>=2){
    const a=fixHist[Math.max(0,fixHist.length-4)],b=fixHist[fixHist.length-1],dt=(b.t-a.t)/1000;
    if(dt>0.5)spd=hav([a.lat,a.lon],[b.lat,b.lon])/dt;
  }
  const fresh=Date.now()-lastFixWall<8000;
  const kmh=spd!=null&&fresh?spd*3.6:null;
  const pace=kmh!=null&&kmh>=1&&kmh<16?` (${Math.floor(60/kmh)}:${String(Math.round((60/kmh%1)*60)%60).padStart(2,'0')} /km)`:'';
  $('#tgtM').textContent=fresh
    ?`⛰️ ${alt!=null?(an.doubt?'≈':'')+Math.round(alt)+' m'+(an.va!=null?' ±'+Math.round(an.va):''):'—'}  ·  ⚡ ${kmh!=null?kmh.toFixed(1)+' km/h'+pace:'—'}`
    :'Sin lectura de GPS reciente';
  const d=hav(here,there),brg=bearingTo(here,there);
  tgtLine.setLatLngs([here,there]);
  $('#tgtD').textContent=fmtLen(d);
  /* velocidad de acercamiento: cuánto se achica la distancia por segundo en los últimos ~30 s */
  const now=Date.now();TGT.hist.push([now,d]);
  while(TGT.hist.length&&now-TGT.hist[0][0]>30000)TGT.hist.shift();
  let eta='';
  if(TGT.hist.length>=8){
    const a=TGT.hist[0],b=TGT.hist[TGT.hist.length-1],v=(a[1]-b[1])/((b[0]-a[0])/1000);
    if(v>0.3&&d>TGT.alertAt)eta=` · ${(v*3.6).toFixed(1)} km/h → ${fmtDur(d/v)} en línea recta`;
  }
  sub.textContent=`${TGT.label} · ${compassWord(brg)} ${Math.round(brg)}°${eta}`;
  arrow.style.transform=`rotate(${Math.round(brg-getB())}deg)`;
  if(d<=TGT.alertAt&&TGT.armed){
    TGT.armed=false;
    try{navigator.vibrate&&navigator.vibrate([200,100,200]);}catch(e){}
    try{navSay&&navSay('Llegaste al objetivo');}catch(e){}
    toast('🎯 Llegaste al objetivo',5000);
  }else if(d>TGT.alertAt*2)TGT.armed=true;
}

/* ---------- Importar GeoJSON y bajar costas y límites de OpenStreetMap ---------- */
const GEO_CAP={feats:400,pts:40000};
let GI=null;
function pickGeoFile(){
  const inp=document.createElement('input');inp.type='file';inp.accept='.geojson,.json,application/geo+json,application/json';
  inp.onchange=async()=>{
    const f=inp.files&&inp.files[0];if(!f)return;
    if(f.size>80e6){toast('El archivo es muy grande (más de 80 MB). Probá con uno más chico o recortado.',7000);return;}
    let gj;try{gj=JSON.parse(await f.text());}catch(e){toast('Ese archivo no es un GeoJSON válido',6000);return;}
    const feats=geoFeatures(gj);
    if(!feats.length){toast('No encontré líneas ni polígonos en ese archivo',6000);return;}
    startGeoImport(feats,f.name.replace(/\.(geo)?json$/i,''),'archivo');
  };
  inp.click();
}
function startGeoImport(feats,name,src){
  const rings=feats.filter(x=>x.type==='ring'),lines=feats.filter(x=>x.type==='line'),pts=feats.reduce((a,x)=>a+x.pts.length,0);
  GI={feats,name,src,kind:'costa',level:4,mode:rings.length&&!lines.length?'lines':'lines',areaKind:'otro',tol:pts>150000?100:pts>30000?50:20,counts:{lines:lines.length,rings:rings.filter(r=>!r.hole).length,holes:rings.filter(r=>r.hole).length,pts}};
  showGeoImport();
}
function showGeoImport(){
  const g=GI,c=g.counts,chip=(act,k,cur,txt)=>`<button data-act="${act}" data-k="${k}" class="${String(k)===String(cur)?'on':''}">${txt}</button>`;
  openSheet('Importar vectores',`<p><b>📄 ${esc(g.name)}</b><br><small class="mut">${c.lines} línea${c.lines===1?'':'s'} · ${c.rings} polígono${c.rings===1?'':'s'}${c.holes?` (con ${c.holes} hueco${c.holes>1?'s':''})`:''} · ${miles(c.pts)} puntos</small></p>
    ${c.lines||(c.rings&&g.mode==='lines')?`<label>Las líneas son</label><div class="chips">${chip('gk','costa',g.kind,'🌊 Costa')}${chip('gk','limite',g.kind,'🚩 Límite')}${chip('gk','rio',g.kind,'🏞️ Río')}</div>`:''}
    ${g.kind==='limite'&&(c.lines||g.mode==='lines')?`<label>Qué límite es</label><div class="chips">${[[2,'País'],[4,'Provincia'],[6,'Departamento'],[8,'Municipio']].map(([v,n])=>chip('gl',v,g.level,n)).join('')}</div>`:''}
    ${c.rings?`<label>Los polígonos se importan como</label><div class="chips">${chip('gm','lines',g.mode,'Solo el contorno (líneas)')}${chip('gm','areas',g.mode,'Áreas rellenas')}</div>`:''}
    ${c.rings&&g.mode==='areas'?`<label>Tipo de área</label><div class="chips">${['agua','bosque','parque','nieve','playa','otro'].map(k=>chip('ga',k,g.areaKind,AREA_UI[k][0]+' '+AREA_UI[k][1].split(' ')[0])).join('')}</div>`:''}
    <label>Detalle (se quita lo que no cambia la forma a más de…)</label>
    <div class="chips">${[[5,'5 m'],[20,'20 m'],[50,'50 m'],[100,'100 m'],[500,'500 m']].map(([v,n])=>chip('gt',v,g.tol,n)).join('')}</div>
    <p class="mut">Se importan hasta ${GEO_CAP.feats} elementos y ${miles(GEO_CAP.pts)} puntos; si hay más, el detalle baja solo. Todo queda agrupado y lo podés editar punto por punto.</p>
    <div class="row" style="margin-top:10px"><button class="btn primary" data-act="go">📥 Importar</button><button class="btn" data-act="no">Cancelar</button></div>`,
    async(a,d)=>{
      if(a==='gk'){g.kind=d.k;showGeoImport();}
      else if(a==='gl'){g.level=+d.k;showGeoImport();}
      else if(a==='gm'){g.mode=d.k;showGeoImport();}
      else if(a==='ga'){g.areaKind=d.k;showGeoImport();}
      else if(a==='gt'){g.tol=+d.k;showGeoImport();}

/* convierte la lista a trazos y áreas guardados, todos del mismo grupo */
async function runGeoImport(){
  const g=GI;
  let items=[];
  for(const f of g.feats){
    if(f.type==='line')items.push({kind:g.kind,level:g.level,name:f.name,pts:f.pts,t:'path'});
    else if(f.type==='ring'){
      if(g.mode==='areas'){if(!f.hole)items.push({kind:g.areaKind,name:f.name,pts:f.pts,t:'area'});}
      else items.push({kind:g.kind,level:g.level,name:f.name,pts:f.pts.concat([f.pts[0]]),t:'path'});
    }

  await saveGeoItems(items,g.tol,g.name,g.src,'');

async function saveGeoItems(items,tol,gname,src,attr){

  if(!list.length){toast('Con ese detalle no quedó nada: probá uno más fino',6000);showGeoImport&&GI&&showGeoImport();return;}

    let e;

async function rebuildAreasFor(id){

let WGC={key:'',wg:null};
async function kayakWG(){
  const eds=await DB.all('kv','edit:');
  const rivers=[],lakes=[];let np=0,mx=0;
  for(const e of eds){
    if(e.type==='path'&&e.kind==='rio'&&e.pts&&e.pts.length>1){
      const q=e.props||{},fl=q.flow===1?1:q.flow===-1?-1:0,ww=q.ww||'river';
      const cur=fl?(S.kCur==null?2:S.kCur)/3.6*(ww==='canal'?0:ww==='stream'?0.6:1):0;
      rivers.push({pts:fl===-1?e.pts.slice().reverse():e.pts,name:e.name||'',flow:fl?1:0,cur});np+=e.pts.length;mx=Math.max(mx,e.created||0);
    }else if(e.type==='area'&&e.kind==='agua'&&e.pts&&e.pts.length>=3){lakes.push({pts:e.pts,name:e.name||''});np+=e.pts.length;mx=Math.max(mx,e.created||0);}
  }
  const key=`${rivers.length}|${lakes.length}|${np}|${mx}|${S.kCur}`;

}

function kayakLine(r){

  const hard=r.hard>200?`<br><span style="color:#C0392B"><b>⚠️ ${fmtD(r.hard)} contra una corriente fuerte: ${sw?'nadando':'remando'} avanzás menos de la mitad de tu velocidad.</b></span>`:'';

function nearestWater(p,w,includeOthers){
  let best=null;
  const edge=(pts,closed,what,type)=>{
    const n=pts.length,m=closed?n:n-1;
    for(let i=0;i<m;i++){const pr=projSeg(pts[i],pts[(i+1)%n],p);if(!best||pr.d<best.d)best={d:pr.d,pt:pr.pt,what,type};}
  };
  for(const lk of w.lakes){if(pip(p[0],p[1],lk.pts))return {d:0,pt:p,what:lk.name||'lago',type:'lake',inside:true};edge(lk.pts,true,lk.name||'lago','lake');}
  for(const r of w.rivers)edge(r.pts,false,r.name||'río','river');
  if(includeOthers)for(const o of w.others){if(pip(p[0],p[1],o.pts)||true)edge(o.pts,true,o.name||'área','other');}
  return best;
}
/* estado de las dos puntas de un río */
function waterEnds(pts,w){
  return [pts[0],pts[pts.length-1]].map(p=>{
    const n=nearestWater(p,w,false);
    if(n&&(n.inside||n.d<=(n.type==='lake'?KJOIN.lake:KJOIN.river)))return {ok:true,what:n.what,type:n.type,d:n.d,inside:!!n.inside};
    const o=nearestWater(p,w,true);
    return {ok:false,near:n,other:o&&o.type==='other'&&(!n||o.d<n.d)?o:null};
  });
}

    s.other&&s.other.d<=2000?`${nm[i]}: ⚠️ hay un área "${esc(s.other.what)}" a ${fmtLen(s.other.d)}, pero no es de tipo Agua`:
    s.near&&s.near.d<=20000?`${nm[i]}: ⚠️ suelto, a ${fmtLen(s.near.d)} de ${esc(s.near.what)}`:`${nm[i]}: ${i?'suelto':'naciente'} (sin agua cerca)`).join('<br>');
}

/* calcula cada modo por etapas: salida → parada 1 → … → destino */
async function applyStops(g,from,hz){
  const L=stopsList();if(!L.length)return;
  const pts=[from].concat(L,[RT.to]);
  let D=0;for(let i=1;i<pts.length;i++)D+=hav([pts[i-1].lat,pts[i-1].lon],[pts[i].lat,pts[i].lon]);
  for(const m of RMODES){
    const cur=RT.res[m];
    if(cur&&cur.err&&['sinagua','sinred'].includes(cur.err))continue;
    if(m==='foot'&&D>150000){RT.res[m]={err:'lejos'};continue;}
    if(m==='bike'&&D>600000){RT.res[m]={err:'lejos'};continue;}
    if(m==='swim'&&D>60000){RT.res[m]={err:'lejos'};continue;}
    if(!isWater(m)&&!g)continue;
    const legs=[];let bad=null;
    for(let i=0;i<pts.length-1&&!bad;i++){
      const r=isWater(m)?await waterRouteFor(m,pts[i],pts[i+1]):findRoute(g,m,pts[i],pts[i+1],S.pref);
      if(r.err)bad={i,why:r.err};else legs.push(r);
    }
    if(bad){RT.res[m]={err:'tramo',why:bad.why,from:pts[bad.i].label||'Salida',to:pts[bad.i+1].label||'Destino'};continue;}
    const r=chainRoutes(legs,L);
    r.hzs=isWater(m)?[]:navInit(r,m,hz).hzs;
    RT.res[m]=r;
  }
}

/* Registro del GPS: las últimas ~15 min de lecturas tal como las da el teléfono (para revisar datos raros, como la altitud en un avión) */
let GLOG=[],glogT=0;
function gpsLog(f){
  GLOG.push({t:f.t,lat:+f.lat.toFixed(6),lon:+f.lon.toFixed(6),acc:f.acc!=null?Math.round(f.acc):null,alt:f.alt!=null?Math.round(f.alt):null,va:f.altAcc!=null?Math.round(f.altAcc):null,kmh:f.speed!=null?+(f.speed*3.6).toFixed(1):null});
  if(GLOG.length>900)GLOG.shift();
  if(Date.now()-glogT>30000){glogT=Date.now();DB.put('kv','gpslog',GLOG.slice(-900)).catch(()=>{});}
}
async function loadGpsLog(){try{const g=await DB.get('kv','gpslog');if(Array.isArray(g))GLOG=g.concat(GLOG).slice(-900);}catch(e){}}
/* Altitud que se muestra: mediana de las lecturas de los últimos 15 s (no de lecturas viejas) y con la precisión vertical si el teléfono la informa */
function altNow(){
  const lf=lastFix;if(!lf)return null;
  const rec=fixHist.filter(f=>f.alt!=null&&isFinite(f.alt)&&Math.abs(lf.t-f.t)<=15000);
  if(!rec.length)return null;
  const arr=rec.map(f=>f.alt).sort((a,b)=>a-b),alt=arr[Math.floor(arr.length/2)];
  const va=lf.altAcc!=null&&isFinite(lf.altAcc)?lf.altAcc:null;
  return {alt,va,doubt:va!=null&&va>50,n:rec.length};
}
/* ----- perfil de desniveles de la ruta elegida ----- */
async function fetchDemList(list,z,prog){
  const tiles=new Map();let i=0,done=0;
  const worker=async()=>{
    while(i<list.length){
      const t=list[i++];
      try{
        const dk=`dem/${z}/${t.x}/${t.y}`;
        let blob=null;try{blob=await DB.get('tiles',dk);}catch(er){}
        if(!blob){
          blob=await getTileBlob(`https://s3.amazonaws.com/elevation-tiles-prod/terrarium/${z}/${t.x}/${t.y}.png`);
          try{await DB.put('tiles',dk,blob);}catch(er){}
        }
        const bmp=await createImageBitmap(blob);
        const c=document.createElement('canvas');c.width=c.height=256;
        const ctx=c.getContext('2d',{willReadFrequently:true});ctx.drawImage(bmp,0,0);
        const d=ctx.getImageData(0,0,256,256).data,el=new Float32Array(65536);
        for(let k=0;k<65536;k++)el[k]=d[k*4]*256+d[k*4+1]+d[k*4+2]/256-32768;
        tiles.set(t.x+'/'+t.y,el);
      }catch(e){}
      done++;if(prog)prog(done,list.length);
    }
  };
  await Promise.all(Array.from({length:4},worker));
  return tiles;
}
async function demMissing(list,z){let n=0;for(const t of list)if(!(await DB.has('tiles',`dem/${z}/${t.x}/${t.y}`)))n++;return n;}
async function routeProfile(r,out,opts){
  opts=opts||{};
  const z=demZoomForLength(r.dist),step=Math.max(15,r.dist/2500),list=demTilesAlong(r.coords,z,step);
  const falta=await demMissing(list,z);
  if(falta&&!opts.noAsk){
    if(S.dataMode==='never'){out.innerHTML='<p class="mwarn">⚠️ Falta la altura de esta zona y elegiste no usar internet (Ajustes → Datos móviles).</p>';return null;}
    const cel=S.dataMode==='wifi'&&connType()==='cellular';
    if(!confirm(`Para el perfil hay que bajar ${falta} tesela${falta>1?'s':''} de altura (unos ${Math.max(1,Math.round(falta*0.12))} MB)${cel?', con datos móviles':''}. Quedan guardadas para la próxima. ¿Seguir?`))return null;
  }
  const t0=performance.now();
  out.innerHTML='<p class="mut">Calculando el perfil…</p>';
  const dem=await fetchDemList(list,z,(d,n)=>{if(falta)out.innerHTML=`<p class="mut">Bajando la altura… ${d} de ${n}</p>`;});
  const p=reliefProfile(r.coords,(la,lo)=>sampleDem(dem,z,la,lo),{step});
  const ms=performance.now()-t0;
  if(p.error){out.innerHTML=`<p class="mwarn">⚠️ ${esc(p.error)}${falta?' (¿sin conexión?)':''}</p>`;return null;}
  r.prof=p;
  out.innerHTML=r.profHtml=`<div class="card"><b>⛰️ Perfil de desniveles</b><br>↑ ${miles(p.gain)} m · ↓ ${miles(p.loss)} m · de ${p.start} a ${p.end} m de altura<br><small class="mut">Mín ${p.min} · máx ${p.max} m${step<=100?` · pendiente máx ${p.maxSlope.toFixed(0)} %`:''} · altura con detalle de ~${Math.round(40075000*Math.cos(r.coords[0][0]*Math.PI/180)/Math.pow(2,z)/256)} m, por eso es aproximado</small>${profSvg(p)}</div>`;
  return {p,ms,z,tiles:list.length,falta};
}

function glogSvg(){
  const pts=GLOG.filter(f=>f.alt!=null);if(pts.length<3)return '';
  const W=300,H=60,t0=pts[0].t,t1=pts[pts.length-1].t||t0+1,mn=Math.min(...pts.map(f=>f.alt)),mx=Math.max(...pts.map(f=>f.alt)),sp=Math.max(1,mx-mn);
  const d=pts.map((f,i)=>(i?'L':'M')+((f.t-t0)/Math.max(1,t1-t0)*W).toFixed(1)+' '+(H-4-(f.alt-mn)/sp*(H-10)).toFixed(1)).join(' ');
  return `<div class="mprof"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><path d="${d}" fill="none" stroke="#1E6BFF" stroke-width="2" vector-effect="non-scaling-stroke"/></svg><span class="a">${mx} m</span><span class="b">${mn} m</span><span class="c">altitud del GPS</span></div>`;
}

function evJoinWater(){

/* dibujo libre con el dedo */
function endFree(){
  if(TR.drawing){TR.drawing=false;try{map.dragging.enable();}catch(e){}}
}
(function(){
  const el=$('#map'),ptrs=new Set();
  const pos=e=>{const p=map.mouseEventToLatLng(e);return [p.lat,p.lng];};
  el.addEventListener('pointerdown',e=>{
    if(e.pointerType==='pen'&&!S.penSeen){S.penSeen=true;saveS();}
    /* con S Pen: el lápiz dibuja y los dedos solo mueven el mapa (también si apoyás la mano) */
    if(TR.on&&TR.mode==='free'&&S.penSeen&&S.penMode!==false&&e.pointerType==='touch')return;
    ptrs.add(e.pointerId);
    if(!TR.on||TR.mode!=='free')return;
    if(ptrs.size>1){ // segundo dedo: es un gesto de mapa, no un trazo
      if(TR.drawing){const n=TR.strokes.pop()||0;for(let i=0;i<n;i++){TR.pts.pop();TR.snapped.pop();}drawTrace();}
      endFree();return;
    }
    TR.drawing=true;TR.pid=e.pointerId;
    try{map.dragging.disable();}catch(er){}
    el.style.touchAction='none';
    const raw=pos(e),sn=TR.pts.length?null:traceSnap(raw);
    TR.strokes.push(1);TR.pts.push(sn||raw);TR.snapped.push(!!sn);
    e.stopPropagation();
    try{el.setPointerCapture(e.pointerId);}catch(er){}
    drawTrace();
  },true);
  el.addEventListener('pointermove',e=>{
    if(!TR.drawing||e.pointerId!==TR.pid)return;
    const p=pos(e),last=TR.pts[TR.pts.length-1];
    if(hav(last,p)<Math.max(1.2,4*mppNow()))return;
    TR.pts.push(p);TR.snapped.push(false);TR.strokes[TR.strokes.length-1]++;
    e.stopPropagation();drawTrace();
  },true);
  const up=e=>{
    ptrs.delete(e.pointerId);
    if(!TR.drawing||e.pointerId!==TR.pid)return;
    /* al soltar: se aliviana el trazo y se pega el final a una calle si está cerca */
    const n=TR.strokes[TR.strokes.length-1],start=TR.pts.length-n,seg=TR.pts.slice(start);
    const simp=seg.length>2?simplifyDP(seg,Math.max(.8,1.6*mppNow())):seg;
    const last=simp[simp.length-1],sn=traceSnap(last);
    TR.pts.splice(start,n,...simp);
    TR.snapped.splice(start,n,...simp.map(()=>false));
    if(sn&&simp.length>1){TR.pts[TR.pts.length-1]=sn;TR.snapped[TR.snapped.length-1]=true;}
    if(start===0&&TR.snapped[0]===false){const s0=traceSnap(TR.pts[0]);if(s0){TR.pts[0]=s0;TR.snapped[0]=true;}}
    TR.strokes[TR.strokes.length-1]=simp.length;
    endFree();drawTrace();
  };
  el.addEventListener('pointerup',up,true);el.addEventListener('pointercancel',up,true);
})();
